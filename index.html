/* ---------- looks: bulb colors, day/night, intro, celebrations, season ---------- */
const PALETTE = {
  warm:  {n:"Warm white", c:"#FFB23E"}, white:{n:"Pure white", c:"#EEF3FF"}, red:{n:"Red", c:"#E8352B"},
  green: {n:"Green", c:"#22B04F"},      blue: {n:"Blue", c:"#2F6BFF"},       purple:{n:"Purple", c:"#8E4DFF"},
  orange:{n:"Orange", c:"#FF7A1A"},     yellow:{n:"Yellow", c:"#FFD21F"},    teal:{n:"Teal", c:"#14B8A6"} };
const COMBOS = [
  ["Warm white",["warm"]], ["Pure white",["white"]], ["Warm + pure white",["warm","white"]],
  ["Classic multicolor",["red","green","blue","orange","yellow"]], ["Red & green",["red","green"]],
  ["Candy cane",["red","white"]], ["Red, white & green",["red","white","green"]], ["Blue & white",["blue","white"]],
  ["Icy",["white","blue","teal"]], ["Red, white & blue",["red","white","blue"]], ["Green & gold",["green","yellow"]],
  ["Purple & teal",["purple","teal"]], ["Halloween",["orange","purple"]], ["Rainbow",["red","orange","yellow","green","teal","blue","purple","white","warm"]] ];
const LOOK_DEF = {colors:["warm"], mode:"auto", intro:"daily", snow:true, buzz:true};
function look(){ try{ const o={...LOOK_DEF,...JSON.parse(ls("look")||"{}")}; o.colors=(o.colors||[]).filter(k=>PALETTE[k]); if(!o.colors.length) o.colors=["warm"]; return o; }catch(e){ return {...LOOK_DEF}; } }
function setLook(p){ ls("look",JSON.stringify({...look(),...p})); applyLook(); if(p&&p.colors&&window.PL&&PL.setLook) PL.setLook(p.colors).catch(()=>{}); }
const bulbColors = () => look().colors.map(k=>PALETTE[k].c);
const lum = h => { const n=parseInt(h.slice(1),16), f=v=>{ v/=255; return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4); }; return .2126*f(n>>16&255)+.7152*f(n>>8&255)+.0722*f(n&255); };

/* day / night */
function sunriseFor(dateISO){ const ss=sunsetFor(dateISO); if(!ss) return null; const d=parseISO(dateISO); const noon=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate(),17,37)); return new Date(noon.getTime()-(ss-noon)); }
function nightNow(){ const t=todayISO(), now=new Date(), ss=sunsetFor(t), sr=sunriseFor(t); return ss&&sr ? (now>=ss||now<sr) : (now.getHours()>=18||now.getHours()<7); }
function effectiveDark(){ const m=look().mode; return m==="dark" || (m==="auto"&&nightNow()) || (m==="system"&&matchMedia("(prefers-color-scheme: dark)").matches); }
function applyLook(){
  const L=look(), root=document.documentElement, dark=effectiveDark();
  if(L.mode==="system") delete root.dataset.theme; else root.dataset.theme = dark?"dark":"light";
  let a=PALETTE[L.colors[0]].c;
  // keep the main button color readable on the background
  if(!dark && lum(a)>.6) a=`color-mix(in srgb, ${a} 62%, #6b5a2a)`;
  const ink = lum(PALETTE[L.colors[0]].c)>.35 ? "#1a1406" : "#ffffff";
  root.style.setProperty("--amber", a);
  root.style.setProperty("--amber-ink", ink);
  root.style.setProperty("--amber-soft", `color-mix(in srgb, ${PALETTE[L.colors[0]].c} ${dark?18:22}%, ${dark?"#161e1a":"#ffffff"})`);
  root.style.setProperty("--amber-text", `color-mix(in srgb, ${PALETTE[L.colors[0]].c} ${dark?85:60}%, ${dark?"#ffffff":"#141916"})`);
  root.classList.toggle("night-map", dark);
  const meta=document.querySelector('meta[name="theme-color"]'); if(meta) meta.content=dark?"#080c0a":"#111916";
  paintBulbs(true);
}
setInterval(()=>{ if(look().mode==="auto") { const d=effectiveDark(); if((document.documentElement.dataset.theme==="dark")!==d) { applyLook(); if(S.view==="map"&&typeof drawMap==="function") drawMap(); } } }, 60e3);

/* every lit bulb on the page takes the next color in your set */
let paintQ=0;
function paintBulbs(force){
  const C=bulbColors(); let i=0;
  document.querySelectorAll(".bulb").forEach(b=>{ if(b.closest("#intro,#routelit,.look-swatch")) return; const c=C[i++%C.length]; if(force||b.dataset.bc!==c){ b.dataset.bc=c; b.style.setProperty("--bc",c); } });
}
new MutationObserver(()=>{ if(paintQ) return; paintQ=requestAnimationFrame(()=>{ paintQ=0; paintBulbs(); }); }).observe(document.documentElement,{childList:true,subtree:true});

/* phone buzz */
const buzz = p => { if(look().buzz && navigator.vibrate) try{ navigator.vibrate(p); }catch(e){} };

/* snow */
function snowIn(el, density=60){
  if(!el || el.querySelector("canvas.snow") || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv=document.createElement("canvas"); cv.className="snow"; el.prepend(cv);
  const ctx=cv.getContext("2d"); let W=0,H=0, flakes=[];
  const size=()=>{ const r=el.getBoundingClientRect(), d=Math.min(2,devicePixelRatio||1); W=r.width; H=r.height; cv.width=W*d; cv.height=H*d; ctx.setTransform(d,0,0,d,0,0);
    flakes=[...Array(Math.round(density*W*H/400000)+8)].map(()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*2.2+.6,s:Math.random()*.6+.25,w:Math.random()*Math.PI*2})); };
  size(); addEventListener("resize",size);
  (function tick(){ if(!cv.isConnected) return; ctx.clearRect(0,0,W,H); ctx.fillStyle="rgba(255,255,255,.85)";
    for(const f of flakes){ f.y+=f.s; f.w+=.01; f.x+=Math.sin(f.w)*.3; if(f.y>H+4){ f.y=-4; f.x=Math.random()*W; } ctx.beginPath(); ctx.arc(f.x,f.y,f.r,0,7); ctx.fill(); }
    requestAnimationFrame(tick); })();
}
const md = () => { const d=new Date(); return (d.getMonth()+1)*100+d.getDate(); };
const snowSeason = () => look().snow && (md()>=1101 || md()<=110);
const christmasWeek = () => md()>=1219 && md()<=1226;

/* the startup "plug-in" */
function strandSVG(n, w, h, cls){
  const C=bulbColors(), pts=[...Array(n)].map((_,i)=>{ const x=(i+.5)*w/n, y=h*.38+Math.sin(i/(n-1)*Math.PI)*h*.22; return [x,y]; });
  const path="M0,"+(h*.3)+" "+pts.map(([x,y])=>`L${x.toFixed(1)},${y.toFixed(1)}`).join(" ")+` L${w},${h*.3}`;
  return `<svg class="${cls}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><path d="${path}" fill="none" stroke="#2a6e4e" stroke-width="3" stroke-linejoin="round"/></svg>`+
    pts.map(([x,y],i)=>`<span class="ib" style="left:${(x/w*100).toFixed(2)}%;top:${(y/h*100).toFixed(2)}%;--bc:${C[i%C.length]};--d:${i}"></span>`).join("");
}
function playIntro(force){
  const L=look();
  // on a fresh sign-in the welcome screen does the lights instead
  if(!force){ const d=new Date(Date.now()-3*3600e3); if(ls("prolight-day")!==d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()) return; }
  if(!force){ if(L.intro==="off") return; if(L.intro==="daily" && ls("introDay")===todayISO()) return; }
  ls("introDay",todayISO());
  const old=$("#intro"); if(old) old.remove();
  const el=document.createElement("div"); el.id="intro"; el.setAttribute("role","presentation");
  el.innerHTML=`<div class="intro-strand">${strandSVG(9,900,160,"intro-cord")}</div>
    <img class="intro-logo" src="/brand/prolight.png" alt="ProLight"><div class="intro-sub">Season board</div>`;
  document.body.appendChild(el);
  if(snowSeason()) snowIn(el, christmasWeek()?120:70);
  const done=()=>{ if(!el.isConnected) return; el.classList.add("out"); setTimeout(()=>el.remove(),450); };
  el.addEventListener("click",done);
  setTimeout(done, matchMedia("(prefers-reduced-motion: reduce)").matches?900:2300);

/* bulb pop when a stop is done, and the whole route lighting up */
S.pop = S.pop || null;
const popCls = (j,v) => S.pop && S.pop.k===j.id+"|"+v.id && Date.now()-S.pop.t<1600 ? " pop" : "";

/* season header: countdown, houses lit, then takedown */
function seasonBar(){
  const all=jobsArr().filter(j=>j.stage!=="cancelled" && (j.visits||[]).some(v=>v.type==="install"));
  if(!all.length) return "";
  const st=all.map(status), lit=st.filter(s=>s==="lit"||s==="partial").length, down=st.filter(s=>s==="down").length, total=all.length;
  const t=parseISO(todayISO()), y=t.getMonth()===0||t.getMonth()===1 ? t.getFullYear()-1 : t.getFullYear();
  const xmas=new Date(y,11,25), days=Math.round((xmas-t)/864e5);
  const after = days<0;
  let txt, on, n=Math.min(24,total);
  if(!after){ txt = days===0 ? `Merry Christmas · ${lit+down} houses lit` : `${days} day${days>1?"s":""} to Christmas · ${lit+down} of ${total} houses lit`; on=Math.round((lit+down)/total*n); }
  else { const up=lit+down; txt = `Takedown · ${down} of ${up} down`; on=up?Math.round((up-down)/up*n):0; }
  return `<div class="season ${after?"after":""} ${christmasWeek()?"xmas":""}"><span class="season-t">${esc(txt)}</span><span class="season-strand">${[...Array(n)].map((_,i)=>`<span class="bulb ${i<on?"on":""}"></span>`).join("")}</span></div>`;
}

function lookPanel(){

  return `<fieldset class="look"><legend>Look</legend>

/* where it fits best: the crew route over the next 5 days that it adds the fewest miles to */
function bestFit(j, skipVid){
  if(!hasLL(j)) return null;
  let best=null;
  for(let d=0; d<5; d++){ const day=addDays(todayISO(),d);
    for(const c of crews()){
      const st=stopsFor(day,c.id).filter(s=>!(s.j.id===j.id&&s.v.id===skipVid));
      if(!st.length) continue;
      const pts=[shop(),...st.map(s=>hasLL(s.j)?s.j:null),shop()];
      for(let i=0;i<pts.length-1;i++){ const a=pts[i], b=pts[i+1]; if(!a||!b) continue;
        const add=legMiles(a,j)+legMiles(j,b)-legMiles(a,b), score=add+d*1.5;
        if(!best||score<best.score) best={day,crew:c.id,idx:i,add,score}; }
    }
  }
  return best;
}
async function placeSvc(jid, vid, day, crew, idx){
  const j=S.jobs.get(jid), visits=(j.visits||[]).map(x=>({...x})), v=visits.find(x=>x.id===vid);
  v.date=day; v.crew=crew; v.crews=[]; v.order=null; if(v.orders) delete v.orders;
  await S.db.doc("jobs/"+jid).update({visits,updatedAt:new Date().toISOString()});
  if(idx==null) return;
  const list=stopsFor(day,crew), me=list.findIndex(s=>s.j.id===jid&&s.v.id===vid);
  if(me<0) return; const [it]=list.splice(me,1); list.splice(Math.min(idx,list.length),0,it);
  const changes=new Map();
  list.forEach((s,i)=>{ const base=changes.get(s.j.id)||(S.jobs.get(s.j.id).visits||[]).map(x=>({...x})); const t=base.find(x=>x.id===s.v.id); if(ordOf(t,crew)!==i+1){ setOrd(s.j,t,crew,i+1); changes.set(s.j.id,base); } });
  for(const [id,vs] of changes) await S.db.doc("jobs/"+id).update({visits:vs});
}

/* ---------- day clock: shop + driving time between jobs ----------

function myOpenGeneral(){ for(const [id,e] of S.log) if(e.kind==="clock"&&e.general&&e.by===S.me.id&&!e.out) return {id,...e}; return null; }

const OT_AFTER = 40;
const payRate = id => +(((S.payroll.rates||{})[id]||{}).rate)||0;
const otOff = id => ((S.payroll.rates||{})[id]||{}).ot===false;
function payWeek(){
  const days=[...Array(7)].map((_,i)=>addDays(S.week,i)), set=new Set(days);
  const rows=[...S.log.entries()].map(([id,e])=>({id,...e})).filter(e=>e.kind==="clock"&&!e.pending&&e.in&&set.has(isoOf(e.in))&&!isSS(e.by)).sort((a,b)=>a.in.localeCompare(b.in));
  const ppl=new Map(), touch=id=>{ if(!ppl.has(id)) ppl.set(id,{id,ms:0,job:0,gen:0,open:0,days:new Set(),comm:0,sales:[]}); return ppl.get(id); };
  for(const r of rows){ const p=touch(r.by), m=clockMs(r); p.ms+=m; r.general?p.gen+=m:p.job+=m; if(!r.out) p.open++; p.days.add(isoOf(r.in)); }
  for(const s of allSales()) if(s.earnedOn&&set.has(s.earnedOn)&&!s.paidAt){ const p=touch(s.by); p.comm+=s.comm; p.sales.push(s); }
  for(const id of Object.keys(S.payroll.rates||{})) if(payRate(id)>0 && !isSS(id) && (PL.staff().find(x=>x.id===id)||{}).active) touch(id);
  const out=[...ppl.values()].map(p=>{ const hrs=Math.round(p.ms/36e4)/10, noOt=otOff(p.id), reg=noOt?hrs:Math.min(hrs,OT_AFTER), ot=noOt?0:Math.max(0,Math.round((hrs-OT_AFTER)*10)/10), rate=payRate(p.id);
    return {...p, hrs, reg, ot, rate, regPay:reg*rate, otPay:ot*rate*1.5, total:reg*rate+ot*rate*1.5+p.comm, name:staffName(p.id), title:(PL.staff().find(x=>x.id===p.id)||{}).title||""}; })
    .sort((a,b)=>a.name.localeCompare(b.name));
  return {days, rows, people:out};
}

const isClock = e => e.kind==="clock" && !e.pending;
function timeReqs(){ return [...S.log.entries()].map(([id,e])=>({id,...e})).filter(e=>e.kind==="timereq").sort((a,b)=>String(b.at).localeCompare(String(a.at))); }
const pendingReqs = () => timeReqs().filter(r=>r.status==="pending");
const managers = () => PL.staff().filter(p=>p.active&&p.can_manage);
const canApprove = r => !!S.me.manage;
const tfmt = x => x ? new Date(x).toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"}) : "–";
const clockLabel = e => e.general ? (e.where==="shop"?"Shop":"Driving") : (clientOf(S.jobs.get(e.jobId)||{}).name||"Job");
const reqCount = () => S.me.manage ? pendingReqs().filter(canApprove).length : 0;

const myWeekStart = () => addDays(monday(todayISO()), 7*(S.myWk||0));
function myTime(){
  if(!S.me.canLog || isSS(S.me.id)) return "";
  const ws=myWeekStart(), days=new Set([...Array(7)].map((_,i)=>addDays(ws,i))), own=!!S.me.owner;
  const mine=[...S.log.entries()].map(([id,e])=>({id,...e})).filter(e=>e.kind==="clock"&&e.by===S.me.id&&e.in&&days.has(isoOf(e.in))).sort((a,b)=>b.in.localeCompare(a.in));
  const reqs=timeReqs().filter(r=>r.by===S.me.id).slice(0,6), pend=new Set(reqs.filter(r=>r.status==="pending").map(r=>r.target));
  const tot=mine.filter(e=>!e.pending).reduce((t,e)=>t+clockMs(e),0);
  return `<fieldset><legend>My time · ${(S.myWk||0)===0?"this week":"week of "+esc(fmtDay(ws))} · ${fmtDur(tot)}</legend>
    <div class="bar" style="margin-bottom:8px"><button type="button" class="btn small" data-act="mt-wk" data-v="-1" aria-label="Previous week">‹ Prev</button>${(S.myWk||0)<0?`<button type="button" class="btn small" data-act="mt-wk" data-v="1" aria-label="Next week">Next ›</button><button type="button" class="btn small" data-act="mt-wk" data-v="0">This week</button>`:""}</div>
    ${mine.length?`<div class="rows">${mine.map(e=>`<div class="row" style="cursor:default"><span class="m"><span class="n">${esc(fmtDay(isoOf(e.in),{weekday:"short",month:"short",day:"numeric"}))} · ${esc(clockLabel(e))}</span>
      <span class="s mono">${tfmt(e.in)} – ${e.out?tfmt(e.out):"now"} · ${fmtDur(clockMs(e))}${e.pending?" · waiting for approval":""}${e.source==="jobber"?" · from Jobber":e.edited?" · fixed":""}</span></span>
      <span class="r">${pend.has(e.id)||e.pending?`<span class="st booked">Requested</span>`:own?`<button type="button" class="btn small" data-act="clock-edit" data-id="${esc(e.id)}">Edit</button>`:`<button type="button" class="btn small" data-act="treq-fix" data-v="${esc(e.id)}">Request fix</button>`}</span></div>`).join("")}</div>`:`<p class="count">No time yet this week.</p>`}
    <div class="bar" style="margin-top:8px"><button type="button" class="btn small" data-act="treq-add">+ ${own?"Add time":"Add missing time"}</button>${own?`<button type="button" class="btn small" data-act="jbh-open">Pull hours from Jobber</button>`:""}</div>
    ${reqs.length?`<p class="eyebrow" style="margin:10px 0 4px">My requests</p>${reqs.map(r=>`<div class="count" style="font-size:13px">${esc(fmtDay(isoOf(r.at)))}: ${esc(r.summary||"")} · <b>${r.status==="pending"?"Waiting":r.status==="approved"?"Approved":r.status==="denied"?"Denied":"Canceled"}</b>${r.note?` (${esc(r.note)})`:""}${r.status==="pending"?` · <button type="button" class="linkbtn" data-act="treq-cancel" data-v="${esc(r.id)}">Cancel</button>`:""}</div>`).join("")}`:""}
    <small>${own?"You can edit your own time directly. Every change is marked on the payroll detail.":"Location missed something, or you forgot to clock in or out? Send a fix and a manager approves it."}</small></fieldset>`;
}
function dTimeReq(key){
  const [mode,cid]=key.split("|"), e=mode==="fix"?S.log.get(cid):null;

  const ws=myWeekStart(), day=e?isoOf(e.in):((S.myWk||0)===0?todayISO():ws), own=!!S.me.owner&&!e;
  const stops=[...new Map([...Array(9)].flatMap((_,i)=>stopsFor(addDays(ws,i-1),"all")).map(s=>[s.j.id+"|"+s.v.id,s])).values()].sort((a,b)=>String(a.v.date).localeCompare(String(b.v.date)));

      ${e?"":`<div class="f"><label for="tq-type">What</label><select id="tq-type"><option value="job">At a job</option><option value="shop">At the shop</option><option value="travel">Driving</option></select></div>`}</div>

  return drawerShell(e?"Fix my time":own?"Add time":"Add missing time", (PL.me()||{}).name||"", b);

async function saveTimeReq(form){
  const [mode,cid]=form.dataset.key.split("|"), e=mode==="fix"?S.log.get(cid):null;
  const day=e?isoOf(e.in):$("#tq-day").value, i=$("#tq-in").value, o=$("#tq-out").value, why=$("#tq-why").value.trim();
  const at=(t)=>new Date(day+"T"+t+":00").toISOString();
  if(!day||!i||!o){ $("#tq-err").textContent="Fill in the day, start and end."; return; }
  let pin=at(i), pout=at(o); if(new Date(pout)<=new Date(pin)) pout=new Date(new Date(pout).getTime()+864e5).toISOString();
  const own=!!S.me.owner&&!e;
  if(!why&&!own){ $("#tq-err").textContent="Say what happened."; return; }
  const now=new Date().toISOString();
  try{
    if(e){
      await S.db.collection("log").add({kind:"timereq",status:"pending",target:cid,propIn:pin,propOut:pout,reason:why,by:S.me.id,at:now,
        summary:`${clockLabel(e)} ${tfmt(e.in)}–${e.out?tfmt(e.out):"open"} → ${tfmt(pin)}–${tfmt(pout)}`});
    } else {
      const type=$("#tq-type").value, jv=$("#tq-job").value;
      if(type==="job"&&!jv){ $("#tq-err").textContent="Pick the job."; return; }
      const [jid,vid]=jv?jv.split("|"):["",""];
      if(own){ await S.db.collection("log").add({kind:"clock",general:type!=="job",where:type==="job"?"":type,jobId:type==="job"?jid:"",visitId:type==="job"?vid:"",by:S.me.id,in:pin,out:pout,auto:false,at:now,edited:S.me.id,manual:true,...(why?{note:why}:{})});
        toast("Added to your time card"); closeDrawer(); return; }
      const ref=await S.db.collection("log").add({kind:"clock",pending:true,general:type!=="job",where:type==="job"?undefined:type,jobId:type==="job"?jid:"",visitId:type==="job"?vid:"",by:S.me.id,in:pin,out:pout,auto:false,at:now});
      const label=type==="job"?(clientOf(S.jobs.get(jid)||{}).name||"Job"):type==="shop"?"Shop":"Driving";
      await S.db.collection("log").add({kind:"timereq",status:"pending",target:ref.id,isNew:true,propIn:pin,propOut:pout,reason:why,by:S.me.id,at:now,
        summary:`Add ${label} ${fmtDay(day)} ${tfmt(pin)}–${tfmt(pout)}`});
    }
    toast("Sent. A manager will approve it."); closeDrawer();
  }catch(x){ fail(x,"send the request"); }
}
function reqBlock(){
  if(!S.me.manage) return "";
  const P=pendingReqs(); if(!P.length) return "";
  return `<h2 class="h-sec" style="margin-top:14px">Time fix requests · ${P.length}</h2><div class="rows">${P.map(r=>{ const t=S.log.get(r.target);
    return `<div class="row svc" style="cursor:default">${avatar(r.by)}<span class="m"><span class="n">${esc(staffName(r.by))}${r.by===S.me.id?" (you)":""}</span>
      <span class="s"><b>${esc(r.summary||"")}</b><br>“${esc(r.reason||"")}” · ${esc(ago(r.at))}${!t?" · the original time was deleted":""}</span></span>
      <span class="r">${canApprove(r)?`<button type="button" class="btn small amber" data-act="treq-ok" data-v="${esc(r.id)}" ${t?"":"disabled"}>Approve</button><button type="button" class="btn small" data-act="treq-no" data-v="${esc(r.id)}">Deny</button>`:""}</span></div>`; }).join("")}</div>`;
}
async function decideReq(id, ok){
  const r=S.log.get(id); if(!r) return; const t=S.log.get(r.target), now=new Date().toISOString();
  let note="";
  if(!ok){ note=(prompt("Why? (optional, they'll see this)")||"").trim(); }
  try{
    if(ok){
      if(!t){ toast("The original time is gone"); return; }
      if(r.isNew) await S.db.doc("log/"+r.target).update({pending:false,approvedBy:S.me.id,edited:S.me.id,...(r.by===S.me.id?{selfApproved:true}:{})});
      else await S.db.doc("log/"+r.target).update({in:r.propIn,out:r.propOut,edited:S.me.id,fixReq:id});
    } else if(r.isNew && t) await S.db.doc("log/"+r.target).delete();
    await S.db.doc("log/"+id).update({status:ok?"approved":"denied",decidedBy:S.me.id,decidedAt:now,note});
    toast(ok?"Approved. Hours updated.":"Denied");
  }catch(x){ fail(x,ok?"approve it":"deny it"); }
}

/* ---------- pull hours from Jobber's timesheets (managers) ---------- */
const jbhKey = e => "jbt-"+String(e.id).replace(/[^A-Za-z0-9]/g,"").slice(-24);
function jbhMatch(e, day){
  let j=null;
  if(e.job){ j=S.jobs.get("jb-"+e.job.number)?{id:"jb-"+e.job.number,...S.jobs.get("jb-"+e.job.number)}:null;
    if(!j){ const nm=String(e.job.title||e.visit||"").split(/[-–]/).pop().trim().toLowerCase();
      if(nm.length>2) j=jobsArr().find(x=>{ const c=String(clientOf(x).name||"").toLowerCase(); return c && (c===nm || c.includes(nm) || nm.includes(c)); })||null; } }
  if(!j) return null;
  const vs=(j.visits||[]).filter(v=>v.date).sort((a,b)=>Math.abs(parseISO(a.date)-parseISO(day))-Math.abs(parseISO(b.date)-parseISO(day)));
  return {j, v:vs[0]||null};
}
function jbhMine(H){
  const P=PL.staff().find(p=>p.id===H.who)||{name:""}, nm=String(P.name||"").trim().toLowerCase(), first=nm.split(/\s+/)[0]||"#";
  return (H.entries||[]).filter(e=>{ const u=String(e.user||"").trim().toLowerCase(); return u===nm || u.split(/\s+/)[0]===first; });
}
function dJbHours(){
  const H=S.jbh, ppl=PL.staff().filter(p=>p.active&&!isSS(p.id)), P=ppl.find(p=>p.id===H.who)||{name:""};
  const mine=jbhMine(H);
  const done=new Set([...S.log.values()].filter(e=>e.kind==="clock"&&e.jobberId).map(e=>e.jobberId));
  const rows=mine.map(e=>{ const day=isoOf(e.start), m=jbhMatch(e,day), have=done.has(e.id), open=!e.end;
    return `<label class="row" style="cursor:${have||open?"default":"pointer"}"><input type="checkbox" data-jbh="${esc(e.id)}" ${have||open?"disabled":H.sel.has(e.id)?"checked":""} style="width:20px;height:20px;margin-right:6px">
      <span class="m"><span class="n">${esc(fmtDay(day,{weekday:"short",month:"short",day:"numeric"}))} · ${tfmt(e.start)} – ${e.end?tfmt(e.end):"still running"}</span>
      <span class="s">${m?"Job: "+esc(clientOf(m.j).name||"Customer"):e.job?"Jobber job #"+esc(e.job.number)+" "+esc(e.job.title)+" (not on the board · counts as shop time)":"General time (shop)"}${e.note?" · "+esc(e.note):""}</span></span>
      <span class="r">${have?`<span class="st down">Added</span>`:open?`<span class="st booked">Running</span>`:`<span class="mono">${fmtDur(new Date(e.end)-new Date(e.start))}</span>`}</span></label>`; }).join("");
  const b=`<div class="form"><div class="two"><div class="f"><label for="jbh-from">From</label><input id="jbh-from" type="date" value="${esc(H.from)}"></div><div class="f"><label for="jbh-to">To</label><input id="jbh-to" type="date" value="${esc(H.to)}"></div></div>
    <div class="f"><label for="jbh-who">Whose hours</label><select id="jbh-who">${ppl.map(p=>`<option value="${esc(p.id)}" ${p.id===H.who?"selected":""}>${esc(p.name)}</option>`).join("")}</select></div>
    <div class="actions"><span></span><button type="button" class="btn" data-act="jbh-pull" ${H.loading?"disabled":""}>${H.loading?"Pulling…":"Pull from Jobber"}</button></div></div>
    ${H.error?`<div class="note" style="color:var(--red)">${esc(H.error)}</div>`:""}
    ${H.entries?(mine.length?`<div class="rows" style="margin-top:10px">${rows}</div>
      <div class="actions" style="margin-top:10px"><span class="count">${H.sel.size} picked</span><button type="button" class="btn amber" data-act="jbh-add" ${H.sel.size?"":"disabled"}>Add to ${esc(P.name)}'s time card</button></div>`
      :`<p class="count" style="margin-top:10px">Jobber has no timesheet entries for ${esc(P.name)} in those days${(H.entries||[]).length?` (it has ${(H.entries||[]).length} for other people)`:""}. You can still type the hours in with <b>+ Add time</b>.</p>`):""}`;
  return drawerShell("Hours from Jobber","Timesheets", b);
}
async function jbhPull(){
  const H=S.jbh; H.from=$("#jbh-from").value; H.to=$("#jbh-to").value; H.who=$("#jbh-who").value;
  if(!H.from||!H.to||H.to<H.from){ H.error="Pick the days."; renderDrawer(); return; }
  H.loading=true; H.error=""; renderDrawer();
  try{
    const a=new Date(H.from+"T00:00:00").toISOString(), z=new Date(addDays(H.to,1)+"T00:00:00").toISOString();
    const r=await PL.jobber(`hours&from=${encodeURIComponent(a)}&to=${encodeURIComponent(z)}`);
    H.entries=r.entries||[]; H.error=r.error||"";
    const done=new Set([...S.log.values()].filter(e=>e.kind==="clock"&&e.jobberId).map(e=>e.jobberId));
    H.sel=new Set(jbhMine(H).filter(e=>e.end&&!done.has(e.id)).map(e=>e.id));
  }catch(e){ H.error=e.message; H.entries=null; }
  H.loading=false; renderDrawer();
}
async function jbhAdd(){
  const H=S.jbh, now=new Date().toISOString(); let n=0;
  try{
    for(const e of jbhMine(H).filter(e=>H.sel.has(e.id)&&e.end)){
      const m=jbhMatch(e,isoOf(e.start));
      await S.db.doc("log/"+jbhKey(e)+"-"+H.who.slice(0,6)).set({kind:"clock",general:!m,where:m?"":"shop",jobId:m?m.j.id:"",visitId:m&&m.v?m.v.id:"",by:H.who,in:new Date(e.start).toISOString(),out:new Date(e.end).toISOString(),auto:false,at:now,edited:S.me.id,source:"jobber",jobberId:e.id,...(e.note?{note:e.note}:{})});
      n++;
    }
    toast(`${n} time entr${n===1?"y":"ies"} added from Jobber`); H.sel=new Set(); renderDrawer();
  }catch(x){ fail(x,"add the hours"); }
}

async function dropOn(D, day, before){
  const j0=S.jobs.get(D.j); if(!j0) return; const j={id:D.j,...j0};
  const visits=(j0.visits||[]).map(x=>({...x})); let v;
  if(D.v) v=visits.find(x=>x.id===D.v);
  else { const type=D.t==="takedown"?"takedown":"install"; v=visits.find(x=>x.type===type&&!x.date&&!isDone(j.id,x.id)); if(!v){ v={id:uid(),type,date:"",time:"",crew:"",note:"",order:null}; visits.push(v); } }
  if(S.team==="all") before=null;
  if(!v||(before&&before.j===D.j&&before.v===v.id)||(!before&&v.date===day&&D.v)) return;
  v.date=day;
  const crew=S.team!=="all"&&visitCrews(j,v).includes(S.team)?S.team:crewOf(j,v), changes=new Map([[j.id,visits]]);
  if(crewObj(crew)){
    const list=stopsFor(day,crew).filter(s=>!(s.j.id===j.id&&s.v.id===v.id));
    let idx=before?list.findIndex(s=>s.j.id===before.j&&s.v.id===before.v):-1; if(idx<0) idx=list.length;
    [...list.slice(0,idx),{me:true},...list.slice(idx)].forEach((s,i)=>{
      if(s.me){ setOrd(j,v,crew,i+1); return; }
      if(ordOf(s.v,crew)!==i+1){ const base=changes.get(s.j.id)||(S.jobs.get(s.j.id).visits||[]).map(x=>({...x})); const t=base.find(x=>x.id===s.v.id); if(t){ setOrd(s.j,t,crew,i+1); changes.set(s.j.id,base); } } });
  } else v.order=null;
  try{ const now=new Date().toISOString(); for(const [id,vs] of changes) await S.db.doc("jobs/"+id).update({visits:vs,updatedAt:now});
    toast(`${clientOf(j).name||"Job"}: ${VTYPE[v.type].toLowerCase()} ${fmtDay(day,{weekday:"short",month:"short",day:"numeric"})}${crewObj(crew)?"":" · no crew yet"}`); }
  catch(e){ fail(e,"reschedule that"); }
}

/* ---------- writes ---------- */
function fail(e,what){
  const c=e&&e.code;
  if(c==="invalid_argument") toast(`You don't have permission to ${what}.`);
  else if(c==="quota_exceeded") toast("The board is full. Delete old entries to make room.");
  else toast(`Couldn't ${what}. Check your signal and try again.`);
}
async function markDone(jobId,visitId){
  try{ await S.db.collection("log").add({jobId,visitId,kind:"done",by:S.me.id||"",at:new Date().toISOString()}); { const oc=myOpenClock(); if(oc&&oc.jobId===jobId&&oc.visitId===visitId) await clockOut(oc.id,false,true); } toast("Marked done"); celebrate(jobId,visitId); }catch(e){ fail(e,"mark this done"); }
}
async function delEntry(id){ try{ await S.db.doc("log/"+id).delete(); }catch(e){ fail(e,"change that"); } }
async function shrink(file){
  try{ const bmp=await createImageBitmap(file); const m=2000, sc=Math.min(1,m/Math.max(bmp.width,bmp.height));
    const cv=document.createElement("canvas"); cv.width=Math.round(bmp.width*sc); cv.height=Math.round(bmp.height*sc);
    cv.getContext("2d").drawImage(bmp,0,0,cv.width,cv.height);
    const blob=await new Promise((res,rej)=>cv.toBlob(b=>b?res(b):rej(new Error("encode")),"image/jpeg",0.85));
    return {blob,type:"image/jpeg"}; }
  catch(e){ return {blob:file,type:file.type}; }
}
async function upload(file){
  let blob=file, type=file.type||"";
  const n=file.name||"";
  if(type.startsWith("image/") && type!=="image/gif" && type!=="image/svg+xml"){ ({blob,type}=await shrink(file)); }
  else if(type==="video/quicktime" || (!type && /\.mov$/i.test(n)) || (!type && /\.mp4$/i.test(n))) type="video/mp4";
  else if(!type && /\.pdf$/i.test(n)) type="application/pdf";
  if(blob.size>50*1024*1024) throw {code:"too_large"};
  const r=await S.assets.upload(blob,{type});
  return {id:r.id, type:type.startsWith("video")?"video":type==="application/pdf"?"pdf":"image", name:n};
}
function upFail(e){
  const c=e&&e.code;
  toast(c==="too_large"?"That file is over 50 MB. Trim videos to about 30 seconds.": c==="unsupported_type"?"That file type can't be uploaded. Use a photo or an MP4/MOV video.": c==="quota_or_state"?"The board's storage is full.": c==="not_granted"?"You don't have permission to upload here.":"Upload failed. Check your signal and try again.");
}
async function post(jobId){
  const text=S.compose.text.trim(), files=S.compose.files; if(!text && !files.length){ toast("Write a note or add a photo first"); return; }
  S.busy=true; renderDrawer();
  const media=[];
  try{
    for(let i=0;i<files.length;i++){ toast(`Uploading ${i+1} of ${files.length}…`); media.push(await upload(files[i])); }
    await S.db.collection("log").add({jobId,kind:"note",text,media,by:S.me.id||"",at:new Date().toISOString()});
    S.compose={text:"",files:[]}; toast("Posted");
  }catch(e){ if(e&&("code" in e)&&["too_large","unsupported_type","quota_or_state","not_granted","rate_limited","upstream_error","store_unavailable"].includes(e.code)) upFail(e); else fail(e,"post that"); }
  S.busy=false; renderDrawer();
}
async function addMockups(files){
  const id=S.drawer.id, j=S.jobs.get(id); if(!j) return;
  const list=[...(j.mockups||[])];
  try{ for(const f of files){ toast("Uploading mockup…"); list.push(await upload(f)); }
    await S.db.doc("jobs/"+id).update({mockups:list,updatedAt:new Date().toISOString()}); toast("Mockup added"); }
  catch(e){ e&&e.code==="invalid_argument"?fail(e,"add mockups"):upFail(e); }
}
async function rmMockup(aid){

  try{ await S.db.doc("jobs/"+id).update({mockups:(j.mockups||[]).filter(m=>m.id!==aid)}); if(S.assets){ try{ await S.assets.delete(aid); }catch(e){} } }catch(e){ fail(e,"remove that mockup"); }

async function move(jobId,visitId,dir){
  const j=S.jobs.get(jobId), v=(j.visits||[]).find(x=>x.id===visitId); const crew=S.team!=="all"&&visitCrews(j,v).includes(S.team)?S.team:crewOf(j,v);
  const list=stopsFor(S.day,crew); const i=list.findIndex(s=>s.j.id===jobId&&s.v.id===visitId), k=i+dir;
  if(i<0||k<0||k>=list.length) return;
  [list[i],list[k]]=[list[k],list[i]];
  const changes=new Map();
  list.forEach((s,idx)=>{ if(ordOf(s.v,crew)!==idx+1){ const base=changes.get(s.j.id)||(S.jobs.get(s.j.id).visits||[]).map(x=>({...x})); const t=base.find(x=>x.id===s.v.id); setOrd(s.j,t,crew,idx+1); changes.set(s.j.id,base); } });
  try{ for(const [id,visits] of changes) await S.db.doc("jobs/"+id).update({visits}); }catch(e){ fail(e,"reorder"); }
}

function readJobForm(){
  const F=S.form; if(!F||!$("#jobForm")) return; const g=id=>{ const el=document.getElementById(id); return el?el.value:undefined; };
  const sel=g("f-client"); if(sel==="__new") F.clientMode="new"; else if(sel!==undefined){ F.clientMode="existing"; F.job.clientId=sel; }
  for(const k of ["name","phone","email","address","gate"]){ const v=g("nc-"+k); if(v!==undefined) F.nc[k]=v; }
  for(const k of ["address","tclRef","stage","rooflineFt","scope","notes"]){ const v=g("f-"+k); if(v!==undefined) F.job[k]=v; }
  (F.job.visits||[]).forEach((v,i)=>{ for(const k of ["date","time","crew","note"]){ const x=g(`v${i}-${k}`); if(x!==undefined) v[k]=x; } });
  const p=g("m-price"); if(p!==undefined) F.fin.price=p; const iv=g("m-invoice"); if(iv!==undefined) F.fin.invoiceNo=iv; const pn=g("m-note"); if(pn!==undefined) F.fin.privateNote=pn; const sp=g("m-ss"); if(sp!==undefined) F.fin.ssPct=sp.trim();
  readSold();
}
async function saveJob(){
  readJobForm(); const F=S.form, j=F.job, now=new Date().toISOString();
  if(F.clientMode==="new" && !F.nc.name.trim()){ toast("Add the client's name"); return; }
  if(F.clientMode!=="new" && !j.clientId){ toast("Choose a client"); return; }
  S.busy=true; renderDrawer();
  try{
    let clientId=j.clientId;
    if(F.clientMode==="new"){ const cref=S.db.collection("clients").doc(); await cref.set({name:F.nc.name.trim(),phone:F.nc.phone,email:F.nc.email,address:F.nc.address,gate:F.nc.gate,notes:"",createdAt:now}); clientId=cref.id; }
    const visits=(j.visits||[]).map(v=>({id:v.id||uid(),type:v.type,date:v.date||"",time:v.time||"",crew:v.crew||"",note:v.note||"",order:v.order??null}));
    for(const v of visits){ if(v.order==null && v.date){ const crew=v.crew||j.crew||""; const peers=stopsFor(v.date,crew||"all").filter(s=>s.j.id!==F.id); v.order=peers.reduce((m,s)=>Math.max(m,s.v.order||0),0)+1+visits.filter(o=>o!==v&&o.date===v.date&&o.order!=null&&(o.crew||j.crew)===crew).length; } }
    const firstDate=visits.map(v=>v.date).filter(Boolean).sort()[0];
    const season=j.season || String(firstDate?(parseISO(firstDate).getMonth()<6?parseISO(firstDate).getFullYear()-1:parseISO(firstDate).getFullYear()):(new Date().getMonth()<6?new Date().getFullYear()-1:new Date().getFullYear()));
    const ref=F.id?S.db.doc("jobs/"+F.id):S.db.collection("jobs").doc();
    await ref.set({...(F.id?S.jobs.get(F.id):{}),clientId,address:F.clientMode==="new"?"":(j.address||""),source:j.source||"prolight",tclRef:j.source==="tcl"?(j.tclRef||""):"",crew:j.crew||"",stage:j.stage||"booked",season,scope:j.scope||"",rooflineFt:j.rooflineFt||"",notes:j.notes||"",visits,mockups:j.mockups||[],createdAt:j.createdAt||now,updatedAt:now});
    if(S.me.money){ const price=parseFloat(String(F.fin.price||"").replace(/[$,]/g,""))||0, old=S.fin.get(ref.id)||{};
    await S.db.doc("fin/"+ref.id).set(soldApply(F,{...old,price,invoiceNo:F.fin.invoiceNo||"",privateNote:F.fin.privateNote||"",collected:!!old.collected,ssPaid:!!old.ssPaid,ssPct:hasPct(F.fin.ssPct)?Number(F.fin.ssPct):null},old)); }
    autoGeo(ref.id);
    S.busy=false; S.form=null; toast(F.id?"Job saved":"Job added"); openDrawer("job",ref.id);
  }catch(e){ S.busy=false; fail(e,"save this job"); renderDrawer(); }
}

    case "map-place-cancel": MAP.placing=null; renderMain(); break;
    case "map-sched": t.disabled=true; await mapSchedule(id); break;
    case "add-crew": { const C=collectCrews(), n=C.filter(c=>c.co===v).length+1; C.push({id:(v==="prolight"?"pl":"ss")+uid().slice(0,5),co:v,name:(v==="prolight"?"ProLight Crew ":"ShipShape Crew ")+n,chat:"",members:[]}); await writeCrews(C,"Crew added"); break; }
    case "rm-crew": await writeCrews(collectCrews().filter(c=>c.id!==v),"Crew removed"); break;
    case "day": S.day = v==="0"?todayISO():addDays(S.day,Number(v)); renderMain(); break;
    case "go-day": S._home=1; S.day=v; S.view="route"; renderMain(); window.scrollTo(0,0); break;
    case "week": S.week = v==="0"?monday(todayISO()):addDays(S.week,Number(v)); renderMain(); break;
    case "jf": S.jf=v; renderMain(); break;
    case "office": setOffice(v); renderMain(); break;
    case "texts": S.view="office"; S.office="texts"; S.briefDay=v; renderMain(); window.scrollTo(0,0); break;
    case "brief-day": S.briefDay=addDays(S.briefDay,Number(v)); renderMain(); break;
    case "job": if(id){ S.compose={text:"",files:[]}; openDrawer("job",id); } break;
    case "client": if(id) openDrawer("client",id); break;
    case "close": closeDrawer(); break;
    case "done": t.disabled=true; await markDone(t.dataset.j,v); break;
    case "undone": t.disabled=true; await delEntry(id); break;
    case "del-entry": await delEntry(id); break;
    case "move": t.disabled=true; await move(t.dataset.j,v,Number(t.dataset.d)); break;
    case "fin-tog": t.disabled=true; await finTog(id,t.dataset.k); break;
    case "assign": try{ await S.db.doc("jobs/"+id).update({crew:v||"",updatedAt:new Date().toISOString()}); toast(v?"Assigned to "+teamName(v):"Crew cleared"); }catch(e){ fail(e,"assign this job"); } break;
    case "new-job": startJobForm(null,t.dataset.client); break;
    case "edit-job": startJobForm(id); break;
    case "new-client": S.form={id:null,client:{}}; openDrawer("clientEdit"); break;
    case "edit-client": S.form={id,client:{...S.clients.get(id)}}; openDrawer("clientEdit",id); break;
    case "seg": readJobForm(); S.form.job[t.dataset.k]=v; renderDrawer(); break;
    case "add-visit": readJobForm(); S.form.job.visits.push({id:uid(),type:v,date:"",time:"",crew:"",note:""}); renderDrawer(); break;
    case "del-visit": readJobForm(); S.form.job.visits.splice(Number(v),1); renderDrawer(); break;
    case "del-job": readJobForm(); S.form.confirmDel=true; renderDrawer(); break;
    case "del-job-no": readJobForm(); S.form.confirmDel=false; renderDrawer(); break;
    case "del-job-yes": await deleteJob(); break;
    case "post": await post(id); break;
    case "rm-pend": S.compose.files.splice(Number(v),1); renderDrawer(); break;
    case "rm-mockup": await rmMockup(id); break;
    case "zoom": $("#lightRoot").innerHTML=`<div class="lightbox" data-act="unzoom"><img src="${esc(t.dataset.src)}" alt=""><button type="button" class="btn small" data-act="unzoom">Close</button></div>`; break;
    case "unzoom": $("#lightRoot").innerHTML=""; break;
    case "copy": { const el=document.getElementById(v); try{ await navigator.clipboard.writeText(el.value); toast("Copied. Paste it into the group chat."); }catch(e){ el.focus(); el.select(); toast("Text selected. Copy it from here."); } break; }
    case "copytext": try{ await navigator.clipboard.writeText(v); toast("Copied "+v); }catch(e){ toast(v); } break;
  }
});
document.addEventListener("input", ev=>{
  const t=ev.target;
  if(t.id==="q-jobs"){ S.q.jobs=t.value; renderMain(); }
  else if(t.id==="q-clients"){ S.q.clients=t.value; renderMain(); }
  else if(t.id==="q-tray"){ S.q.tray=t.value; renderMain(); }
  else if(t.id==="compose-text"){ S.compose.text=t.value; }
  else if(t.id==="py-amount"&&S.form&&S.form.pay){ S.form.pay.manual=true; }
  else if((t.id==="m-price"||t.id==="m-ss") && S.form){ readJobForm(); const c=$("#calc"); const p=Number(String(S.form.fin.price||"").replace(/[$,]/g,"")); c.innerHTML=p?calcLines(S.form.job,p,S.form.fin.ssPct):`<span class="count">Enter a price to see the split.</span>`; }
});
document.addEventListener("change", async ev=>{
  const t=ev.target;
  if(t.id&&t.id.startsWith("pj-")&&S.form&&S.form.pay){ const jid=t.id.slice(3); t.checked?S.form.pay.jobs.add(jid):S.form.pay.jobs.delete(jid);
    if(!S.form.pay.manual){ let tot=0; document.querySelectorAll('#payForm input[id^="pj-"]:checked').forEach(x=>tot+=Number(x.dataset.jamt)); $("#py-amount").value=tot?tot.toFixed(2):""; } return; }
  if(["sl-by","sl-ref"].includes(t.id)&&S.form&&S.form.sale){ readSale(); renderDrawer(); return; }
  if(["m-soldby","m-ref"].includes(t.id)&&S.form&&S.form.sold){ readJobForm(); renderDrawer(); return; }
  if(t.dataset&&t.dataset.jbh&&S.jbh){ t.checked?S.jbh.sel.add(t.dataset.jbh):S.jbh.sel.delete(t.dataset.jbh); const c=document.querySelector("[data-act=jbh-add]"); if(c) c.disabled=!S.jbh.sel.size; const k=c&&c.previousElementSibling; if(k) k.textContent=S.jbh.sel.size+" picked"; return; }
  if(t.dataset&&t.dataset.otFor){ await saveOt(t.dataset.otFor,t.value==="1"); return; }
  if(t.dataset&&t.dataset.rateFor){ await saveRate(t.dataset.rateFor,t.value); return; }
  if(t.dataset&&t.dataset.photoFor){ await changePhoto(t.files[0], t.dataset.photoFor); return; }
  if(t.id==="compose-files"){ S.compose.files.push(...t.files); renderDrawer(); }
  else if(t.id==="mockup-file"){ await addMockups([...t.files]); }
  else if(t.id==="f-client"){ readJobForm(); renderDrawer(); }
});
document.addEventListener("submit", ev=>{
  ev.preventDefault();
  if(ev.target.id==="treqForm") return saveTimeReq(ev.target);
  if(ev.target.id==="saleForm") return saveSale(ev.target);
  if(ev.target.id==="clockForm") return saveClockEdit(ev.target);
  if(ev.target.id==="svcForm") return saveSvc(ev.target);
  if(ev.target.id==="issueForm") return saveIssue(ev.target);
  if(ev.target.id==="ctForm") return saveCrewTruck(ev.target);
  if(ev.target.id==="partialForm"){ readPartialForm(); return savePartial(ev.target); }
  if(ev.target.id==="returnForm"){ const [a,b]=ev.target.dataset.key.split("|"); return addReturn(a,b,$("#rt-date").value,$("#rt-time").value,null,false).then(()=>openDrawer("job",a)).catch(e=>fail(e,"add the return visit")); }
  if(ev.target.id==="chatForm") return sendChat();
  if(ev.target.id==="payForm") return savePay();
  if(ev.target.id==="assignForm") return saveAssign(ev.target.dataset.key,{truck:$("#as-truck").value,trailer:$("#as-trailer").value,note:$("#as-note").value.trim()});
  if(ev.target.id==="pinForm") return saveMyPin(); if(ev.target.id==="personForm") return savePerson();
  if(ev.target.id==="jobForm") saveJob(); else if(ev.target.id==="clientForm") saveClient(); else if(ev.target.id==="settingsForm") saveSettings();
});
document.addEventListener("keydown", ev=>{ if(ev.key==="Escape"){ if($("#lightRoot").innerHTML) $("#lightRoot").innerHTML=""; else if(S.drawer) closeDrawer(); } });

/* ---------- boot ---------- */
renderMain();
(async()=>{
  const use = n => (window.claude && window.claude.use) ? window.claude.use(n).catch(()=>null) : Promise.resolve(null);
  const [db,user,assets]=await Promise.all([use("db"),use("user"),use("assets")]);
  S.user=user; S.assets=assets;
  if(!db){ S.err="The board can't load here. Open it signed in to claude.ai."; renderMain(); return; }
  S.db=db;
  if(user){ const me=await user.me(); S.me.id=me.id; applyPerms(me.perms); }
  if(!ls("team")) S.team="all"; else if(S.team!=="all") S.team=normCrew(S.team);
  { const P0=PL.me(); if(P0&&!P0.all_crews&&P0.crew) S.team=P0.crew; }
  const got={c:false,j:false,l:false};
  const ready=()=>{ if(got.c&&got.j){ S.ready=true; setTimeout(fillPins,4000); if(ls("autoClock")==="1"&&S.me.canLog&&!AUTO.on) setTimeout(()=>setAuto(true),1200); setTimeout(jobberAuto,1500); } };
  setTimeout(()=>{ if(!S.ready){ S.err="The board is taking too long to load. Check your connection and reload."; renderMain(); } }, 12000);
  db.collection("clients").onSnapshot(s=>{ S.clients=new Map(s.docs.map(d=>[d.id,d.data()])); got.c=true; ready(); refresh(); }, e=>{ S.err="Lost connection to the board. Reload the page."; renderMain(); });
  db.collection("jobs").onSnapshot(s=>{ S.jobs=new Map(s.docs.map(d=>[d.id,d.data()])); got.j=true; ready(); refresh(); }, e=>{ S.err="Lost connection to the board. Reload the page."; renderMain(); });
  db.collection("log").onSnapshot(s=>{ S.log=new Map(s.docs.map(d=>[d.id,d.data()])); recompute(); got.l=true; refresh(); fetchNames(); }, e=>{ got.l=true; refresh(); });
  db.doc("settings/board").onSnapshot(s=>{ S.settings=s.exists?s.data():{}; refresh(); }, e=>{});
  loadChat();
  db.collection("settings").onSnapshot(s=>{ { const fm=s.docs.find(d=>d.id==="former"); S.former=fm?fm.data()||{}:{}; } S.dayCfg=new Map(s.docs.filter(d=>d.id.startsWith("day-")).map(d=>[d.id.slice(4),d.data()])); refresh(); }, e=>{});
  if(S.me.money){
    db.collection("fin").onSnapshot(s=>{ const m=new Map(), pays=new Map(); for(const d of s.docs){ if(d.id==="settings") S.finSet=d.data(); else if(d.id==="payroll") S.payroll=d.data()||{}; else if(d.id.startsWith("pay-")) pays.set(d.id,d.data()); else m.set(d.id,d.data()); } S.fin=m; S.pays=pays; S.stmt=null; refresh(); }, e=>{});
  }
})();
</script>
