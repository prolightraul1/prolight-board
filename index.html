<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ProLight Season Board</title>
<meta name="theme-color" content="#111916">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ProLight">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png">

<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px;-webkit-text-size-adjust:100%}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: phone = night top bar + single column + fixed bottom tabs, full-screen job drawer.
   Desktop (>=960px) = night left rail + wide main + right-hand job drawer.
   Signature: each day's route is drawn as a light strand, one C9 bulb per stop, lit when the crew checks it off. */
:root{
  --bg:#e9ece8; --card:#ffffff; --sunk:#f2f4f0; --ink:#141916; --ink-2:#4f5a54; --line:#d2d8d2;
  --night:#111916; --night-2:#1b2621; --night-ink:#eaf0eb; --night-dim:#8e9f97;
  --amber:#f2a516; --amber-ink:#2b1c00; --amber-soft:#fcefd0; --amber-text:#7a5100;
  --cord:#21694a; --cord-soft:#d9eee2; --wire:#23372e; --glass:#c9d1cb; --glass-hi:#eef2ee;
  --red:#b3332b; --red-soft:#f7dedb; --blue:#295ea3; --blue-soft:#dde7f5;
  --f-sign:"Big Shoulders Display","Arial Narrow","Roboto Condensed",sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0d1210; --card:#161e1a; --sunk:#111815; --ink:#e5ebe6; --ink-2:#97a69e; --line:#26312c;
  --night:#080c0a; --night-2:#121a16; --night-ink:#eaf0eb; --night-dim:#8a9b93;
  --amber:#ffb83d; --amber-ink:#241700; --amber-soft:#3a2b0d; --amber-text:#ffcf78;
  --cord:#62c391; --cord-soft:#15301f; --wire:#35584a; --glass:#34413b; --glass-hi:#4b5a53;
  --red:#f28b80; --red-soft:#3a1815; --blue:#8fb5f0; --blue-soft:#162740;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0d1210; --card:#161e1a; --sunk:#111815; --ink:#e5ebe6; --ink-2:#97a69e; --line:#26312c;
  --night:#080c0a; --night-2:#121a16; --night-ink:#eaf0eb; --night-dim:#8a9b93;
  --amber:#ffb83d; --amber-ink:#241700; --amber-soft:#3a2b0d; --amber-text:#ffcf78;
  --cord:#62c391; --cord-soft:#15301f; --wire:#35584a; --glass:#34413b; --glass-hi:#4b5a53;
  --red:#f28b80; --red-soft:#3a1815; --blue:#8fb5f0; --blue-soft:#162740;
  color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--night)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.sign{font-family:var(--f-sign);text-transform:uppercase;letter-spacing:.02em}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---- chrome ---- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--night);color:var(--night-ink)}
.topbar .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0}
.brand b{font-family:var(--f-sign);font-weight:900;font-size:24px;letter-spacing:.03em;line-height:1}
.brand b i{font-style:normal;color:var(--amber)}
.brand span{font-family:var(--f-mono);font-size:11px;color:var(--night-dim);text-transform:uppercase;letter-spacing:.12em;white-space:nowrap}
.rail .brand span{white-space:normal}
.topbar .sp{flex:1}
.who{font-size:12px;color:var(--night-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--night);border-top:1px solid #000;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs .in{display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
.tabs button{background:none;border:0;padding:9px 2px 10px;display:grid;justify-items:center;gap:2px;color:var(--night-dim);font-family:var(--f-sign);font-weight:800;font-size:14px;letter-spacing:.06em;text-transform:uppercase}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--amber)}

.rail{display:none}
main{padding-block:16px 32px}
.view{display:grid;gap:14px;max-width:1120px;margin:0 auto}

/* ---- type ---- */
.h-view{font-family:var(--f-sign);font-weight:900;font-size:40px;line-height:.95;text-transform:uppercase;margin:0;letter-spacing:.01em}
.h-sec{font-family:var(--f-sign);font-weight:800;font-size:20px;text-transform:uppercase;letter-spacing:.05em;margin:8px 0 0;color:var(--ink-2)}
.lede{color:var(--ink-2);margin:0;font-size:15px;max-width:62ch}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}

/* ---- controls ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--card);font-weight:700;font-size:15px;text-decoration:none;white-space:nowrap}
.btn.amber{background:var(--amber);border-color:var(--amber);color:var(--amber-ink)}
.btn.ink{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.done{background:var(--cord-soft);border-color:transparent;color:var(--cord)}
.btn.danger{background:var(--red-soft);border-color:transparent;color:var(--red)}
.btn.small{min-height:34px;padding:0 10px;font-size:13px}
.btn.icon{width:40px;padding:0;min-height:40px}
.btn[disabled]{opacity:.55;cursor:default}
.seg{display:inline-grid;grid-auto-flow:column;background:var(--sunk);border:1px solid var(--line);border-radius:var(--r);padding:3px;gap:3px;max-width:100%}
.seg button{border:0;background:none;border-radius:4px;padding:7px 12px;font-weight:700;font-size:14px;color:var(--ink-2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:700;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.search{width:100%;min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.bar .grow{flex:1 1 220px;min-width:0}

/* ---- the bulb ---- */
.bulb{--b:var(--glass);--glow:none;position:relative;display:inline-block;flex:none;width:14px;height:21px}
.bulb::before{content:"";position:absolute;left:4px;top:0;width:6px;height:6px;border-radius:1px 1px 0 0;background:var(--wire)}
.bulb::after{content:"";position:absolute;left:0;top:5px;width:14px;height:16px;border-radius:50% 50% 50% 50%/38% 38% 62% 62%;background:radial-gradient(circle at 35% 30%,var(--glass-hi) 0 18%,transparent 19%),var(--b);box-shadow:var(--glow)}
.bulb.on{--b:var(--bc,var(--amber));--glow:0 0 10px 2px color-mix(in srgb,var(--bc,var(--amber)) 60%,transparent),0 0 24px 6px color-mix(in srgb,var(--bc,var(--amber)) 22%,transparent)}
.bulb.green{--b:var(--cord)} .bulb.blue{--b:var(--blue)} .bulb.red{--b:var(--red)} .bulb.dim{--b:color-mix(in srgb,var(--amber) 45%,var(--glass))}
.bulb.lg{width:22px;height:32px}
.bulb.lg::before{left:6px;width:10px;height:9px}
.bulb.lg::after{top:8px;width:22px;height:24px}

/* ---- route ---- */
.dayhead{display:grid;gap:12px}
.pager{display:flex;align-items:center;gap:8px}
.pager .d{flex:1;min-width:0}
.pager .d .h-view{font-size:34px}
.pager .d .eyebrow{display:block}
.prog{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink-2)}
.prog .track{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden;max-width:260px}
.prog .track span{display:block;height:100%;background:var(--amber)}
.stops{display:grid}
.stop{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px}
.stop .rail-c{position:relative;display:flex;justify-content:center}
.stop .rail-c::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:2px;margin-left:-1px;background:var(--wire)}
.stop:first-child .rail-c::before{top:22px}
.stop:last-child .rail-c::before{bottom:auto;height:22px}
.stop .rail-c .bulb{margin-top:20px}
.ticket{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px 14px;margin-bottom:12px;display:grid;gap:8px;min-width:0}
.stop.is-done .ticket{background:var(--sunk)}
.t-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ord{font-family:var(--f-mono);font-weight:600;font-size:13px;color:var(--ink-2)}
.vt{font-family:var(--f-sign);font-weight:800;font-size:15px;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:3px}
.vt.install{background:var(--amber-soft);color:var(--amber-text)} .vt.takedown{background:var(--blue-soft);color:var(--blue)} .vt.service{background:var(--sunk);color:var(--ink-2);border:1px solid var(--line)}
.crewtag{font-size:12px;font-weight:700;color:var(--ink-2);border:1px solid var(--line);border-radius:3px;padding:1px 6px}
.t-top .sp{flex:1}
.t-name{background:none;border:0;padding:0;text-align:left;font-family:var(--f-sign);font-weight:800;font-size:26px;line-height:1;text-transform:uppercase;letter-spacing:.01em}
.t-addr{color:var(--ink-2);font-size:15px}
.t-facts{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px}
.t-facts b{font-family:var(--f-mono);font-weight:600;font-size:12px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em;margin-right:4px}
.t-notes{background:var(--amber-soft);color:var(--ink);border-radius:4px;padding:8px 10px;font-size:14px;white-space:pre-wrap}
.thumbs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.thumbs img,.thumbs video{width:84px;height:64px;object-fit:cover;border-radius:4px;background:var(--sunk);flex:none;cursor:zoom-in}
.t-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}
.t-actions .btn.amber,.t-actions .btn.done{flex:1 1 160px}

.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:22px 18px;display:grid;gap:10px;background:var(--card)}
.empty h3{margin:0;font-family:var(--f-sign);font-size:26px;text-transform:uppercase;font-weight:800;line-height:1}
.empty p{margin:0;color:var(--ink-2);max-width:56ch}
.empty .unlit{display:flex;gap:18px;padding:4px 0 6px}

/* ---- lists ---- */
.rows{display:grid;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.row:last-child{border-bottom:0}
.row:hover{background:var(--sunk)}
.row .m{min-width:0;display:grid;gap:2px}
.row .n{font-weight:700;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{color:var(--ink-2);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .r{display:grid;justify-items:end;gap:3px;text-align:right}
.lbl{font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:3px;background:var(--sunk);color:var(--ink-2);white-space:nowrap}
.lbl.tcl{background:var(--blue-soft);color:var(--blue)} .lbl.pl{background:var(--amber-soft);color:var(--amber-text)}
.st{font-size:13px;font-weight:700;white-space:nowrap}
.st.lit,.st.partial{color:var(--amber-text)} .st.down{color:var(--cord)} .st.cancelled{color:var(--red)} .st.scheduled{color:var(--ink)} .st.lead,.st.quoted,.st.booked{color:var(--ink-2)}
.count{color:var(--ink-2);font-size:14px}

/* ---- week ---- */
.week{display:grid;grid-template-columns:1fr;gap:10px}
.map-wrap{display:grid;gap:12px;min-width:0}
.map-box{position:relative;height:min(62vh,560px);min-height:320px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--sunk)}

/* sign-in */
#gate{position:fixed;inset:0;z-index:100;background:var(--night);color:var(--night-ink);display:grid;place-items:center;overflow:auto;padding:calc(24px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#gate::before{content:"";position:absolute;left:0;right:0;top:env(safe-area-inset-top,0px);height:34px;background:radial-gradient(circle,#e2443a 0 3px,transparent 4px) 0 14px/120px 30px repeat-x,radial-gradient(circle,#2fae62 0 3px,transparent 4px) 30px 14px/120px 30px repeat-x,radial-gradient(circle,#f2b632 0 3px,transparent 4px) 60px 14px/120px 30px repeat-x,radial-gradient(circle,#3c7de0 0 3px,transparent 4px) 90px 14px/120px 30px repeat-x;opacity:.9}
.gate-card{width:min(380px,100%);display:grid;gap:14px;justify-items:center;text-align:center}
.gate-brand{display:grid;gap:2px;margin-bottom:6px}
.gate-brand b{font-family:var(--f-sign);font-weight:900;font-size:40px;letter-spacing:.03em;line-height:1}
.gate-brand b i{font-style:normal;color:var(--amber)}
.gate-brand span{font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--night-dim)}
.gate-card h2{margin:0;font-family:var(--f-sign);font-weight:800;font-size:28px;text-transform:uppercase}
.gate-card p{margin:0;color:var(--night-dim)}
.gate-names{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:100%}
.gate-names button{min-height:56px;border-radius:var(--r);border:1px solid #2a3832;background:var(--night-2);color:var(--night-ink);font-weight:700;font-size:16px}
.gate-dots{display:flex;gap:12px;margin:6px 0}
.gate-dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--night-dim)}
.gate-dots i.on{background:var(--amber);border-color:var(--amber);box-shadow:0 0 10px var(--amber)}
.gate-dots.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.gate-pad{display:grid;grid-template-columns:repeat(3,72px);gap:12px}
.gate-pad button{width:72px;height:72px;border-radius:50%;border:0;background:var(--night-2);color:var(--night-ink);font-size:26px;font-weight:600}
.gate-pad button:active{background:#2a3832}
.gate-err{color:#f28b80!important;min-height:1.2em}
.gate-back{justify-self:start;background:none;border:0;color:var(--night-dim);font-weight:700;font-size:15px;padding:4px 0}
.gate-form{display:grid;gap:12px;width:100%;text-align:left}
.gate-form label{display:grid;gap:4px;font-weight:700;font-size:14px}
.gate-form input{min-height:46px;border-radius:var(--r);border:1px solid #2a3832;background:var(--night-2);color:var(--night-ink);padding:0 12px;font-size:16px}
.gate-go{min-height:48px;border:0;border-radius:var(--r);background:var(--amber);color:var(--amber-ink);font-weight:800;font-size:16px;padding:0 18px}
.topbar .brand{align-items:center}
.topbar .logo{height:30px;width:auto;display:block}
.rail .logo{width:150px;height:auto;display:block}
.d-marks{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:6px}
.d-marks img{display:block;width:auto}
.d-marks .mk-tcl{height:58px}
.d-marks .mk-ss{height:40px}
.gate-brand img{width:220px;height:auto;margin:0 auto}
.route-tools{display:grid;gap:8px}
.wxline{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:14px;color:var(--ink-2)}
.wxline b{font-family:var(--f-mono);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;margin-right:6px}
.mhero{background:var(--night);color:var(--night-ink);border-radius:var(--r);padding:18px 18px 16px;display:grid;gap:4px}
.mhero .eyebrow{color:var(--night-dim)}
.mhero-v{font-family:var(--f-sign);font-weight:900;font-size:52px;line-height:1;color:var(--amber);font-variant-numeric:tabular-nums}
.mhero span:last-child{color:var(--night-dim);font-size:14px}
.mgrid{display:grid;grid-template-columns:1fr;gap:12px}
.mcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px;align-content:start;min-width:0}
.mcard header{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.mbig{font-family:var(--f-sign);font-weight:800;font-size:36px;line-height:1.05;font-variant-numeric:tabular-nums}
.mlogo{height:44px;width:auto;flex:none}
.mcard .mlogo.ss{height:30px;background:var(--night);padding:6px 8px;border-radius:4px}
.mhero .mlogo.ss{background:none;padding:0}
.pbar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.pbar span{display:block;height:100%;background:var(--cord)}
.mstat-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px}
tfoot td{border-top:2px solid var(--line);border-bottom:0}
.truckline{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-size:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:8px 12px}
.truckline b{font-family:var(--f-mono);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;margin-right:6px;color:var(--ink-2)}
.stop.lunch .ticket{background:var(--cord-soft);border-style:dashed}
.lunch-dot{width:16px;height:16px;border-radius:50%;background:var(--cord);margin-top:22px;box-shadow:0 0 0 4px var(--bg)}
.vt.lunchtag{background:var(--cord);color:#fff}
.row.food .m .n{white-space:normal}
@media (min-width:960px){ .mgrid{grid-template-columns:repeat(3,minmax(0,1fr))} }
.crewtag+.crewtag{margin-left:-2px}
.vt.returntag{background:var(--ink);color:var(--bg)}
.btn.partial{border-color:var(--amber);color:var(--amber-text);cursor:default}
.pt-line{display:block;margin-top:4px;color:var(--amber-text)}
.entry.partial-e{border-left:3px solid var(--amber)}
.linkbtn{background:none;border:0;padding:0;font:inherit;color:inherit;text-decoration:underline;cursor:pointer}
.extras{display:grid;gap:8px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.xadd{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.nbadge{position:absolute;top:4px;right:calc(50% - 22px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font:700 11px/18px var(--f-mono);font-style:normal;letter-spacing:0}
#railNav button,#tabNav button{position:relative}
#railNav .nbadge{position:static;margin-left:auto}
.ann{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;background:var(--night);color:var(--night-ink);border-left:4px solid var(--amber);border-radius:var(--r);padding:12px 14px;margin-bottom:12px;white-space:pre-wrap}
.ann .eyebrow{color:var(--amber)}
.ann .btn{background:var(--amber);border-color:var(--amber);color:#14110b;flex:none}
.chat{display:grid;grid-template-columns:1fr;gap:12px;min-height:0}
.chat-list{display:grid;gap:4px;align-content:start}
.chat-list .eyebrow{margin:10px 0 2px}
.chat-ch{display:flex;align-items:center;gap:10px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;color:inherit;font:inherit;cursor:pointer;min-width:0}
.chat-ch.on{border-color:var(--ink)}
.chat-ch .m{display:grid;min-width:0;flex:1}
.chat-ch small{color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{background:var(--red);color:#fff;border-radius:9px;min-width:20px;padding:0 6px;font:700 12px/20px var(--f-mono);font-style:normal;text-align:center}
.chat-thread{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:var(--r);min-height:60vh;max-height:calc(100dvh - 170px);overflow:hidden}
.chat-thread.empty-t{display:none;align-items:center;justify-content:center}
.chat-head{display:flex;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.chat-msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.chat-day{align-self:center;font:600 11px var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2);margin:6px 0}
.bub{max-width:82%;align-self:flex-start;background:var(--bg);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:8px 11px;display:grid;gap:2px}
.bub.me{align-self:flex-end;background:var(--night);color:var(--night-ink);border-color:var(--night);border-radius:14px 14px 4px 14px}
.bub b{font-size:12px;color:var(--ink-2)}
.bub .txt{white-space:pre-wrap;word-break:break-word}
.bub small{font-size:11px;opacity:.7}
.chat-compose{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);align-items:flex-end}
.chat-compose textarea{flex:1;min-height:42px;max-height:160px;resize:none;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:20px;background:var(--bg);color:inherit}
.chat-thread .note{border-radius:0}
.chat .chat-thread{display:none}
.chat.open .chat-list{display:none}
.chat.open .chat-thread{display:flex}
.phone-only{display:inline-flex}
#tabNav [data-v="clients"]{display:none}
@media (min-width:960px){
  .phone-only{display:none}
  .chat{grid-template-columns:300px minmax(0,1fr)}
  .chat .chat-list,.chat.open .chat-list{display:grid}
  .chat .chat-thread{display:flex}
  .chat-thread.empty-t{display:flex}
  .chat-back{display:none}
  .chat-thread{max-height:calc(100dvh - 120px)}
}
/* looks */
.bulb.pop::after{animation:pop 1.1s cubic-bezier(.2,.9,.3,1.3)}
@keyframes pop{0%{transform:scale(.6);filter:brightness(.6)}35%{transform:scale(1.45);filter:brightness(1.8);box-shadow:0 0 18px 8px var(--bc,var(--amber)),0 0 46px 18px color-mix(in srgb,var(--bc,var(--amber)) 40%,transparent)}100%{transform:scale(1);filter:none}}
#intro,#routelit{position:fixed;inset:0;z-index:300;display:grid;place-items:center;align-content:center;gap:10px;background:radial-gradient(ellipse at 50% 45%,#16241d 0,#080c0a 70%);color:#eaf0eb;transition:opacity .45s;cursor:pointer;overflow:hidden}
#routelit{background:color-mix(in srgb,#080c0a 82%,transparent);backdrop-filter:blur(3px)}
#intro.out,#routelit.out{opacity:0;pointer-events:none}
.intro-strand,.rl-strand{position:relative;width:min(92vw,900px);aspect-ratio:900/160}
.rl-strand{width:min(88vw,700px);aspect-ratio:700/120}
.intro-cord,.rl-cord{position:absolute;inset:0;width:100%;height:100%}
.intro-cord path,.rl-cord path{stroke-dasharray:1400;stroke-dashoffset:1400;animation:cord .5s ease-out forwards}
@keyframes cord{to{stroke-dashoffset:0}}
.ib{position:absolute;width:22px;height:32px;margin:-4px 0 0 -11px;transform-origin:50% 0}
.ib::before{content:"";position:absolute;left:6px;top:0;width:10px;height:9px;border-radius:2px 2px 0 0;background:#2a6e4e}
.ib::after{content:"";position:absolute;left:0;top:8px;width:22px;height:24px;border-radius:50% 50% 50% 50%/38% 38% 62% 62%;background:#34413b;animation:on .35s ease-out forwards;animation-delay:calc(.45s + var(--d)*.09s)}
@keyframes on{0%{background:#34413b}60%{background:#fff;box-shadow:0 0 30px 12px var(--bc)}100%{background:radial-gradient(circle at 35% 30%,#fff8 0 18%,transparent 19%),var(--bc);box-shadow:0 0 14px 4px color-mix(in srgb,var(--bc) 70%,transparent),0 0 40px 14px color-mix(in srgb,var(--bc) 30%,transparent)}}
.intro-logo{width:min(64vw,300px);height:auto;opacity:0;animation:fadein .5s ease-out 1.25s forwards;filter:drop-shadow(0 0 18px color-mix(in srgb,var(--amber) 40%,transparent))}
.intro-sub,.rl-s{font-family:var(--f-mono);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#8a9b93;opacity:0;animation:fadein .4s ease-out 1.45s forwards}
.rl-t{font-family:var(--f-sign);font-weight:900;font-size:clamp(44px,12vw,84px);line-height:1;color:var(--amber);text-transform:uppercase;letter-spacing:.02em;text-shadow:0 0 24px color-mix(in srgb,var(--amber) 55%,transparent);opacity:0;animation:fadein .4s ease-out 1.2s forwards}
.rl-s{animation-delay:1.35s}
@keyframes fadein{to{opacity:1}}
@media (prefers-reduced-motion: reduce){ .ib::after,.intro-cord path,.rl-cord path,.intro-logo,.intro-sub,.rl-t,.rl-s{animation-duration:.01s!important;animation-delay:0s!important} .bulb.pop::after{animation:none} }
canvas.snow{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
#gate .gate-card{position:relative;z-index:1}
.season{position:relative;overflow:hidden;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 14px;background:var(--night);color:var(--night-ink);border-radius:var(--r);padding:10px 14px;margin-bottom:12px}
.season-t{position:relative;z-index:1;font-family:var(--f-sign);font-weight:800;font-size:19px;letter-spacing:.03em;text-transform:uppercase}
.season-strand{position:relative;z-index:1;display:flex;gap:5px;align-items:flex-start;flex-wrap:wrap}
.season-strand .bulb{width:10px;height:15px}
.season-strand .bulb::before{left:3px;width:4px;height:4px}
.season-strand .bulb::after{top:4px;width:10px;height:11px}
.season.after .season-t{color:var(--night-dim)}
.look-combos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.look-combo{display:flex;align-items:center;gap:8px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;font-size:14px}
.look-combo[aria-pressed="true"],.look-color[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.look-swatch{display:inline-flex;gap:3px;flex:none}
.look-swatch i,.look-color i{display:inline-block;width:11px;height:16px;border-radius:50% 50% 50% 50%/38% 38% 62% 62%;background:var(--c);box-shadow:0 0 6px 1px color-mix(in srgb,var(--c) 55%,transparent);font-style:normal}
.look-colors{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.look-color{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-size:14px}
.look-color b{font-family:var(--f-mono);font-size:11px;background:var(--ink);color:var(--bg);border-radius:9px;min-width:16px;text-align:center;padding:0 4px}
.look .seg{display:flex;flex-wrap:wrap} .look .seg button{flex:1 1 auto}
.night-map .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.82) contrast(.92) saturate(.6)}
.night-map .leaflet-container{background:#0b100e}
.ava{display:inline-grid;place-items:center;flex:none;width:34px;height:34px;border-radius:50%;overflow:hidden;background:var(--night-2);color:var(--night-ink);font-family:var(--f-sign);font-weight:800;font-size:16px;box-shadow:0 0 0 2px var(--amber)}
.ava img{width:100%;height:100%;object-fit:cover}
.ava.sm{width:24px;height:24px;font-size:12px;margin-right:6px;vertical-align:middle;box-shadow:0 0 0 1.5px var(--amber)}
.ava.xs{width:18px;height:18px;font-size:10px;margin-right:5px;vertical-align:-4px;box-shadow:none}
.ava.lg{width:56px;height:56px;font-size:24px}
.who-btn{display:inline-flex;align-items:center}
.outpill{background:#f2a516;color:#1a1406;border:0;border-radius:999px;padding:4px 10px;font:700 12px var(--f-body);margin-right:8px;white-space:nowrap;animation:outp 2s ease-in-out infinite}
@keyframes outp{50%{opacity:.6}}
.vt.urgent{display:inline-block;width:auto;background:var(--red);color:#fff;vertical-align:middle;font-size:12px;padding:1px 6px}
.row.svc .m{text-align:left}
.row.svc .r{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.row.svc .s{white-space:normal}
@media (max-width:620px){ .row.svc{flex-wrap:wrap} .row.svc .r{flex-basis:100%;justify-content:flex-start;padding-left:26px} }
#welcome{position:fixed;inset:0;z-index:310;display:grid;place-items:center;align-content:center;gap:14px;background:radial-gradient(ellipse at 50% 42%,#1a2b22 0,#080c0a 72%);color:#eaf0eb;transition:opacity .45s;cursor:pointer;text-align:center;padding:24px}
#welcome.out{opacity:0;pointer-events:none}
.w-ring{position:relative;width:min(62vw,250px);aspect-ratio:1;margin-bottom:10px}
.w-ring svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.w-ring svg circle{stroke-dasharray:320;stroke-dashoffset:320;animation:cord .55s ease-out forwards}
.w-face{position:absolute;inset:13%;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:#16241d;font-family:var(--f-sign);font-weight:900;font-size:64px;color:var(--amber);box-shadow:0 0 0 3px #0b100e,0 0 40px 6px color-mix(in srgb,var(--amber) 25%,transparent);opacity:0;animation:fadein .5s ease-out .3s forwards}
.w-face img{width:100%;height:100%;object-fit:cover}
.wb{position:absolute;width:20px;height:28px;margin:-6px 0 0 -10px;transform:rotate(var(--r));transform-origin:50% 6px}
.wb::before{content:"";position:absolute;left:5px;top:0;width:10px;height:8px;border-radius:2px 2px 0 0;background:#2a6e4e}
.wb::after{content:"";position:absolute;left:0;top:7px;width:20px;height:21px;border-radius:50% 50% 50% 50%/38% 38% 62% 62%;background:#34413b;animation:on .35s ease-out forwards;animation-delay:calc(.45s + var(--d)*.07s)}
.w-hi{font-family:var(--f-sign);font-weight:900;font-size:clamp(40px,11vw,72px);line-height:1;text-transform:uppercase;letter-spacing:.02em;color:#fff;text-shadow:0 0 22px color-mix(in srgb,var(--amber) 50%,transparent);opacity:0;animation:fadein .45s ease-out 1.25s forwards}
.w-title{font-family:var(--f-mono);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#a9b8b0;opacity:0;animation:fadein .4s ease-out 1.45s forwards}
@media (prefers-reduced-motion: reduce){ .wb::after,.w-face,.w-hi,.w-title,.w-ring svg circle{animation-duration:.01s!important;animation-delay:0s!important} }
.head-prev{width:150px;height:150px;border-radius:50%;overflow:hidden;display:grid;place-items:center;margin:6px auto;background:var(--night-2);font-family:var(--f-sign);font-weight:900;font-size:60px;color:var(--amber);box-shadow:0 0 0 3px var(--amber)}
.head-prev img{width:100%;height:100%;object-fit:cover}
.head-pick{display:grid;place-items:center;text-align:center;cursor:pointer;min-height:48px}
.who-btn{background:none;border:1px solid #2a3832;border-radius:999px;color:var(--night-ink);font-size:12px;font-weight:700;padding:5px 10px;max-width:46vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.checks{display:grid;gap:8px}
.checks label{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;font-size:15px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.checks input{width:20px;height:20px;margin-top:2px;accent-color:var(--cord)}
.checks small{display:block;color:var(--ink-2);font-size:13px}
/* street map */
.map-box #map{width:100%;height:100%}
.map-box .lmap{width:100%;height:100%;background:var(--sunk)}
.map-ctl,.map-legend,.map-hint{z-index:500}
.leaflet-container{font-family:var(--f-body)}
.pin-tip{font-weight:700;font-size:12px;padding:2px 6px;border-radius:3px}
.pin-lit{filter:drop-shadow(0 0 5px var(--amber))} .night-map .pin-lit{filter:drop-shadow(0 0 7px currentColor) drop-shadow(0 0 14px var(--amber))} .night-map .pin-down{opacity:.55}
@media (prefers-color-scheme: dark){ .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.92) saturate(.6)} }
.map-ctl{position:absolute;top:8px;right:8px;display:flex;gap:6px}
.map-hint{position:absolute;left:8px;right:8px;top:52px;background:var(--ink);color:var(--bg);border-radius:var(--r);padding:8px 10px;font-weight:700;font-size:14px;display:flex;gap:8px;align-items:center;justify-content:space-between}
.map-legend{position:absolute;left:8px;bottom:8px;right:8px;display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;font-weight:700;color:var(--ink-2);pointer-events:none}
.map-legend span{display:inline-flex;align-items:center;gap:5px;background:var(--card);border-radius:3px;padding:2px 6px}
.map-legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.map-legend i.hollow{border:2px solid var(--ink-2);background:var(--card)}
.map-side{display:grid;gap:12px;align-content:start;min-width:0}
.map-side .rows .row{padding:9px 10px}
.wday{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:grid;gap:6px;align-content:start;min-width:0}
.wday.today{border-color:var(--amber);box-shadow:inset 0 3px 0 var(--amber)}
.wday h4{margin:0;display:flex;justify-content:space-between;align-items:baseline;font-family:var(--f-sign);font-weight:800;font-size:20px;text-transform:uppercase}
.wday h4 span{font-family:var(--f-mono);font-size:11px;color:var(--ink-2);font-weight:500}
.wstop{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:center;background:var(--sunk);border:0;border-radius:4px;padding:7px 8px;text-align:left;width:100%;font-size:14px}
.wstop .x{min-width:0}
.wstop .x div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wstop .x small{color:var(--ink-2);font-size:12px}
.wday .none{color:var(--ink-2);font-size:13px}

/* ---- money ---- */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:2px;min-width:0}
.tile .l{font-size:13px;color:var(--ink-2);font-weight:700}
.tile .v{font-family:var(--f-sign);font-weight:800;font-size:30px;line-height:1.05;font-variant-numeric:tabular-nums}
.tile.hero{grid-column:1/-1;background:var(--night);border-color:var(--night);color:var(--night-ink)}
.tile.hero .l{color:var(--night-dim)} .tile.hero .v{font-size:46px;color:var(--amber)}
.tbl{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:14px}
th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.tog{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:700;color:var(--ink-2)}
.tog[aria-pressed="true"]{background:var(--cord-soft);color:var(--cord);border-color:transparent}
.note{font-size:14px;padding:10px 12px;border-radius:var(--r);background:var(--amber-soft);color:var(--ink)}

/* ---- texts ---- */
.msgs{display:grid;gap:12px}
.msg{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:10px;min-width:0}
.msg header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.msg header b{font-family:var(--f-sign);font-weight:800;font-size:22px;text-transform:uppercase}
.msg textarea{width:100%;min-height:220px;border:1px solid var(--line);border-radius:4px;background:var(--sunk);padding:10px;font-family:var(--f-mono);font-size:13px;line-height:1.5;resize:vertical}

/* ---- drawer ---- */
.scrim{position:fixed;inset:0;z-index:30;background:rgba(4,8,6,.5)}
.drawer{position:fixed;z-index:31;inset:0;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.d-head{background:var(--night);color:var(--night-ink);display:flex;align-items:flex-start;gap:10px;padding-block:12px 14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.d-head .t{flex:1;min-width:0;display:grid;gap:4px}
.d-head .eyebrow{color:var(--night-dim)}
.d-head h2{margin:0;font-family:var(--f-sign);font-weight:900;font-size:32px;line-height:.95;text-transform:uppercase;overflow-wrap:anywhere}
.d-head .btn{background:var(--night-2);border-color:var(--night-2);color:var(--night-ink)}
.d-body{flex:1;overflow:auto;display:grid;align-content:start;gap:18px;padding-block:14px calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.blk{display:grid;gap:8px;min-width:0}
.blk > .h-sec{margin:0}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:15px}
.kv dt{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2);padding-top:3px}
.kv dd{margin:0;overflow-wrap:anywhere}
.visit{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.visit .x{min-width:0;display:grid;gap:2px}
.visit .x small{color:var(--ink-2)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.gallery img,.gallery video{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:4px;background:var(--sunk);cursor:zoom-in;max-width:100%}
.gallery .pdf{display:grid;place-items:center;aspect-ratio:4/3;border-radius:4px;background:var(--sunk);font-size:12px;font-weight:700;text-align:center;padding:6px}
.gal-item{position:relative}
.gal-item .x{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:14px;line-height:1}
.feed{display:grid;gap:10px}
.entry{display:grid;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;min-width:0}
.entry.done-e{background:var(--cord-soft);border-color:transparent}
.entry .meta{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--ink-2)}
.entry .txt{white-space:pre-wrap;overflow-wrap:anywhere}
.entry .media{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px}
.entry .media img,.entry .media video{width:100%;max-height:220px;object-fit:cover;border-radius:4px;background:var(--sunk);max-width:100%}
.composer{display:grid;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px}
.composer textarea{width:100%;min-height:64px;border:1px solid var(--line);border-radius:4px;padding:8px 10px;background:var(--sunk);resize:vertical}
.composer .pend{display:flex;flex-wrap:wrap;gap:6px}
.composer .pend span{font-size:12px;background:var(--sunk);border-radius:3px;padding:3px 6px;display:inline-flex;gap:6px;align-items:center;max-width:100%}
.composer .pend button{border:0;background:none;padding:0;color:var(--red);font-weight:700}
.file-btn{position:relative;overflow:hidden}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}

/* ---- forms ---- */
.form{display:grid;gap:18px}
fieldset{border:0;margin:0;padding:0;display:grid;gap:10px;min-width:0}
legend{font-family:var(--f-sign);font-weight:800;font-size:20px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-2);padding:0;margin-bottom:8px}
.f{display:grid;gap:4px;min-width:0}
.f label{font-size:14px;font-weight:700}
.f input,.f select,.f textarea{width:100%;min-height:44px;padding:8px 11px;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}

<script src="/config.js"></script>
<script src="/platform.js"></script>
<script>
const BOARD_URL = location.origin;
const DEFAULT_CREWS = [
  {id:"pl1",name:"ProLight Crew 1",co:"prolight",members:[],chat:""},
  {id:"pl2",name:"ProLight Crew 2",co:"prolight",members:[],chat:""},
  {id:"shipshape",name:"ShipShape",co:"shipshape",members:[],chat:""}];
const VTYPE = {install:"Install",takedown:"Takedown",service:"Service"};
const STAGES = [["lead","Lead"],["quoted","Quote sent"],["booked","Booked"],["cancelled","Cancelled"]];
const STATUS = {lead:"Lead",quoted:"Quote sent",booked:"Booked",scheduled:"Scheduled",partial:"Partly done",lit:"Installed",down:"Taken down",cancelled:"Cancelled"};
const BULB = {lead:"",quoted:"blue",booked:"blue",scheduled:"dim",partial:"dim",lit:"on",down:"green",cancelled:"red"};
const ICON = {
  map:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0113 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.4"/></svg>',
  route:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 3v4M18 3v4"/><path d="M3 7c3 3 6 3 9 0s6-3 9 0"/><path d="M7.5 9.5v3M12 7.5v3M16.5 9.5v3"/><circle cx="7.5" cy="15" r="2.2"/><circle cx="12" cy="13" r="2.2"/><circle cx="16.5" cy="15" r="2.2"/></svg>',
  jobs:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-5h4v5"/></svg>',
  clients:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 010 6.8M18 14.8c2 .8 3.2 2.5 3.6 5.2"/></svg>',
  week:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  chat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9.5h8M8 12.5h5"/></svg>',
  office:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v18M17 7.5c0-1.9-2.2-3-5-3s-5 1.1-5 3 2 2.8 5 3.5 5 1.6 5 3.5-2.2 3-5 3-5-1.1-5-3"/></svg>'
};

/* ---------- state ---------- */
const S = {
  clients:new Map(), jobs:new Map(), log:new Map(), fin:new Map(), finSet:{}, settings:{},
  ready:false, err:"", db:null, assets:null, user:null,
  me:{id:null, owner:false, canLog:false}, names:new Map(),
  view:"route", team:ls("team")||"all", day:todayISO(), week:monday(todayISO()),
  q:{jobs:"",clients:""}, jf:"active", office:"money", briefDay:addDays(todayISO(),1),
  drawer:null, form:null, compose:{text:"",files:[]}, busy:false
};
let doneMap = new Map(), logByJob = new Map(), partialMap = new Map();

function ls(k,v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v); }catch(e){ return null; } }
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => { const v=Math.round((n||0)*100)/100; return "$" + v.toLocaleString("en-US",{minimumFractionDigits:Number.isInteger(v)?0:2,maximumFractionDigits:2}); };
function pad(n){ return String(n).padStart(2,"0"); }
function todayISO(){ const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function parseISO(s){ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
function toISO(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function addDays(s,n){ const d=parseISO(s); d.setDate(d.getDate()+n); return toISO(d); }
function monday(s){ const d=parseISO(s); const w=(d.getDay()+6)%7; d.setDate(d.getDate()-w); return toISO(d); }
function fmtDay(s,o){ return s ? parseISO(s).toLocaleDateString("en-US", o||{month:"short",day:"numeric"}) : ""; }
function fmtTime(t){ if(!t) return ""; const [h,m]=t.split(":").map(Number); return `${((h+11)%12)+1}:${pad(m)} ${h<12?"AM":"PM"}`; }
function rel(s){ const n=Math.round((parseISO(s)-parseISO(todayISO()))/86400000); return n===0?"Today":n===1?"Tomorrow":n===-1?"Yesterday":null; }
function ago(iso){ const d=new Date(iso); return d.toLocaleDateString("en-US",{month:"short",day:"numeric"})+" · "+d.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"}); }
function uid(){ return Math.random().toString(36).slice(2,10); }
function toast(m){ const t=$("#toast"); t.textContent=m; t.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>t.hidden=true,2600); }

/* ---------- derived ---------- */
function crews(){
  const c=S.settings.crews; if(Array.isArray(c)&&c.length) return c;
  const T=S.settings.teams||{};
  return DEFAULT_CREWS.map(d=>({...d, chat:(T[d.id==="pl1"?"prolight":d.id]||{}).chat||""}));
}
const normCrew = c => c==="prolight" ? "pl1" : (c||"");
const crewObj = id => crews().find(c=>c.id===normCrew(id));
const coOf = id => (crewObj(id)||{}).co || "";
const teamName = k => (crewObj(k)||{}).name || "Unassigned";
const membersOf = k => ((crewObj(k)||{}).members||[]);
function assignUI(cur, act, extra){
  cur=normCrew(cur); const co=coOf(cur);
  const first=k=>(crews().find(c=>c.co===k)||{}).id||"";
  let h=`<div class="seg" role="group" aria-label="Company">${[["prolight","ProLight"],["shipshape","ShipShape"],["","Unassigned"]].map(([k,l])=>`<button type="button" data-act="${act}" ${extra} data-v="${esc(k?(co===k?cur:first(k)):"")}" aria-pressed="${co===k}">${l}</button>`).join("")}</div>`;
  const sub=crews().filter(c=>c.co===co);
  if(co && sub.length>1) h+=`<div class="seg" role="group" aria-label="Which crew">${sub.map(c=>`<button type="button" data-act="${act}" ${extra} data-v="${esc(c.id)}" aria-pressed="${cur===c.id}">${esc(c.name)}</button>`).join("")}</div>`;
  return h;
}
const rates = () => ({ tcl:(Number(S.finSet.tclRate)||40)/100, ss:(Number(S.finSet.ssRate)||30)/100, ssOwn:(Number(S.finSet.ssOwnRate)||30)/100 });
const clientOf = j => S.clients.get(j.clientId) || {};
const addrOf = j => j.address || clientOf(j).address || "";
const crewOf = (j,v) => normCrew((v && v.crew) || j.crew);
const isDone = (jid,vid) => doneMap.get(jid+"|"+vid);
const mapsUrl = a => dirUrl(a);
function label(j){
  const co=coOf(j.crew), crew = co==="shipshape" ? "ShipShape" : co==="prolight" ? "ProLight" : "";
  if(j.source==="tcl") return "TCL / " + (crew || "Unassigned");
  return crew==="ShipShape" ? "ProLight / ShipShape" : "ProLight";
}
function status(j){
  if(j.stage==="cancelled") return "cancelled";
  const vs=j.visits||[];
  if(vs.some(v=>v.type==="takedown"&&isDone(j.id,v.id))) return "down";
  if(vs.some(v=>isPartial(j.id,v.id)&&!isDone(j.id,v.id)&&!vs.some(x=>x.returnOf===v.id&&isDone(j.id,x.id)))) return "partial";
  if(vs.some(v=>v.type==="install"&&isDone(j.id,v.id))) return "lit";
  if(vs.some(v=>v.date)) return "scheduled";
  return j.stage||"lead";
}
function nextVisit(j){
  const t=todayISO();
  return (j.visits||[]).filter(v=>v.date && !isDone(j.id,v.id)).sort((a,b)=>a.date.localeCompare(b.date))[0] || null;
}
let _jaSrc=null,_ja=[]; function jobsArr(){ if(_jaSrc!==S.jobs){ _jaSrc=S.jobs; _ja=[...S.jobs.entries()].map(([id,d])=>({id,...d})); STOPS.clear(); } return _ja.slice(); }
const STOPS=new Map(); let _stC=null,_stL=null;
function stopsFor(date, team){
  jobsArr(); if(_stC!==S.clients||_stL!==S.log){ _stC=S.clients; _stL=S.log; STOPS.clear(); }
  const ck=date+"|"+team; if(STOPS.has(ck)) return STOPS.get(ck).slice();
  const out=[]; STOPS.set(ck,out);
  for(const j of jobsArr()){ if(j.stage==="cancelled") continue;
    for(const v of (j.visits||[])) if(v.date===date && (team==="all"||visitCrews(j,v).includes(team))) out.push({j,v}); }
  return out.sort((a,b)=>ordOf(a.v,team)-ordOf(b.v,team) || String(a.v.time||"").localeCompare(String(b.v.time||"")) || String(clientOf(a.j).name).localeCompare(String(clientOf(b.j).name))).slice();
}
function recompute(){
  doneMap=new Map(); logByJob=new Map(); partialMap=new Map();
  for(const [id,e] of S.log){ const x={id,...e};
    if(!logByJob.has(e.jobId)) logByJob.set(e.jobId,[]); logByJob.get(e.jobId).push(x);
    if(e.kind==="done") doneMap.set(e.jobId+"|"+e.visitId, x); else if(e.kind==="partial"){ const k=e.jobId+"|"+e.visitId, o=partialMap.get(k); if(!o||String(o.at)<String(e.at)) partialMap.set(k,x); } }
  for(const a of logByJob.values()) a.sort((p,q)=>String(q.at).localeCompare(String(p.at)));
}
function who(id){ if(!id) return "TCL import"; if(id==="jobber") return "Jobber"; if(id===S.me.id) return "You"; return S.names.get(id) || (S.former&&S.former[id]) || "Crew member"; }
let nameReq=false;
async function fetchNames(){
  if(!S.user||nameReq) return; const ids=[...new Set([...S.log.values()].map(e=>e.by).filter(id=>id && !S.names.has(id)))]; if(!ids.length) return;
  nameReq=true; try{ const ps=await S.user.profiles(ids); for(const id of ids) S.names.set(id, (ps[id]&&ps[id].name)||""); }catch(e){} nameReq=false; refresh();
}

/* ---------- nav ---------- */
function navItems(){ const v=isMgr()&&tab()?[["today","Today"],["jobs","Jobs"],["week","Week"],["map","Map"],["route","Route"],["chat","Chat"],["clients","Clients"]]:[["route","Route"],["jobs","Jobs"],["map","Map"],["week","Week"],["chat","Chat"],["clients","Clients"]]; if(S.me.owner||S.me.money||S.me.manage||S.me.partner) v.push(["office",S.me.partner&&!S.me.money&&!S.me.owner?"Payouts":"Office"]); return v; }
function renderNav(){
  const items=navItems();
  $("#railNav").innerHTML=items.map(([k,l])=>`<button type="button" data-act="view" data-v="${k}" aria-current="${S.view===k?"page":"false"}">${ICON[k]}${l}</button>`).join("");
  $("#tabNav").innerHTML=items.map(([k,l])=>`<button type="button" data-act="view" data-v="${k}" aria-current="${S.view===k?"page":"false"}">${ICON[k]}${l}</button>`).join("");
  { const rc=reqCount(); if(rc) document.querySelectorAll('#railNav [data-v="office"],#tabNav [data-v="office"]').forEach(b=>b.insertAdjacentHTML("beforeend",`<i class="nbadge">${rc>9?"9+":rc}</i>`)); }
  { const sc=svcCount(); if(sc) document.querySelectorAll('#railNav [data-v="week"],#tabNav [data-v="week"]').forEach(b=>b.insertAdjacentHTML("beforeend",`<i class="nbadge">${sc>9?"9+":sc}</i>`)); }
  { const un=S.chatOff?0:unreadTotal(); if(un) document.querySelectorAll('#railNav [data-v="chat"],#tabNav [data-v="chat"]').forEach(b=>b.insertAdjacentHTML("beforeend",`<i class="nbadge">${un>9?"9+":un}</i>`)); }
  const today=stopsFor(todayISO(),S.team), lit=today.filter(s=>isDone(s.j.id,s.v.id)).length;
  $("#railStrand").innerHTML = today.length ? today.map((s,i)=>`<span class="bulb ${i<lit?"on":""}"></span>`).join("") : "";
  const wt = S.team==="all" ? "All crews" : teamName(S.team);
  $("#whoRail").textContent = today.length ? `Today · ${wt} · ${lit}/${today.length} done` : `Today · ${wt} · no stops`;
  $("#whoTop").innerHTML = outPill()+`<button type="button" class="who-btn" data-act="account">${avatar(S.me.id,"sm")}${esc((S.me.name||"Me").split(" ")[0])}</button>`;
  const wb=$("#whoRailBtn"); if(wb) wb.textContent=(S.me.name||"Me")+" · Account";
}

/* ---------- views ---------- */
function teamSeg(){
  const opts=[...crews().map(c=>[c.id,c.name]),["all","All crews"]], m=S.team!=="all"?membersOf(S.team):[];
  return `<div class="chips" role="group" aria-label="Crew" style="max-width:100%">${opts.map(([k,l])=>`<button type="button" class="chip" data-act="team" data-v="${esc(k)}" aria-pressed="${S.team===k}">${esc(l)}</button>`).join("")}</div>${m.length?`<div class="count" style="font-size:14px;flex-basis:100%">On this crew: ${esc(m.join(", "))}</div>`:""}`;
}
function vRoute(){
  const d=S.day, stops=stopsFor(d,S.team), done=stops.filter(s=>isDone(s.j.id,s.v.id)).length, r=rel(d);
  S._eta=estTimes(stops);
  let h=annBanner()+(S.ready?seasonBar():"")+`<div class="dayhead">
    <div class="pager">
      <button type="button" class="btn icon" data-act="day" data-v="-1" aria-label="Previous day">‹</button>
      <div class="d"><span class="eyebrow">${r?fmtDay(d,{weekday:"long",month:"short",day:"numeric"}):"Route"}</span><h1 class="h-view">${r||fmtDay(d,{weekday:"short",month:"short",day:"numeric"})}</h1></div>
      ${d!==todayISO()?`<button type="button" class="btn small" data-act="day" data-v="0">Today</button>`:""}
      <button type="button" class="btn icon" data-act="day" data-v="1" aria-label="Next day">›</button>
    </div>
    <div class="bar">${teamSeg()}${stops.length?`<div class="prog grow"><span class="mono">${done}/${stops.length} done</span><span class="track"><span style="width:${stops.length?done/stops.length*100:0}%"></span></span></div>`:""}</div>
    ${S.ready?routeTools(d,stops):""}
  </div>`;
  if(!S.ready){ h+= S.err?`<div class="note">${esc(S.err)}</div>`:skel(5); return h; }
  let list;
  if(!stops.length){
    list=`<div class="empty"><div class="unlit"><span class="bulb lg"></span><span class="bulb lg"></span><span class="bulb lg"></span></div>
      <h3>No stops ${r?r.toLowerCase():"this day"}</h3>
      <p>${S.jobs.size? "Nothing is scheduled for this crew on this day. Use the arrows to check another day." : S.me.owner? "Start by adding a client and a job, then give the job an install date and a crew. It shows up here as a stop on that crew's route." : "Once the office schedules jobs for your crew, they show up here in route order."}</p>
      ${S.me.owner&&!S.jobs.size?`<div><button type="button" class="btn amber" data-act="new-job">Add the first job</button></div>`:""}</div>`;
  } else list=`<div class="stops">${stops.map((s,i)=>stopCard(s,i,stops.length)+(S._eta&&S._eta.lunch&&S._eta.lunch.after===i?lunchCard(S._eta.lunch,d):"")).join("")}</div>`;
  const side = S.me.owner ? `<div class="side-card"><span class="eyebrow">Night-before text</span><p class="lede" style="font-size:14px">Copy each crew's run sheet for ${esc(fmtDay(addDays(d,0),{weekday:"short",month:"short",day:"numeric"}))} into their group chat.</p><button type="button" class="btn ink" data-act="texts" data-v="${d}">Open texts for this day</button></div>` : "";
  h+= (wide()&&stops.length) ? `<div class="route-cols rc-map"><div>${list}</div><div class="route-side">${routeSide()}${side||""}</div></div>` : side ? `<div class="route-cols"><div>${list}</div>${side}</div>` : list;
  return h;
}
function stopCard(s,i,n){
  const {j,v}=s, c=clientOf(j), d=isDone(j.id,v.id), a=addrOf(j), crew=crewOf(j,v);
  const pp=isPartial(j.id,v.id); const notes=[c.gate?`Access: ${c.gate}`:"", j.notes||"", v.note||"", pp&&!d?`Left to do: ${pp.left}`:""].filter(Boolean).join("\n");
  const media=(j.mockups||[]).filter(m=>m.type!=="pdf");
  const nLog=(logByJob.get(j.id)||[]).filter(e=>e.kind==="note").length;
  let doneBtn="";
  if(d){ const can=S.me.owner||d.by===S.me.id; doneBtn = can ? `<button type="button" class="btn done" data-act="undone" data-id="${esc(d.id)}" title="Undo">✓ Done · ${esc(who(d.by))}, ${new Date(d.at).toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"})}</button>` : `<span class="btn done">✓ Done · ${esc(who(d.by))}</span>`; }
  else if(S.me.canLog) doneBtn=`<button type="button" class="btn amber" data-act="done" data-j="${esc(j.id)}" data-v="${esc(v.id)}">Mark ${VTYPE[v.type].toLowerCase()} done</button>`;
  return `<article class="stop ${d?"is-done":""}" data-sj="${esc(j.id)}">
    <div class="rail-c"><span class="bulb lg ${d?"on":""}${popCls(j,v)}"></span></div>
    <div class="ticket">
      <div class="t-top"><span class="ord">STOP ${pad(i+1)}</span><span class="vt ${v.type}">${VTYPE[v.type]}</span>${stopTimeTag(s)}${crewTags(j,v)}<span class="lbl ${j.source==="tcl"?"tcl":"pl"}">${esc(label(j))}</span><span class="sp"></span>
        ${S.me.owner&&n>1?`<span class="mv"><button type="button" class="btn icon small" data-act="move" data-j="${esc(j.id)}" data-v="${esc(v.id)}" data-d="-1" ${i===0?"disabled":""} aria-label="Move up">↑</button><button type="button" class="btn icon small" data-act="move" data-j="${esc(j.id)}" data-v="${esc(v.id)}" data-d="1" ${i===n-1?"disabled":""} aria-label="Move down">↓</button></span>`:""}</div>
      <button type="button" class="t-name" data-act="job" data-id="${esc(j.id)}">${esc(c.name||"Customer")}</button>
      ${a?`<div class="t-addr">${esc(a)}</div>`:""}
      ${visitExtrasLine(v)}
      ${(j.scope||j.rooflineFt)?`<div class="t-facts">${j.scope?`<span><b>Lights</b>${esc(j.scope)}</span>`:""}${j.rooflineFt?`<span><b>Roofline</b><span class="mono">${esc(j.rooflineFt)} ft</span></span>`:""}</div>`:""}
      ${notes?`<div class="t-notes">${esc(notes)}</div>`:""}
      ${media.length?`<div class="thumbs">${media.map(m=>mediaTag(m)).join("")}</div>`:""}
      <div class="t-actions">${doneBtn}${d?"":partialBtn(j,v)}${clockBtn(j,v)}${a?`<a class="btn" href="${esc(mapsUrl(a))}" target="_blank" rel="noopener">Directions ↗</a>`:""}<button type="button" class="btn" data-act="job" data-id="${esc(j.id)}">Notes & photos${nLog?` · ${nLog}`:""}</button>${(j.links||[]).map((u,k)=>`<a class="btn" href="${esc(u)}" target="_blank" rel="noopener">Mockup${j.links.length>1?" "+(k+1):""} ↗</a>`).join("")}</div>
    </div>
  </article>`;
}
function mediaTag(m){
  const src=mediaUrl(m.id);
  if(m.type==="video") return `<video src="${esc(src)}" controls playsinline preload="metadata"></video>`;
  if(m.type==="pdf") return `<a class="pdf" href="${esc(src)}" target="_blank" rel="noopener">PDF<br>${esc(m.name||"mockup")}</a>`;
  return `<img src="${esc(src)}" alt="${esc(m.name||"Photo")}" loading="lazy" data-act="zoom" data-src="${esc(src)}">`;
}

function vJobs(){
  const F=[["active","Active"],["unassigned","Needs a crew"],["unsched","Needs a date"],["scheduled","Scheduled"],["lit","Installed"],["down","Taken down"],["tcl","TCL"],["pl","ProLight"],["co-prolight","ProLight crews"],["co-shipshape","ShipShape crew"],["all","All"]];
  let list=jobsArr(); const q=S.q.jobs.trim().toLowerCase();
  if(q) list=list.filter(j=>{ const c=clientOf(j); return [c.name,addrOf(j),c.phone,j.tclRef,j.scope,j.notes,label(j)].join(" ").toLowerCase().includes(q); });
  const f=S.jf, st=j=>status(j);
  if(f==="active") list=list.filter(j=>!["down","cancelled"].includes(st(j)));
  if(f==="unsched") list=list.filter(j=>["lead","quoted","booked"].includes(st(j)) || (st(j)==="lit" && !(j.visits||[]).some(v=>v.type==="takedown"&&v.date)));
  if(["scheduled","lit","down"].includes(f)) list=list.filter(j=>st(j)===f);
  if(f==="tcl") list=list.filter(j=>j.source==="tcl"); if(f==="pl") list=list.filter(j=>j.source!=="tcl");
  if(f.startsWith("co-")) list=list.filter(j=>coOf(j.crew)===f.slice(3));
  if(f==="unassigned") list=list.filter(j=>!j.crew && j.stage!=="cancelled");
  list.sort((a,b)=>{ const x=nextVisit(a), y=nextVisit(b); if(x&&y) return x.date.localeCompare(y.date); if(x) return -1; if(y) return 1; return String(clientOf(a).name).localeCompare(String(clientOf(b).name)); });
  let h=`<div class="bar"><h1 class="h-view grow">Jobs</h1><button type="button" class="btn phone-only" data-act="view" data-v="clients">Clients</button>${S.me.owner?`<button type="button" class="btn amber" data-act="new-job">+ New job</button>`:""}</div>
    <input class="search" id="q-jobs" type="search" placeholder="Search name, address, TCL #, lights" value="${esc(S.q.jobs)}" aria-label="Search jobs">
    <div class="chips" role="group" aria-label="Filter jobs">${F.map(([k,l])=>`<button type="button" class="chip" data-act="jf" data-v="${k}" aria-pressed="${S.jf===k}">${l}</button>`).join("")}</div>`;
  if(!S.ready) return h+skel(5);

const hasPct = v => v!==undefined && v!==null && v!=="" && !isNaN(Number(v));
const pctTxt = x => (Math.round(x*1000)/10)+"%";
function split(j,f){
  const R=rates(), p=Number(f&&f.price)||0, custom=hasPct(f&&f.ssPct);
  const sp = custom ? Number(f.ssPct)/100 : (coOf(j.crew)==="shipshape" ? (j.source==="tcl" ? R.ss : R.ssOwn) : 0);
  const ex = j.source==="tcl" ? extraTotal(f) : 0, inc = (j.source==="tcl" ? p*R.tcl : p) + ex, ss=p*sp;
  return {price:p,incoming:inc,ss,net:inc-ss,ssPct:sp,custom,extras:ex};
}
function briefText(team,date){
  const stops=stopsFor(date,team), tn=team==="all"?"All crews":teamName(team);
  const L=[`${tn.toUpperCase()} · ${fmtDay(date,{weekday:"long",month:"short",day:"numeric"})}`];
  if(team!=="all" && membersOf(team).length) L.push("Crew: "+membersOf(team).join(", "));
  if(!stops.length){ L.push("No stops scheduled."); return L.join("\n"); }
  const eta=estTimes(stops), wx=wxText(date);
  if(wx) L.push(wx);
  L.push(`Leave from the shop: ${shop().address}`);
  if(team!=="all"){ const U=routeUrls(stops); if(U) L.push("Route in Apple Maps: "+U.apple, "Route in Google Maps: "+U.google); const ta=assignOf(date,team); if(ta) L.push(`Truck: ${ta.truck||"not set"}${ta.trailer?" + trailer "+ta.trailer:" · no trailer"}${ta.note?" · "+ta.note:""}`); }
  L.push("",`${stops.length} stop${stops.length>1?"s":""}, in this order:`,"");
  stops.forEach((s,i)=>{ const c=clientOf(s.j), a=addrOf(s.j);
    L.push(`${i+1}. ${VTYPE[s.v.type].toUpperCase()}${s.v.time?" @ "+fmtTime(s.v.time):""} · ${c.name||"Customer"} (${label(s.j)})`);
    if(a) L.push("   "+a, "   Map: "+mapsUrl(a));
    { const e=eta.get(s.j.id+"|"+s.v.id); if(e){ const i=etaInfo(e,date); if(!e.fixed||i.temp) L.push(`   ${e.fixed?"Temp":"Est. arrival"}: ${e.fixed?"":i.time.replace("~","")}${i.temp?(e.fixed?"":", ")+i.temp+"F":""}`); } }
    const lights=[s.j.scope, s.j.rooflineFt?s.j.rooflineFt+" ft roofline":""].filter(Boolean).join(", "); if(lights) L.push("   Lights: "+lights);
    if(c.gate) L.push("   Access: "+c.gate);
    if(s.j.notes) L.push("   Notes: "+s.j.notes.replace(/\n+/g," / "));
    if(s.v.note) L.push("   This visit: "+s.v.note);
    const mk=(s.j.mockups||[]).length; if(mk) L.push(`   Mockup: ${mk} file${mk>1?"s":""} on the board`);
    (s.j.links||[]).forEach((u,k)=>L.push(`   Mockup${s.j.links.length>1?" "+(k+1):""}: ${u}`));
    { const cs=visitCrews(s.j,s.v); if(team==="all") L.push("   Crew: "+(cs.map(teamName).join(" + ")||"Unassigned")); else if(cs.length>1) L.push("   Also on this job: "+cs.filter(c=>c!==team).map(teamName).join(", "));
      const tk=visitTrucks(s.v); if(tk.length) L.push("   Trucks on this job: "+tk.join(", "));
      if(s.v.returnOf) L.push("   RETURN VISIT, finish what was left"); }
    L.push("");
    if(eta.lunch&&eta.lunch.after===i) L.push(`LUNCH ~${minTxt(eta.lunch.min)} (${LUNCH_MIN} min)`, ""); });
  if(team!=="all"){ const tt=truckText(truckList(stops)); if(tt) L.push("TRUCK LIST", tt, ""); }
  L.push("Mockups, photos and check-off:", BOARD_URL);
  return L.join("\n");
}

/* ---------- shop, best route order, arrival estimates ---------- */
const SHOP_DEFAULT={address:"2821 Industrial Plaza Dr, Tallahassee, FL 32301",lat:30.45029,lng:-84.22834,leave:"08:00"};
const shop=()=>({...SHOP_DEFAULT,...(S.settings.shop||{})});
const ROAD=1.3, MPH=30, ON_SITE={install:90,takedown:45,service:45};
const legMiles=(a,b)=>miles(a,b)*ROAD;
function routeMiles(pts){ const s=shop(); let t=0, prev=s; for(const p of pts){ t+=legMiles(prev,p); prev=p; } return pts.length? t+legMiles(prev,s) : 0; }
function bestOrder(stops){
  const geo=stops.filter(s=>hasLL(s.j)), rest=stops.filter(s=>!hasLL(s.j));
  if(geo.length<2) return [...geo,...rest];
  const s=shop(); let left=geo.slice(), path=[], cur=s;
  while(left.length){ let bi=0,bd=Infinity; left.forEach((x,i)=>{ const d=miles(cur,x.j); if(d<bd){bd=d;bi=i;} }); cur=left[bi].j; path.push(left.splice(bi,1)[0]); }
  let improved=true, guard=0;
  while(improved && guard++<300){ improved=false;
    for(let i=0;i<path.length-1;i++) for(let k=i+1;k<path.length;k++){
      const a=i===0?s:path[i-1].j, b=path[i].j, c=path[k].j, d=k===path.length-1?s:path[k+1].j;
      if(miles(a,c)+miles(b,d) < miles(a,b)+miles(c,d)-1e-9){ path=[...path.slice(0,i),...path.slice(i,k+1).reverse(),...path.slice(k+1)]; improved=true; } } }
  return [...path,...rest];
}
async function applyOrder(date, crewId){
  const stops=stopsFor(date,crewId); if(stops.length<2) return null;
  const before=routeMiles(stops.filter(s=>hasLL(s.j)).map(s=>s.j));
  const ord=bestOrder(stops), changes=new Map();
  ord.forEach((s,idx)=>{ const base=changes.get(s.j.id)||(S.jobs.get(s.j.id).visits||[]).map(x=>({...x})); const t=base.find(x=>x.id===s.v.id); if(t&&ordOf(t,crewId)!==idx+1){ setOrd(s.j,t,crewId,idx+1); changes.set(s.j.id,base); } });
  for(const [id,visits] of changes) await S.db.doc("jobs/"+id).update({visits,updatedAt:new Date().toISOString()});
  return {before, after:routeMiles(ord.filter(s=>hasLL(s.j)).map(s=>s.j)), unplaced:ord.filter(s=>!hasLL(s.j)).length};
}

function estTimes(stops){
  const m=new Map(), lv=(shop().leave||"08:00").split(":").map(Number); let t=lv[0]*60+(lv[1]||0), prev=shop();
  let lunch=null;

/* ---------- sunset + weather ---------- */
function sunsetFor(dateISO,lat=30.44,lng=-84.28){
  const d=parseISO(dateISO), rad=Math.PI/180;
  const N=Math.round((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-Date.UTC(d.getFullYear(),0,0))/864e5);
  const lngHour=lng/15, t=N+((18-lngHour)/24), M=(0.9856*t)-3.289;
  let L=(M+(1.916*Math.sin(M*rad))+(0.020*Math.sin(2*M*rad))+282.634+360)%360;
  let RA=(Math.atan(0.91764*Math.tan(L*rad))/rad+360)%360; RA+=(Math.floor(L/90)*90-Math.floor(RA/90)*90); RA/=15;
  const sinDec=0.39782*Math.sin(L*rad), cosDec=Math.cos(Math.asin(sinDec));
  const cosH=(Math.cos(90.833*rad)-(sinDec*Math.sin(lat*rad)))/(cosDec*Math.cos(lat*rad)); if(cosH<-1||cosH>1) return null;
  const H=Math.acos(cosH)/rad/15, T=H+RA-(0.06571*t)-6.622; let UT=(T-lngHour)%24; if(UT<0) UT+=24;
  return new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())+UT*3600e3);
}
const clockTxt=dt=>dt.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit",timeZone:"America/New_York"});
const WX={hourly:null,daily:null,at:0,loading:false};
async function loadWx(){

    const p=await fetch("https://api.weather.gov/points/30.45,-84.23").then(r=>r.json());
    const [h,d]=await Promise.all([fetch(p.properties.forecastHourly).then(r=>r.json()),fetch(p.properties.forecast).then(r=>r.json())]);
    WX.hourly=h.properties.periods; WX.daily=d.properties.periods; WX.at=Date.now(); WX.loading=false; refresh(); return;
  }catch(e){ WX.at=Date.now()-25*60e3; }
  WX.loading=false;
}
function wxAt(dateISO,hour){ if(!WX.hourly||!dateISO) return null; const t=new Date(`${dateISO}T${pad(hour)}:00:00`); return WX.hourly.find(p=>new Date(p.startTime)<=t&&new Date(p.endTime)>t)||null; }

/* ---------- truck list ---------- */
const RUN_KINDS=["C9s","Minis","Nets","Garland","Wreath","Stakes","Other"];
const KIND_LABEL={C9s:"C9 bulbs",Minis:"Mini lights",Nets:"Net lights",Garland:"Lit garland",Wreath:"Wreaths",Stakes:"Stake lights",Other:"Spritzers / other"};
function parseRuns(j){
  const txt=j.notes||"", i=txt.indexOf("WHAT GOES WHERE"), block=i>=0?txt.slice(i+15):txt;
  const lines=block.split("\n").map(x=>x.trim()).filter(Boolean), runs=[], re=new RegExp("^("+RUN_KINDS.join("|")+")\\b\\s*·\\s*(.*)$");
  for(let k=0;k<lines.length;k++){
    const L=lines[k]; if(/^POWER:/.test(L)) break;
    const m=L.match(re); if(!m) continue;
    const parts=m[2].split("·").map(x=>x.trim());
    const color=/not set/i.test(parts[0]||"")?"Color TBD":(parts[0]||"");
    const clip=parts.find(p=>/clip|tabs|zip ties/i.test(p)&&!/wrap only|no clips/i.test(p))||"";
    const q=parts.map(p=>p.match(/^(\d+)(?: strands)?$/)).find(Boolean);
    runs.push({kind:m[1],color,clip,qty:q?+q[1]:null,area:(lines[k-1]&&!re.test(lines[k-1]))?lines[k-1]:""});
  }
  return runs;
}
function truckList(stops){
  const agg=new Map(), clips=new Map(), flags=[], noPlan=[]; let ft=0, ftJobs=0, downs=0;
  for(const s of stops){
    const j=s.j, nm=clientOf(j).name||"Customer";
    if(s.v.type==="takedown"){ downs++; continue; }
    const runs=parseRuns(j); if(!runs.length) noPlan.push(nm);
    for(const r of runs){
      const key=r.kind+"|"+r.color, a=agg.get(key)||{kind:r.kind,color:r.color,runs:0,qty:0,jobs:new Set()};
      a.runs++; if(r.qty) a.qty+=r.qty; a.jobs.add(nm); agg.set(key,a);
      if(r.clip) clips.set(r.clip,(clips.get(r.clip)||0)+1);
    }
    if(Number(j.rooflineFt)){ ft+=Number(j.rooflineFt); ftJobs++; }
    if(/client owns|stored in (his|her|their) garage|has (her|his|their) own/i.test(j.notes||"")) flags.push(`${nm}: uses the client's own lights`);
  }
  const items=[...agg.values()].sort((a,b)=>RUN_KINDS.indexOf(a.kind)-RUN_KINDS.indexOf(b.kind)||b.runs-a.runs);
  return {items, clips:[...clips.entries()].sort((a,b)=>b[1]-a[1]), ft, ftJobs, flags, noPlan, downs, n:stops.length};
}
function truckText(t){
  const L=[];
  for(const it of t.items) L.push(`- ${KIND_LABEL[it.kind]||it.kind}: ${it.color}, ${it.kind==="Wreath"?(it.qty||it.runs)+" wreath"+((it.qty||it.runs)>1?"s":""):it.runs+" run"+(it.runs>1?"s":"")}${it.qty&&it.kind!=="Wreath"?` (${it.qty} listed)`:""} · ${[...it.jobs].length} house${[...it.jobs].length>1?"s":""}`);
  if(t.clips.length) L.push("- Clips: "+t.clips.map(([c,n])=>`${c} (${n})`).join(", "));
  if(t.ftJobs) L.push(`- Roofline footage on file: ${t.ft} ft across ${t.ftJobs} house${t.ftJobs>1?"s":""}`);
  if(t.downs) L.push(`- Takedowns: ${t.downs}. Bring bins, labels and the ladder kit`);
  t.flags.forEach(f=>L.push("- "+f));
  if(t.noPlan.length) L.push("- No light plan yet: "+t.noPlan.join(", "));
  return L.join("\n");
}
function truckHTML(t){
  if(!t.n) return `<p class="lede">No stops.</p>`;
  return `<div class="rows">${t.items.map(it=>`<div class="row" style="cursor:default"><span class="lbl">${esc(KIND_LABEL[it.kind]||it.kind)}</span><span class="m"><span class="n">${esc(it.color)}</span><span class="s">${esc([...it.jobs].join(", "))}</span></span><span class="r mono" style="font-size:14px">${it.kind==="Wreath"?(it.qty||it.runs)+" wreath"+((it.qty||it.runs)>1?"s":""):it.runs+" run"+(it.runs>1?"s":"")}</span></div>`).join("")||`<div class="row" style="cursor:default"><span></span><span class="m"><span class="s">No light plans written for these stops yet.</span></span><span></span></div>`}</div>

/* ---------- clock in / out ---------- */
const AUTO={on:false,watch:null,lock:null,far:0,last:null,near:""};
const fmtDur=ms=>{ const m=Math.max(0,Math.round(ms/60000)); return `${Math.floor(m/60)}h ${pad(m%60)}m`; };
function clocks(jid,vid){ const out=[]; for(const [id,e] of S.log) if(e.kind==="clock"&&!e.pending&&e.jobId===jid&&(!vid||e.visitId===vid)) out.push({id,...e}); return out; }
function myOpenClock(){ for(const [id,e] of S.log) if(e.kind==="clock"&&!e.general&&e.by===S.me.id&&!e.out) return {id,...e}; return null; }
function clockMs(c){ return (c.out?Date.parse(c.out):Date.now())-Date.parse(c.in); }
function onSite(jid,vid){ const cs=clocks(jid,vid); if(!cs.length) return ""; const ppl=new Set(cs.map(c=>c.by)).size; return ` · on site ${fmtDur(cs.reduce((t,c)=>t+clockMs(c),0))}${ppl>1?` (${ppl} people)`:""}`; }
function clockBtn(j,v){
  if(!S.me.canLog||isDone(j.id,v.id)) return "";
  const mine=clocks(j.id,v.id).find(c=>c.by===S.me.id&&!c.out);
  return mine ? `<button type="button" class="btn ink" data-act="clock-out" data-id="${esc(mine.id)}">Clock out · ${fmtDur(clockMs(mine))}</button>`
              : `<button type="button" class="btn" data-act="clock-in" data-j="${esc(j.id)}" data-v="${esc(v.id)}">Clock in</button>`;
}
async function clockIn(jid,vid,auto){
  const open=myOpenClock();
  if(open){ if(open.jobId===jid&&open.visitId===vid) return; await clockOut(open.id,auto,true,true); }
  { const g=myOpenGeneral(); if(g) await S.db.doc("log/"+g.id).update({out:new Date().toISOString(),autoOut:!!auto}).catch(()=>{}); }
  const now=new Date().toISOString();
  try{ await S.db.collection("log").add({kind:"clock",jobId:jid,visitId:vid,by:S.me.id,in:now,out:null,auto:!!auto,at:now,...(navigator.onLine?{}:{offline:true})}); toast(auto?`Clocked in at ${clientOf(S.jobs.get(jid)||{}).name||"this stop"}`:"Clocked in"); }
  catch(e){ fail(e,"clock in"); }
}
async function clockOut(id,auto,quiet,noResume){
  try{ await S.db.doc("log/"+id).update({out:new Date().toISOString(),autoOut:!!auto}); if(!quiet) toast(auto?"Clocked out. Driving time is on.":"Clocked out"); if(!noResume) setTimeout(()=>resumeGeneral(auto),300); }
  catch(e){ fail(e,"clock out"); }
}
function clockEntry(e){
  const t=x=>new Date(x).toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"});
  return `<div class="entry"><div class="meta"><span><b>${esc(who(e.by))}</b> ${e.out?"was on site":"clocked in"}${e.auto?" (auto)":""}</span><span>${esc(fmtDay(isoOf(e.in)))}</span></div>
    <div class="txt mono" style="font-size:13px">${t(e.in)} – ${e.out?t(e.out):"now"} · ${fmtDur(clockMs(e))}</div></div>`;
}
const isoOf=x=>toISO(new Date(x));
function autoStatus(){
  if(!AUTO.last) return "Waiting for your location…";
  if(dayEnded()) return "Your day is done.";
  if(!dayStarted()) return "You'll clock in when you get to the shop, or at your first stop.";
  const open=myOpenClock(); if(open) return `On site at ${clientOf(S.jobs.get(open.jobId)||{}).name||"a stop"}. You'll clock out when you drive off.`;
  const g=myOpenGeneral(), lead=g?(g.where==="shop"?"At the shop, clocked in. ":"Driving time is on. "):"";
  return lead+(AUTO.near ? `Next: ${AUTO.near}. You'll switch to that job when you get there.` : "No stops left. You'll clock out for the day when you leave the shop.");
}
function autoStops(){
  const me=PL.me()||{}; const team=S.team!=="all"?S.team:(me.crew||"all");
  return stopsFor(todayISO(),team).filter(s=>hasLL(s.j)&&!isDone(s.j.id,s.v.id));
}
let autoBusy=false;
async function onPos(p){
  AUTO.last={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy,at:Date.now()};
  if(autoBusy) return; autoBusy=true;
  try{
    const me=AUTO.last, open=myOpenClock(), list=autoStops();
    let best=null,bd=Infinity; for(const s of list){ const d=miles(me,s.j)*1609; if(d<bd){bd=d;best=s;} }
    AUTO.near = best ? `${clientOf(best.j).name||"Customer"}, ${bd<1609?Math.round(bd*3.28)+" ft":(bd/1609).toFixed(1)+" mi"}` : "";
    if(p.coords.accuracy<=150){
      if(open){ const j=S.jobs.get(open.jobId); if(j&&hasLL(j)){ if(miles(me,j)*1609>300){ if(++AUTO.far>=2){ AUTO.far=0; await clockOut(open.id,true); } } else AUTO.far=0; } }
      else if(best && bd<=120) await clockIn(best.j.id,best.v.id,true);
      const sh=shop(), dShop=hasLL(sh)?miles(me,sh)*1609:Infinity;
      if(dShop<=150){
        if(!dayStarted()) await startGeneral("shop",true);
        else if(!dayEnded() && myToday().some(c=>!c.general)) AUTO.backAtShop=true;
        AUTO.shopFar=0;
      } else if(!AUTO.backAtShop && dShop>300 && (myOpenGeneral()||{}).where==="shop"){
        if(++AUTO.shopFar>=2){ AUTO.shopFar=0; const g=myOpenGeneral(); await S.db.doc("log/"+g.id).update({out:new Date().toISOString(),autoOut:true}); await startGeneral("travel",true); }
      } else if(AUTO.backAtShop && !myOpenClock() && dShop>400 && !list.length){
        if(++AUTO.shopFar>=2){ AUTO.backAtShop=false; AUTO.shopFar=0; await stopGeneral(true,true); }
      }
    }
  } finally { autoBusy=false; if(S.view==="route"&&!S.drawer) renderMain(); }
}
async function setAuto(on){
  if(on){
    if(!navigator.geolocation){ toast("This phone can't share its location with the board."); return; }
    AUTO.watch=navigator.geolocation.watchPosition(onPos,err=>{ toast(err.code===1?"Location is blocked. Allow it for this site in your phone's settings.":"Can't get your location right now."); if(err.code===1) setAuto(false); },{enableHighAccuracy:true,maximumAge:15000,timeout:30000});
    try{ AUTO.lock=await navigator.wakeLock.request("screen"); }catch(e){}
    AUTO.on=true; ls("autoClock","1"); toast("Auto clock-in is on. Keep the board open on screen.");
  } else {
    if(AUTO.watch!=null) navigator.geolocation.clearWatch(AUTO.watch);
    try{ AUTO.lock&&AUTO.lock.release(); }catch(e){}
    Object.assign(AUTO,{on:false,watch:null,lock:null,far:0,last:null,near:""}); ls("autoClock","0");
  }
  renderMain();
}
document.addEventListener("visibilitychange",async()=>{ if(AUTO.on&&!document.hidden){ try{ AUTO.lock=await navigator.wakeLock.request("screen"); }catch(e){} } });

function ledger(party){ return [...S.pays.entries()].map(([id,p])=>({id,...p})).filter(p=>p.party===party).sort((a,b)=>String(b.date).localeCompare(String(a.date))); }

function moneyTotals(){
  const R=moneyRows(), sum=(a,fn)=>a.reduce((t,x)=>t+(fn(x)||0),0);
  const tcl=R.filter(r=>r.j.source==="tcl"&&(r.s.price||r.s.extras)), own=R.filter(r=>r.j.source!=="tcl"&&r.s.price), ss=R.filter(r=>r.s.ss>0);
  const tPaid=paidSet("tcl"), sPaid=paidSet("shipshape");
  const T={ R,
    tcl:{rows:tcl, booked:sum(tcl,r=>r.s.incoming), earned:sum(tcl.filter(r=>r.done),r=>r.s.incoming), paid:sum(ledger("tcl"),p=>+p.amount), paidSet:tPaid},
    ss:{rows:ss, booked:sum(ss,r=>r.s.ss), earned:sum(ss.filter(r=>r.done),r=>r.s.ss), paid:sum(ledger("shipshape"),p=>+p.amount), paidSet:sPaid},

async function savePay(){
  const F=S.form.pay, amount=parseFloat(String($("#py-amount").value).replace(/[$,]/g,""));
  if(!(amount>0)){ $("#py-err").textContent="Enter the amount."; return; }
  const jobs=[...F.jobs], id="pay-"+uid()+uid().slice(0,4);
  const doc={party:F.party,amount:Math.round(amount*100)/100,date:$("#py-date").value||todayISO(),method:$("#py-method").value,memo:$("#py-memo").value.trim(),jobs,at:new Date().toISOString(),by:S.me.id};
  try{

    const flag=F.party==="tcl"?"collected":"ssPaid";
    for(const jid of jobs){ const f=S.fin.get(jid)||{}; if(!f[flag]) await S.db.doc("fin/"+jid).set({...f,[flag]:true}); }
    toast(`Saved ${money2(doc.amount)} ${F.party==="tcl"?"from TCL":"to ShipShape"}`); closeDrawer();
  }catch(e){ fail(e,"save the payment"); }

async function delPay(id){
  const p=S.pays.get(id); if(!p) return;
  try{
    await S.db.doc("fin/"+id).delete();
    const still=new Set(); for(const [pid,q] of S.pays) if(pid!==id&&q.party===p.party) (q.jobs||[]).forEach(x=>still.add(x));
    const flag=p.party==="tcl"?"collected":"ssPaid";
    for(const jid of (p.jobs||[])) if(!still.has(jid)){ const f=S.fin.get(jid)||{}; if(f[flag]) await S.db.doc("fin/"+jid).set({...f,[flag]:false}); }
    S.delPay=null; toast("Payment deleted");
  }catch(e){ fail(e,"delete the payment"); }
}

async function findFood(c){
  const key=c.lat.toFixed(3)+","+c.lng.toFixed(3); if(FOOD.cache.has(key)) return FOOD.cache.get(key);
  const q=`[out:json][timeout:20];nwr["amenity"~"^(fast_food|cafe|restaurant)$"](around:4000,${c.lat},${c.lng});out center tags 200;`;
  const r=await fetch("https://overpass-api.de/api/interpreter",{method:"POST",body:"data="+encodeURIComponent(q)});
  if(!r.ok) throw new Error("lookup failed");
  const d=await r.json();
  const list=d.elements.map(e=>{ const t=e.tags||{}; return {name:t.name||t.brand, brand:t.brand||"", amenity:t.amenity, cuisine:(t.cuisine||"").split(";")[0].replace(/_/g," "), drive:t.drive_through==="yes", hours:t.opening_hours||"", lat:e.lat??(e.center&&e.center.lat), lng:e.lon??(e.center&&e.center.lon), street:[t["addr:housenumber"],t["addr:street"]].filter(Boolean).join(" ")}; }).filter(p=>p.name&&p.lat);
  FOOD.cache.set(key,list); return list;
}
