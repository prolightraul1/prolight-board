/* ---------- truck list ---------- */
const RUN_KINDS=["C9s","Minis","Nets","Garland","Wreath","Stakes","Other"];
const KIND_LABEL={C9s:"C9 bulbs",Minis:"Mini lights",Nets:"Net lights",Garland:"Lit garland",Wreath:"Wreaths",Stakes:"Stake lights",Other:"Spritzers / other"};
function parseRuns(j){
  const txt=j.notes||"", i=txt.indexOf("WHAT GOES WHERE"), block=i>=0?txt.slice(i+15):txt;
  const lines=block.split("\n").map(x=>x.trim()).filter(Boolean), runs=[], re=new RegExp("^("+RUN_KINDS.join("|")+")\\b\\s*·\\s*(.*)$");
  for(let k=0;k<lines.length;k++){
    const L=lines[k]; if(/^POWER:/.test(L)) break;
    const m=L.match(re); if(!m) continue;
    const parts=m[2].split("·").map(x=>x.trim());
    const color=/not set/i.test(parts[0]||"")?"Color TBD":(parts[0]||"");
    const clip=parts.find(p=>/clip|tabs|zip ties/i.test(p)&&!/wrap only|no clips/i.test(p))||"";
    const q=parts.map(p=>p.match(/^(\d+)(?: strands)?$/)).find(Boolean);
    runs.push({kind:m[1],color,clip,qty:q?+q[1]:null,area:(lines[k-1]&&!re.test(lines[k-1]))?lines[k-1]:""});
  }
  return runs;
}
function truckList(stops){
  const agg=new Map(), clips=new Map(), flags=[], noPlan=[]; let ft=0, ftJobs=0, downs=0;
  for(const s of stops){
    const j=s.j, nm=clientOf(j).name||"Customer";
    if(s.v.type==="takedown"){ downs++; continue; }
    const runs=parseRuns(j); if(!runs.length) noPlan.push(nm);
    for(const r of runs){
      const key=r.kind+"|"+r.color, a=agg.get(key)||{kind:r.kind,color:r.color,runs:0,qty:0,jobs:new Set()};
      a.runs++; if(r.qty) a.qty+=r.qty; a.jobs.add(nm); agg.set(key,a);
      if(r.clip) clips.set(r.clip,(clips.get(r.clip)||0)+1);
    }
    if(Number(j.rooflineFt)){ ft+=Number(j.rooflineFt); ftJobs++; }
    if(/client owns|stored in (his|her|their) garage|has (her|his|their) own/i.test(j.notes||"")) flags.push(`${nm}: uses the client's own lights`);
  }
  const items=[...agg.values()].sort((a,b)=>RUN_KINDS.indexOf(a.kind)-RUN_KINDS.indexOf(b.kind)||b.runs-a.runs);
  return {items, clips:[...clips.entries()].sort((a,b)=>b[1]-a[1]), ft, ftJobs, flags, noPlan, downs, n:stops.length};
}
function truckText(t){
  const L=[];
  for(const it of t.items) L.push(`- ${KIND_LABEL[it.kind]||it.kind}: ${it.color}, ${it.kind==="Wreath"?(it.qty||it.runs)+" wreath"+((it.qty||it.runs)>1?"s":""):it.runs+" run"+(it.runs>1?"s":"")}${it.qty&&it.kind!=="Wreath"?` (${it.qty} listed)`:""} · ${[...it.jobs].length} house${[...it.jobs].length>1?"s":""}`);
  if(t.clips.length) L.push("- Clips: "+t.clips.map(([c,n])=>`${c} (${n})`).join(", "));
  if(t.ftJobs) L.push(`- Roofline footage on file: ${t.ft} ft across ${t.ftJobs} house${t.ftJobs>1?"s":""}`);
  if(t.downs) L.push(`- Takedowns: ${t.downs}. Bring bins, labels and the ladder kit`);
  t.flags.forEach(f=>L.push("- "+f));
  if(t.noPlan.length) L.push("- No light plan yet: "+t.noPlan.join(", "));
  return L.join("\n");
}
function truckHTML(t){
  if(!t.n) return `<p class="lede">No stops.</p>`;
  return `<div class="rows">${t.items.map(it=>`<div class="row" style="cursor:default"><span class="lbl">${esc(KIND_LABEL[it.kind]||it.kind)}</span><span class="m"><span class="n">${esc(it.color)}</span><span class="s">${esc([...it.jobs].join(", "))}</span></span><span class="r mono" style="font-size:14px">${it.kind==="Wreath"?(it.qty||it.runs)+" wreath"+((it.qty||it.runs)>1?"s":""):it.runs+" run"+(it.runs>1?"s":"")}</span></div>`).join("")||`<div class="row" style="cursor:default"><span></span><span class="m"><span class="s">No light plans written for these stops yet.</span></span><span></span></div>`}</div>
  ${t.clips.length?`<dl class="kv"><dt>Clips</dt><dd>${esc(t.clips.map(([c,n])=>`${c} (${n})`).join(", "))}</dd>${t.ftJobs?`<dt>Footage</dt><dd class="mono">${t.ft} ft on ${t.ftJobs} house${t.ftJobs>1?"s":""}</dd>`:""}${t.downs?`<dt>Takedowns</dt><dd>${t.downs} · bins, labels, ladder kit</dd>`:""}</dl>`:""}
  ${t.flags.length?`<div class="note">${t.flags.map(esc).join("<br>")}</div>`:""}
  ${t.noPlan.length?`<p class="count" style="font-size:13px">No light plan yet: ${esc(t.noPlan.join(", "))}</p>`:""}`;
}
function dTruck(d){
  const groups = S.team==="all" ? crews().map(c=>[c,stopsFor(d,c.id)]).filter(([,st])=>st.length) : [[crewObj(S.team)||{id:S.team,name:teamName(S.team)},stopsFor(d,S.team)]];

/* ---------- clock in / out ---------- */
const AUTO={on:false,watch:null,lock:null,far:0,last:null,near:""};
const fmtDur=ms=>{ const m=Math.max(0,Math.round(ms/60000)); return `${Math.floor(m/60)}h ${pad(m%60)}m`; };
function clocks(jid,vid){ const out=[]; for(const [id,e] of S.log) if(e.kind==="clock"&&!e.pending&&e.jobId===jid&&(!vid||e.visitId===vid)) out.push({id,...e}); return out; }
function myOpenClock(){ for(const [id,e] of S.log) if(e.kind==="clock"&&!e.general&&e.by===S.me.id&&!e.out) return {id,...e}; return null; }
function clockMs(c){ return (c.out?Date.parse(c.out):Date.now())-Date.parse(c.in); }
function onSite(jid,vid){ const cs=clocks(jid,vid); if(!cs.length) return ""; const ppl=new Set(cs.map(c=>c.by)).size; return ` · on site ${fmtDur(cs.reduce((t,c)=>t+clockMs(c),0))}${ppl>1?` (${ppl} people)`:""}`; }
function clockBtn(j,v){
  if(!S.me.canLog||isDone(j.id,v.id)) return "";
  const mine=clocks(j.id,v.id).find(c=>c.by===S.me.id&&!c.out);
  return mine ? `<button type="button" class="btn ink" data-act="clock-out" data-id="${esc(mine.id)}">Clock out · ${fmtDur(clockMs(mine))}</button>`
              : `<button type="button" class="btn" data-act="clock-in" data-j="${esc(j.id)}" data-v="${esc(v.id)}">Clock in</button>`;
}
async function clockIn(jid,vid,auto){
  const open=myOpenClock();
  if(open){ if(open.jobId===jid&&open.visitId===vid) return; await clockOut(open.id,auto,true,true); }
  { const g=myOpenGeneral(); if(g) await S.db.doc("log/"+g.id).update({out:new Date().toISOString(),autoOut:!!auto}).catch(()=>{}); }
  const now=new Date().toISOString();
  try{ await S.db.collection("log").add({kind:"clock",jobId:jid,visitId:vid,by:S.me.id,in:now,out:null,auto:!!auto,at:now,...(navigator.onLine?{}:{offline:true})}); toast(auto?`Clocked in at ${clientOf(S.jobs.get(jid)||{}).name||"this stop"}`:"Clocked in"); }
  catch(e){ fail(e,"clock in"); }
}
async function clockOut(id,auto,quiet,noResume){
  try{ await S.db.doc("log/"+id).update({out:new Date().toISOString(),autoOut:!!auto}); if(!quiet) toast(auto?"Clocked out. Driving time is on.":"Clocked out"); if(!noResume) setTimeout(()=>resumeGeneral(auto),300); }
  catch(e){ fail(e,"clock out"); }
}
function clockEntry(e){
  const t=x=>new Date(x).toLocaleTimeString(LOC(),{hour:"numeric",minute:"2-digit"});
  return `<div class="entry"><div class="meta"><span><b>${esc(who(e.by))}</b> ${e.out?"was on site":"clocked in"}${e.auto?" (auto)":""}</span><span>${esc(fmtDay(isoOf(e.in)))}</span></div>
    <div class="txt mono" style="font-size:13px">${t(e.in)} – ${e.out?t(e.out):"now"} · ${fmtDur(clockMs(e))}</div></div>`;
}
const isoOf=x=>toISO(new Date(x));
function autoStatus(){
  if(!AUTO.last) return "Waiting for your location…";
  if(dayEnded()) return "Your day is done.";
  if(!dayStarted()) return "You'll clock in when you get to the shop, or at your first stop.";
  const open=myOpenClock(); if(open) return `On site at ${clientOf(S.jobs.get(open.jobId)||{}).name||"a stop"}. You'll clock out when you drive off.`;
  const g=myOpenGeneral(), lead=g?(g.where==="shop"?"At the shop, clocked in. ":"Driving time is on. "):"";
  return lead+(AUTO.near ? `Next: ${AUTO.near}. You'll switch to that job when you get there.` : "No stops left. You'll clock out for the day when you leave the shop.");
}
function autoStops(){
  const me=PL.me()||{}; const team=S.team!=="all"?S.team:(me.crew||"all");
  return stopsFor(todayISO(),team).filter(s=>hasLL(s.j)&&!isDone(s.j.id,s.v.id));
}
let autoBusy=false;
async function onPos(p){
  AUTO.last={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy,at:Date.now()};
  if(autoBusy) return; autoBusy=true;
  try{
    const me=AUTO.last, open=myOpenClock(), list=autoStops();
    let best=null,bd=Infinity; for(const s of list){ const d=miles(me,s.j)*1609; if(d<bd){bd=d;best=s;} }
    AUTO.near = best ? `${clientOf(best.j).name||"Customer"}, ${bd<1609?Math.round(bd*3.28)+" ft":(bd/1609).toFixed(1)+" mi"}` : "";
    if(p.coords.accuracy<=150){
      if(open){ const j=S.jobs.get(open.jobId); if(j&&hasLL(j)){ if(miles(me,j)*1609>300){ if(++AUTO.far>=2){ AUTO.far=0; await clockOut(open.id,true); } } else AUTO.far=0; } }
      else if(best && bd<=120) await clockIn(best.j.id,best.v.id,true);
      const sh=shop(), dShop=hasLL(sh)?miles(me,sh)*1609:Infinity;
      if(dShop<=150){
        if(!dayStarted()) await startGeneral("shop",true);
        else if(!dayEnded() && myToday().some(c=>!c.general)) AUTO.backAtShop=true;
        AUTO.shopFar=0;
      } else if(!AUTO.backAtShop && dShop>300 && (myOpenGeneral()||{}).where==="shop"){
        if(++AUTO.shopFar>=2){ AUTO.shopFar=0; const g=myOpenGeneral(); await S.db.doc("log/"+g.id).update({out:new Date().toISOString(),autoOut:true}); await startGeneral("travel",true); }
      } else if(AUTO.backAtShop && !myOpenClock() && dShop>400 && !list.length){
        if(++AUTO.shopFar>=2){ AUTO.backAtShop=false; AUTO.shopFar=0; await stopGeneral(true,true); }
      }
    }
  } finally { autoBusy=false; if(S.view==="route"&&!S.drawer) renderMain(); }
}
async function setAuto(on){
  if(on){
    if(!navigator.geolocation){ toast("This phone can't share its location with the board."); return; }
    AUTO.watch=navigator.geolocation.watchPosition(onPos,err=>{ toast(err.code===1?"Location is blocked. Allow it for this site in your phone's settings.":"Can't get your location right now."); if(err.code===1) setAuto(false); },{enableHighAccuracy:true,maximumAge:15000,timeout:30000});
    try{ AUTO.lock=await navigator.wakeLock.request("screen"); }catch(e){}
    AUTO.on=true; ls("autoClock","1"); toast("Auto clock-in is on. Keep the board open on screen.");
  } else {
    if(AUTO.watch!=null) navigator.geolocation.clearWatch(AUTO.watch);
    try{ AUTO.lock&&AUTO.lock.release(); }catch(e){}
    Object.assign(AUTO,{on:false,watch:null,lock:null,far:0,last:null,near:""}); ls("autoClock","0");
  }
  renderMain();
}
document.addEventListener("visibilitychange",async()=>{ if(AUTO.on&&!document.hidden){ try{ AUTO.lock=await navigator.wakeLock.request("screen"); }catch(e){} } });
setInterval(()=>{ if(myOpenClock()&&S.view==="route"&&!S.drawer) renderMain(); },60000);

/* ---------- hours report ---------- */
function vHours(){
  return reqBlock()+vHours2();
}
function vHours2(){
  const days=[...Array(7)].map((_,i)=>addDays(S.week,i));
  const rows=[...S.log.entries()].map(([id,e])=>({id,...e})).filter(e=>e.kind==="clock"&&!e.pending&&e.in&&days.includes(isoOf(e.in))).sort((a,b)=>a.in.localeCompare(b.in));
  const per=new Map(); for(const r of rows){ const p=per.get(r.by)||{ms:0,job:0,gen:0,stops:new Set()}; const m=clockMs(r); p.ms+=m; if(r.general) p.gen+=m; else { p.job+=m; p.stops.add(r.jobId+"|"+r.visitId); } per.set(r.by,p); }
  const t=x=>new Date(x).toLocaleTimeString(LOC(),{hour:"numeric",minute:"2-digit"});
  return `<div class="bar"><button type="button" class="btn icon" data-act="week" data-v="-7" aria-label="Previous week">‹</button><b class="sign grow" style="font-size:22px">Week of ${fmtDay(S.week)}</b><button type="button" class="btn icon" data-act="week" data-v="7" aria-label="Next week">›</button></div>
  ${per.size?`<div class="tiles">${[...per.entries()].map(([id,p])=>`<div class="tile"><span class="l">${esc(who(id))}</span><span class="v">${fmtDur(p.ms)}</span><span class="count" style="font-size:13px">On jobs ${fmtDur(p.job)} · ${p.stops.size} stop${p.stops.size===1?"":"s"}<br>Shop & driving ${fmtDur(p.gen)}</span></div>`).join("")}</div>
  <div class="tbl"><table><thead><tr><th>Day</th><th>Person</th><th>Stop</th><th>In</th><th>Out</th><th class="r">Time</th></tr></thead><tbody>${rows.map(r=>`<tr ${S.me.owner?`data-act="clock-edit" data-id="${esc(r.id)}" style="cursor:pointer"`:""}><td>${fmtDay(isoOf(r.in),{weekday:"short",month:"short",day:"numeric"})}${r.edited?" ✎":""}</td><td>${esc(who(r.by))}${isSS(r.by)?' <small class="count">(ShipShape · job tracking)</small>':""}</td><td>${r.general?`<i>${r.where==="shop"?"Shop":"Driving"}${r.endDay?" · end of day":""}</i>`:esc(clientOf(S.jobs.get(r.jobId)||{}).name||"Job")}</td><td class="mono">${t(r.in)}${r.auto?" ·a":""}</td><td class="mono">${r.out?t(r.out)+(r.autoOut?" ·a":""):"open"}</td><td class="r">${fmtDur(clockMs(r))}</td></tr>`).join("")}</tbody></table></div>
  <p class="count" style="font-size:13px">·a = automatic, from the phone's location.</p>`
  :`<div class="empty"><h3>No hours this week</h3><p>Hours show up here when crews start their day at the shop and clock in at stops, by hand or with auto clock-in.</p></div>`}`;
}
async function shopFromForm(){
  const el=$("#s-shop"), lv=$("#s-leave"); const cur=shop();
  const out={...(S.settings.shop||{}),address:cur.address,lat:cur.lat,lng:cur.lng,leave:(lv&&lv.value)||cur.leave};
  const a=el?el.value.trim():""; if(!a||a===cur.address) return out;
  const r=await PL.geocode(a).catch(()=>null);
  if(!r){ toast("Couldn't find the shop address. Kept the old one."); return out; }
  return {...out,address:a,lat:+(+r.lat).toFixed(5),lng:+(+r.lng).toFixed(5)};
}

/* ---------- maps app preference (Apple or Google) ---------- */
const MAPS_APP = () => ls("mapsApp") || (/iPhone|iPad|Macintosh/.test(navigator.userAgent) ? "apple" : "google");
const appleDir = (dest, waypoints=[], source) => "https://maps.apple.com/directions?" + [source?"source="+encodeURIComponent(source):"", "destination="+encodeURIComponent(dest), ...waypoints.map(w=>"waypoint="+encodeURIComponent(w)), "mode=driving"].filter(Boolean).join("&");
const googleDir = (dest, waypoints=[], source) => "https://www.google.com/maps/dir/?api=1" + (source?"&origin="+encodeURIComponent(source):"") + "&destination="+encodeURIComponent(dest) + (waypoints.length?"&waypoints="+encodeURIComponent(waypoints.join("|")):"") + "&travelmode=driving";
const dirUrl = (dest, waypoints, source) => MAPS_APP()==="apple" ? appleDir(dest, waypoints, source) : googleDir(dest, waypoints, source);
function routeUrls(stops){
  const a=stops.map(s=>addrOf(s.j)).filter(Boolean); if(!a.length) return null; const sh=shop().address;
  return { apple: appleDir(sh, a.slice(0,14), sh), google: googleDir(sh, a.slice(0,9), sh), capped: a.length>9 };
}

/* ---------- payments + money totals ---------- */
S.pays = S.pays || new Map();
const money2 = n => "$" + (Math.round((n||0)*100)/100).toLocaleString(LOC(),{minimumFractionDigits:2,maximumFractionDigits:2});
const firstDate = j => (j.visits||[]).map(v=>v.date).filter(Boolean).sort()[0] || "";
const installedOn = j => { const d=[...S.log.values()].filter(e=>e.kind==="done"&&e.jobId===j.id).map(e=>e.at).sort()[0]; return d?isoOf(d):""; };
function ledger(party){ return [...S.pays.entries()].map(([id,p])=>({id,...p})).filter(p=>p.party===party).sort((a,b)=>String(b.date).localeCompare(String(a.date))); }
function paidSet(party){ const s=new Set(); for(const p of ledger(party)) (p.jobs||[]).forEach(x=>s.add(x)); return s; }
function moneyRows(){
  return jobsArr().filter(j=>j.stage!=="cancelled").map(j=>{ const f=S.fin.get(j.id)||{}, s=split(j,f), st=status(j);
    return {j,f,s,st,done:st==="lit"||st==="down",client:clientOf(j).name||"Customer",date:firstDate(j)}; });
}
function moneyTotals(){
  const R=moneyRows(), sum=(a,fn)=>a.reduce((t,x)=>t+(fn(x)||0),0);
  const tcl=R.filter(r=>r.j.source==="tcl"&&(r.s.price||r.s.extras)), own=R.filter(r=>r.j.source!=="tcl"&&r.s.price), ss=R.filter(r=>r.s.ss>0);
  const tPaid=paidSet("tcl"), sPaid=paidSet("shipshape");
  const T={ R,
    tcl:{rows:tcl, booked:sum(tcl,r=>r.s.incoming), earned:sum(tcl.filter(r=>r.done),r=>r.s.incoming), paid:sum(ledger("tcl"),p=>+p.amount), paidSet:tPaid},
    ss:{rows:ss, booked:sum(ss,r=>r.s.ss), earned:sum(ss.filter(r=>r.done),r=>r.s.ss), paid:sum(ledger("shipshape"),p=>+p.amount), paidSet:sPaid},
    own:{rows:own, booked:sum(own,r=>r.s.price), earned:sum(own.filter(r=>r.done),r=>r.s.price), paid:sum(own.filter(r=>r.f.collected),r=>r.s.price)},
    noPrice:R.filter(r=>!r.s.price).length };
  T.tcl.due=T.tcl.earned-T.tcl.paid; T.ss.due=T.ss.earned-T.ss.paid; T.own.due=T.own.earned-T.own.paid;
  T.net={booked:T.tcl.booked-T.ss.booked+T.own.booked, earned:T.tcl.earned-T.ss.earned+T.own.earned};
  T.legacyT=tcl.filter(r=>r.f.collected&&!tPaid.has(r.j.id)).length; T.legacyS=ss.filter(r=>r.f.ssPaid&&!sPaid.has(r.j.id)).length;
  return T;
}
const isPaid = (party, r, T) => party==="tcl" ? (T.tcl.paidSet.has(r.j.id)||!!r.f.collected) : (T.ss.paidSet.has(r.j.id)||!!r.f.ssPaid);
const pctBar = (a,b) => `<div class="pbar"><span style="width:${b>0?Math.min(100,Math.max(0,a/b*100)):0}%"></span></div>`;

function vMoney(){
  const T=moneyTotals(), tab=S.mtab||"overview";
  const tabs=[["overview","Overview"],["tcl","TCL"],["ss","ShipShape"],["own","ProLight jobs"],["pays","Payments"]];
  let h=`<div class="chips" role="group" aria-label="Money">${tabs.map(([k,l])=>`<button type="button" class="chip" data-act="mtab" data-v="${k}" aria-pressed="${tab===k}">${l}</button>`).join("")}</div>`;
  if(tab==="overview") h+=mOverview(T); else if(tab==="tcl") h+=mStatement("tcl",T); else if(tab==="ss") h+=mStatement("shipshape",T); else if(tab==="own") h+=mOwn(T); else h+=mPayments(T);
  return h;
}

    ${card("TCL owes ProLight",`<img src="/brand/tcl.png" alt="" class="mlogo">`,T.tcl.due,"balance due on installed jobs",[["Earned (installed)",money2(T.tcl.earned)],["Paid to us",money2(T.tcl.paid)],["Still to install",money2(T.tcl.booked-T.tcl.earned)],["Whole season",money2(T.tcl.booked)]],"tcl",T.tcl.paid,T.tcl.earned)}
    ${card("ProLight owes ShipShape",`<img src="/brand/shipshape.png" alt="" class="mlogo ss">`,T.ss.due,"balance on installed jobs",[["Earned (installed)",money2(T.ss.earned)],["Paid to them",money2(T.ss.paid)],["Still to install",money2(T.ss.booked-T.ss.earned)],["Whole season",money2(T.ss.booked)]],"shipshape",T.ss.paid,T.ss.earned)}
    ${card("ProLight's own jobs","",T.own.due,"to collect on installed jobs",[["Installed",money2(T.own.earned)],["Collected",money2(T.own.paid)],["Still to install",money2(T.own.booked-T.own.earned)],["Whole season",money2(T.own.booked)]],"",T.own.paid,T.own.earned)}
  </div>
  <p class="lede" style="font-size:14px">TCL pays ProLight ${R.tcl*100}% of each TCL job. ShipShape gets ${R.ss*100}% of the TCL price on jobs they do, unless a job has its own split. Balances count installed jobs only, minus recorded payments.</p>
  ${T.noPrice?`<div class="note">${T.noPrice} job${T.noPrice>1?"s have":" has"} no price and ${T.noPrice>1?"aren't":"isn't"} counted.</div>`:""}${extraNeedNote()}
  ${T.legacyT||T.legacyS?`<div class="note">${[T.legacyT&&`${T.legacyT} TCL job${T.legacyT>1?"s are":" is"} marked paid`,T.legacyS&&`${T.legacyS} ShipShape job${T.legacyS>1?"s are":" is"} marked paid`].filter(Boolean).join(" and ")} without a payment record, so ${T.legacyT+T.legacyS>1?"they don't":"it doesn't"} count toward "Paid". Record the payment to fix the balance.</div>`:""}`;
}
function mStatement(party,T){

  if(f==="open") rows=rows.filter(r=>r.done&&!isPaid(party,r,T)); else if(f==="installed") rows=rows.filter(r=>r.done); else if(f==="upcoming") rows=rows.filter(r=>!r.done);
  const amt=r=>party==="tcl"?r.s.incoming:r.s.ss, tot=rows.reduce((t,r)=>t+amt(r),0);
  const chips=[["open","Installed, unpaid"],["installed","Installed"],["upcoming","Not installed yet"],["all","All"]];

    <div class="bar"><button type="button" class="btn amber small" data-act="pay-new" data-v="${party}">Record payment</button><button type="button" class="btn small" data-act="stmt-copy" data-v="${party}">Copy statement</button><button type="button" class="btn small" data-act="stmt-csv" data-v="${party}">Download CSV</button>${party==="shipshape"?`<button type="button" class="btn small" data-act="office" data-v="statement">See ShipShape's view</button>`:""}</div></div>
  <div class="chips">${chips.map(([k,l])=>`<button type="button" class="chip" data-act="mfilter" data-v="${k}" aria-pressed="${f===k}">${l}</button>`).join("")}</div>
  <div class="tbl"><table><thead><tr><th>Client</th><th>Install</th>${party==="tcl"?`<th class="r">Job price</th><th class="r">ProLight ${rates().tcl*100}%</th>`:`<th>Crew</th><th class="r">Split</th><th class="r">Payout</th>`}<th>Status</th></tr></thead>
  <tbody>${rows.map(r=>{ const paid=isPaid(party,r,T); return `<tr><td><button type="button" class="tog" style="border:0;padding:0;background:none;color:var(--ink)" data-act="job" data-id="${esc(r.j.id)}"><b>${esc(r.client)}</b></button></td><td class="mono">${r.done?esc(fmtDay(installedOn(r.j)||r.date)):r.date?"Sched. "+esc(fmtDay(r.date)):"—"}</td>
    ${party==="tcl"?`<td class="r">${money2(r.s.price)}</td><td class="r"><b>${money2(r.s.incoming)}</b>${r.s.extras?`<small class="count" style="display:block">incl. ${money2(r.s.extras)} extras</small>`:""}</td>`:`<td>${esc(teamName(r.j.crew))}</td><td class="r">${pctTxt(r.s.ssPct)}${r.s.custom?"*":""}</td><td class="r"><b>${money2(r.s.ss)}</b></td>`}
    <td>${!r.done?`<span class="st scheduled">Not installed</span>`:paid?`<span class="st down">Paid</span>`:`<span class="st lit">Owed</span>`}</td></tr>`; }).join("")||`<tr><td colspan="6" class="count">Nothing here.</td></tr>`}</tbody>
  <tfoot><tr><td colspan="${party==="tcl"?3:4}"><b>${rows.length} job${rows.length===1?"":"s"}</b></td><td class="r"><b>${money2(tot)}</b></td><td></td></tr></tfoot></table></div>
  ${party==="shipshape"?`<p class="count" style="font-size:13px">* custom split set on that job.</p>`:""}
  <h2 class="h-sec">Payments</h2>${payList(ledger(party))}`;
}

function payList(list){

async function findFood2(c){
  const key=c.lat.toFixed(2)+","+c.lng.toFixed(2);
  const q=`[out:json][timeout:20];nwr["amenity"~"^(fast_food|cafe|restaurant)$"](around:4000,${c.lat},${c.lng});out center tags 200;`;
  let d=null;
  try{ const ctl=new AbortController(), t=setTimeout(()=>ctl.abort(),15000); const r=await fetch(`/api/places?lat=${c.lat.toFixed(2)}&lng=${c.lng.toFixed(2)}`,{signal:ctl.signal}); clearTimeout(t); if(r.ok) d=await r.json(); }catch(e){}
  if(!d||!Array.isArray(d.elements)) throw new Error("lookup failed");
  const list=d.elements.map(e=>{ const t=e.tags||{}; return {name:t.name||t.brand, brand:t.brand||"", amenity:t.amenity, cuisine:(t.cuisine||"").split(";")[0].replace(/_/g," "), drive:t.drive_through==="yes", hours:t.opening_hours||"", lat:e.lat??(e.center&&e.center.lat), lng:e.lon??(e.center&&e.center.lon), street:[t["addr:housenumber"],t["addr:street"]].filter(Boolean).join(" ")}; }).filter(p=>p.name&&p.lat);

const lum = h => { const n=parseInt(h.slice(1),16), f=v=>{ v/=255; return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4); }; return .2126*f(n>>16&255)+.7152*f(n>>8&255)+.0722*f(n&255); };

/* day / night */
function sunriseFor(dateISO){ const ss=sunsetFor(dateISO); if(!ss) return null; const d=parseISO(dateISO); const noon=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate(),17,37)); return new Date(noon.getTime()-(ss-noon)); }
function nightNow(){ const t=todayISO(), now=new Date(), ss=sunsetFor(t), sr=sunriseFor(t); return ss&&sr ? (now>=ss||now<sr) : (now.getHours()>=18||now.getHours()<7); }
function effectiveDark(){ const m=look().mode; return m==="dark" || (m==="auto"&&nightNow()) || (m==="system"&&matchMedia("(prefers-color-scheme: dark)").matches); }

/* snow */
function snowIn(el, density=60){
  if(!el || el.querySelector("canvas.snow") || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv=document.createElement("canvas"); cv.className="snow"; el.prepend(cv);
  const ctx=cv.getContext("2d"); let W=0,H=0, flakes=[];
  const size=()=>{ const r=el.getBoundingClientRect(), d=Math.min(2,devicePixelRatio||1); W=r.width; H=r.height; cv.width=W*d; cv.height=H*d; ctx.setTransform(d,0,0,d,0,0);
    flakes=[...Array(Math.round(density*W*H/400000)+8)].map(()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*2.2+.6,s:Math.random()*.6+.25,w:Math.random()*Math.PI*2})); };
  size(); addEventListener("resize",size);
  (function tick(){ if(!cv.isConnected) return; ctx.clearRect(0,0,W,H); ctx.fillStyle="rgba(255,255,255,.85)";
    for(const f of flakes){ f.y+=f.s; f.w+=.01; f.x+=Math.sin(f.w)*.3; if(f.y>H+4){ f.y=-4; f.x=Math.random()*W; } ctx.beginPath(); ctx.arc(f.x,f.y,f.r,0,7); ctx.fill(); }
    requestAnimationFrame(tick); })();
}
const md = () => { const d=new Date(); return (d.getMonth()+1)*100+d.getDate(); };
const snowSeason = () => look().snow && (md()>=1101 || md()<=110);
const christmasWeek = () => md()>=1219 && md()<=1226;

/* the startup "plug-in" */
function strandSVG(n, w, h, cls){
  const C=bulbColors(), pts=[...Array(n)].map((_,i)=>{ const x=(i+.5)*w/n, y=h*.38+Math.sin(i/(n-1)*Math.PI)*h*.22; return [x,y]; });
  const path="M0,"+(h*.3)+" "+pts.map(([x,y])=>`L${x.toFixed(1)},${y.toFixed(1)}`).join(" ")+` L${w},${h*.3}`;
  return `<svg class="${cls}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><path d="${path}" fill="none" stroke="#2a6e4e" stroke-width="3" stroke-linejoin="round"/></svg>`+
    pts.map(([x,y],i)=>`<span class="ib" style="left:${(x/w*100).toFixed(2)}%;top:${(y/h*100).toFixed(2)}%;--bc:${C[i%C.length]};--d:${i}"></span>`).join("");
}

  if(!all.length) return "";
  const st=all.map(status), lit=st.filter(s=>s==="lit"||s==="partial").length, down=st.filter(s=>s==="down").length, total=all.length;
  const t=parseISO(todayISO()), y=t.getMonth()===0||t.getMonth()===1 ? t.getFullYear()-1 : t.getFullYear();
  const xmas=new Date(y,11,25), days=Math.round((xmas-t)/864e5);
  const after = days<0;

  if(!after){ txt = days===0 ? `Merry Christmas · ${lit+down} houses lit` : `${days} day${days>1?"s":""} to Christmas · ${lit+down} of ${total} houses lit`; on=Math.round((lit+down)/total*n); }
  else { const up=lit+down; txt = `Takedown · ${down} of ${up} down`; on=up?Math.round((up-down)/up*n):0; }
  return `<div class="season ${after?"after":""} ${christmasWeek()?"xmas":""}"><span class="season-t">${esc(txt)}</span><span class="season-strand">${[...Array(n)].map((_,i)=>`<span class="bulb ${i<on?"on":""}"></span>`).join("")}</span></div>`;

  const out=[];

/* where it fits best: the crew route over the next 5 days that it adds the fewest miles to */
function bestFit(j, skipVid){
  if(!hasLL(j)) return null;
  let best=null;
  for(let d=0; d<5; d++){ const day=addDays(todayISO(),d);
    for(const c of crews()){
      const st=stopsFor(day,c.id).filter(s=>!(s.j.id===j.id&&s.v.id===skipVid));
      if(!st.length) continue;
      const pts=[shop(),...st.map(s=>hasLL(s.j)?s.j:null),shop()];
      for(let i=0;i<pts.length-1;i++){ const a=pts[i], b=pts[i+1]; if(!a||!b) continue;
        const add=legMiles(a,j)+legMiles(j,b)-legMiles(a,b), score=add+d*1.5;
        if(!best||score<best.score) best={day,crew:c.id,idx:i,add,score}; }
    }
  }
  return best;
}
async function placeSvc(jid, vid, day, crew, idx){
  const j=S.jobs.get(jid), visits=(j.visits||[]).map(x=>({...x})), v=visits.find(x=>x.id===vid);
  v.date=day; v.crew=crew; v.crews=[]; v.order=null; if(v.orders) delete v.orders;
  await S.db.doc("jobs/"+jid).update({visits,updatedAt:new Date().toISOString()});
  if(idx==null) return;
  const list=stopsFor(day,crew), me=list.findIndex(s=>s.j.id===jid&&s.v.id===vid);
  if(me<0) return; const [it]=list.splice(me,1); list.splice(Math.min(idx,list.length),0,it);
  const changes=new Map();
  list.forEach((s,i)=>{ const base=changes.get(s.j.id)||(S.jobs.get(s.j.id).visits||[]).map(x=>({...x})); const t=base.find(x=>x.id===s.v.id); if(ordOf(t,crew)!==i+1){ setOrd(s.j,t,crew,i+1); changes.set(s.j.id,base); } });
  for(const [id,vs] of changes) await S.db.doc("jobs/"+id).update({visits:vs});
}

  if(!O.length&&!I.length) return h+`<p class="count" style="font-size:14px">No open service calls. When a customer calls with lights out, log it here and the board finds the crew that's closest that week.</p>`;
  h+=`<div class="rows">`;

    h+=`<div class="row svc" style="cursor:default"><span class="bulb red"></span><span class="m"><span class="n">${esc(clientOf(j).name||"Customer")}${e.urgent?` <span class="vt urgent">Urgent</span>`:""}</span>

      <span class="r"><button type="button" class="btn small amber" data-act="svc-from-issue" data-v="${esc(e.id)}">Schedule it</button><button type="button" class="btn small" data-act="svc-dismiss" data-v="${esc(e.id)}">Dismiss</button></span></div>`; }

/* ---------- day clock: shop + driving time between jobs ----------
   General clock runs from arriving at the shop, pauses while you're clocked in at a job,
   and picks back up when you leave the job. It ends when you leave the shop after the day's stops. */
function myOpenGeneral(){ for(const [id,e] of S.log) if(e.kind==="clock"&&e.general&&e.by===S.me.id&&!e.out) return {id,...e}; return null; }
function myToday(){ const t=todayISO(), out=[]; for(const [id,e] of S.log) if(e.kind==="clock"&&!e.pending&&e.by===S.me.id&&e.in&&isoOf(e.in)===t) out.push({id,...e}); return out; }
const dayStarted = () => myToday().length>0;
const dayEnded = () => myToday().some(e=>e.endDay);
async function startGeneral(where,auto){
  if(isSS(S.me.id)||myOpenGeneral()||myOpenClock()||dayEnded()) return;
  const now=new Date().toISOString();
  try{ await S.db.collection("log").add({kind:"clock",general:true,where,jobId:"",visitId:"",by:S.me.id,in:now,out:null,auto:!!auto,at:now,...(navigator.onLine?{}:{offline:true})}); if(where==="shop") toast(auto?"Clocked in at the shop. Have a good day!":"Day started"); }
  catch(e){ fail(e,"start your day"); }
}
async function stopGeneral(endDay,auto){
  const g=myOpenGeneral(); if(!g){ if(endDay&&dayStarted()&&!dayEnded()){ const last=myToday().sort((a,b)=>String(b.in).localeCompare(String(a.in)))[0]; if(last) await S.db.doc("log/"+last.id).update({endDay:true}); toast("Day ended"); } return; }
  try{ await S.db.doc("log/"+g.id).update({out:new Date().toISOString(),autoOut:!!auto,...(endDay?{endDay:true}:{})}); if(endDay) toast(auto?"Clocked out for the day. Get home safe!":"Day ended"); }
  catch(e){ fail(e,"clock out"); }
}

/* ---------- payroll ---------- */
const OT_AFTER = 40;
const payRate = id => +(((S.payroll.rates||{})[id]||{}).rate)||0;
const otOff = id => ((S.payroll.rates||{})[id]||{}).ot===false;
function payWeek(){
  const days=[...Array(7)].map((_,i)=>addDays(S.week,i)), set=new Set(days);
  const rows=[...S.log.entries()].map(([id,e])=>({id,...e})).filter(e=>e.kind==="clock"&&!e.pending&&e.in&&set.has(isoOf(e.in))&&!isSS(e.by)).sort((a,b)=>a.in.localeCompare(b.in));
  const ppl=new Map(), touch=id=>{ if(!ppl.has(id)) ppl.set(id,{id,ms:0,job:0,gen:0,open:0,days:new Set(),comm:0,sales:[]}); return ppl.get(id); };
  for(const r of rows){ const p=touch(r.by), m=clockMs(r); p.ms+=m; r.general?p.gen+=m:p.job+=m; if(!r.out) p.open++; p.days.add(isoOf(r.in)); }
  for(const s of allSales()) if(s.earnedOn&&set.has(s.earnedOn)&&!s.paidAt){ const p=touch(s.by); p.comm+=s.comm; p.sales.push(s); }
  for(const id of Object.keys(S.payroll.rates||{})) if(payRate(id)>0 && !isSS(id) && (PL.staff().find(x=>x.id===id)||{}).active) touch(id);
  const out=[...ppl.values()].map(p=>{ const hrs=Math.round(p.ms/36e4)/10, noOt=otOff(p.id), reg=noOt?hrs:Math.min(hrs,OT_AFTER), ot=noOt?0:Math.max(0,Math.round((hrs-OT_AFTER)*10)/10), rate=payRate(p.id);
    return {...p, hrs, reg, ot, rate, regPay:reg*rate, otPay:ot*rate*1.5, total:reg*rate+ot*rate*1.5+p.comm, name:staffName(p.id), title:(PL.staff().find(x=>x.id===p.id)||{}).title||""}; })
    .sort((a,b)=>a.name.localeCompare(b.name));
  return {days, rows, people:out};
}
const h1 = n => (Math.round(n*10)/10).toFixed(1);

async function saveTimeReq(form){

  const day=e?isoOf(e.in):$("#tq-day").value, i=$("#tq-in").value, o=$("#tq-out").value, why=$("#tq-why").value.trim();
  const at=(t)=>new Date(day+"T"+t+":00").toISOString();

  let pin=at(i), pout=at(o); if(new Date(pout)<=new Date(pin)) pout=new Date(new Date(pout).getTime()+864e5).toISOString();
  const own=!!S.me.owner&&!e;

  const now=new Date().toISOString();
  try{
    if(e){
      await S.db.collection("log").add({kind:"timereq",status:"pending",target:cid,propIn:pin,propOut:pout,reason:why,by:S.me.id,at:now,

      if(type==="job"&&!jv){ $("#tq-err").textContent="Pick the job."; return; }
      const [jid,vid]=jv?jv.split("|"):["",""];

const jbhKey = e => "jbt-"+String(e.id).replace(/[^A-Za-z0-9]/g,"").slice(-24);
function jbhMatch(e, day){
  let j=null;
  if(e.job){ j=S.jobs.get("jb-"+e.job.number)?{id:"jb-"+e.job.number,...S.jobs.get("jb-"+e.job.number)}:null;
    if(!j){ const nm=String(e.job.title||e.visit||"").split(/[-–]/).pop().trim().toLowerCase();
      if(nm.length>2) j=jobsArr().find(x=>{ const c=String(clientOf(x).name||"").toLowerCase(); return c && (c===nm || c.includes(nm) || nm.includes(c)); })||null; } }
  if(!j) return null;
  const vs=(j.visits||[]).filter(v=>v.date).sort((a,b)=>Math.abs(parseISO(a.date)-parseISO(day))-Math.abs(parseISO(b.date)-parseISO(day)));
  return {j, v:vs[0]||null};
}
function jbhMine(H){
  const P=PL.staff().find(p=>p.id===H.who)||{name:""}, nm=String(P.name||"").trim().toLowerCase(), first=nm.split(/\s+/)[0]||"#";

}

  const b=`<div class="form"><div class="two"><div class="f"><label for="jbh-from">From</label><input id="jbh-from" type="date" value="${esc(H.from)}"></div><div class="f"><label for="jbh-to">To</label><input id="jbh-to" type="date" value="${esc(H.to)}"></div></div>

      :`<p class="count" style="margin-top:10px">Jobber has no timesheet entries for ${esc(P.name)} in those days${(H.entries||[]).length?` (it has ${(H.entries||[]).length} for other people)`:""}. You can still type the hours in with <b>+ Add time</b>.</p>`):""}`;

async function jbhPull(){
  const H=S.jbh; H.from=$("#jbh-from").value; H.to=$("#jbh-to").value; H.who=$("#jbh-who").value;
  if(!H.from||!H.to||H.to<H.from){ H.error="Pick the days."; renderDrawer(); return; }
  H.loading=true; H.error=""; renderDrawer();
  try{
    const a=new Date(H.from+"T00:00:00").toISOString(), z=new Date(addDays(H.to,1)+"T00:00:00").toISOString();
    const r=await PL.jobber(`hours&from=${encodeURIComponent(a)}&to=${encodeURIComponent(z)}`);
    H.entries=r.entries||[]; H.error=r.error||"";
    const done=new Set([...S.log.values()].filter(e=>e.kind==="clock"&&e.jobberId).map(e=>e.jobberId));
    H.sel=new Set(jbhMine(H).filter(e=>e.end&&!done.has(e.id)).map(e=>e.id));
  }catch(e){ H.error=e.message; H.entries=null; }
  H.loading=false; renderDrawer();
}

let DRAG=null;
const clearDrop = () => document.querySelectorAll(".drop-on,.drop-before").forEach(x=>x.classList.remove("drop-on","drop-before"));
document.addEventListener("dragstart",ev=>{ const el=ev.target.closest&&ev.target.closest("[data-dj]"); if(!el||S.view!=="week") return; DRAG={j:el.dataset.dj,v:el.dataset.dv||"",t:el.dataset.dt||""}; ev.dataTransfer.effectAllowed="move"; try{ ev.dataTransfer.setData("text/plain",DRAG.j); }catch(e){} el.classList.add("dragging"); document.body.classList.add("is-dragging"); });
document.addEventListener("dragend",()=>{ DRAG=null; document.body.classList.remove("is-dragging"); clearDrop(); document.querySelectorAll(".dragging").forEach(x=>x.classList.remove("dragging")); });
document.addEventListener("dragover",ev=>{ if(!DRAG) return; const day=ev.target.closest&&ev.target.closest(".wday[data-day]"); if(!day) return; ev.preventDefault(); ev.dataTransfer.dropEffect="move"; clearDrop(); day.classList.add("drop-on"); const b=ev.target.closest(".wstop[data-dj]"); if(b) b.classList.add("drop-before"); });
document.addEventListener("drop",async ev=>{ if(!DRAG) return; const day=ev.target.closest&&ev.target.closest(".wday[data-day]"); if(!day) return; ev.preventDefault(); const b=ev.target.closest(".wstop[data-dj]"), D=DRAG; DRAG=null; clearDrop(); await dropOn(D, day.dataset.day, b?{j:b.dataset.dj,v:b.dataset.dv}:null); });
async function dropOn(D, day, before){
  const j0=S.jobs.get(D.j); if(!j0) return; const j={id:D.j,...j0};
  const visits=(j0.visits||[]).map(x=>({...x})); let v;
  if(D.v) v=visits.find(x=>x.id===D.v);
  else { const type=D.t==="takedown"?"takedown":"install"; v=visits.find(x=>x.type===type&&!x.date&&!isDone(j.id,x.id)); if(!v){ v={id:uid(),type,date:"",time:"",crew:"",note:"",order:null}; visits.push(v); } }
  if(S.team==="all") before=null;
  if(!v||(before&&before.j===D.j&&before.v===v.id)||(!before&&v.date===day&&D.v)) return;
  v.date=day;
  const crew=S.team!=="all"&&visitCrews(j,v).includes(S.team)?S.team:crewOf(j,v), changes=new Map([[j.id,visits]]);
  if(crewObj(crew)){
    const list=stopsFor(day,crew).filter(s=>!(s.j.id===j.id&&s.v.id===v.id));
    let idx=before?list.findIndex(s=>s.j.id===before.j&&s.v.id===before.v):-1; if(idx<0) idx=list.length;
    [...list.slice(0,idx),{me:true},...list.slice(idx)].forEach((s,i)=>{
      if(s.me){ setOrd(j,v,crew,i+1); return; }
      if(ordOf(s.v,crew)!==i+1){ const base=changes.get(s.j.id)||(S.jobs.get(s.j.id).visits||[]).map(x=>({...x})); const t=base.find(x=>x.id===s.v.id); if(t){ setOrd(s.j,t,crew,i+1); changes.set(s.j.id,base); } } });
  } else v.order=null;
  try{ const now=new Date().toISOString(); for(const [id,vs] of changes) await S.db.doc("jobs/"+id).update({visits:vs,updatedAt:now});
    toast(`${clientOf(j).name||"Job"}: ${VTYPE[v.type].toLowerCase()} ${fmtDay(day,{weekday:"short",month:"short",day:"numeric"})}${crewObj(crew)?"":" · no crew yet"}`); }
  catch(e){ fail(e,"reschedule that"); }
}

/* route on the computer: stops on the left, map on the right */
let RMAP=null, RLAYER=null, RHOLD=null; const RPINS=new Map();
const routeSide = () => `<div class="rmap-box ${effectiveDark()?"night-map":""}"><div id="rmap"></div></div>`;
function mountRouteMap(){
  const box=$("#rmap"); if(!box||!wide()) return;
  if(!window.L){ loadLeaflet().then(()=>{ if(!window.L) throw 0; if(S.view==="route") mountRouteMap(); }).catch(()=>{ box.innerHTML=`<p class="count" style="padding:14px">The map couldn't load. Check your signal.</p>`; }); return; }
  if(!RMAP){ RHOLD=document.createElement("div"); RHOLD.className="lmap"; RMAP=L.map(RHOLD).setView([30.46,-84.27],11);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'}).addTo(RMAP); RLAYER=L.layerGroup().addTo(RMAP); }
  box.appendChild(RHOLD);
  requestAnimationFrame(()=>{ RMAP.invalidateSize(); drawRouteMap(); });
}
function drawRouteMap(){
  if(!RMAP) return; RLAYER.clearLayers(); RPINS.clear();
  const d=S.day, SH=shop(), teams=S.team==="all"?crews().map(c=>c.id):[S.team], pts=[[SH.lat,SH.lng]];
  L.circleMarker([SH.lat,SH.lng],{radius:8,weight:3,color:"#fff",fillColor:"#111916",fillOpacity:1}).bindTooltip("Shop",{direction:"right",offset:[10,0],className:"pin-tip"}).addTo(RLAYER);
  for(const t of teams){ const st=stopsFor(d,t).filter(s=>hasLL(s.j)); if(!st.length) continue; const col=crewColor(t)||"#ffb83d";
    L.polyline([[SH.lat,SH.lng],...st.map(s=>[s.j.lat,s.j.lng])],{color:col,weight:3,opacity:.85,dashArray:"6 6",interactive:false}).addTo(RLAYER);
    st.forEach((s,i)=>{ const dn=isDone(s.j.id,s.v.id);
      const m=L.marker([s.j.lat,s.j.lng],{icon:L.divIcon({className:"rpin-wrap",html:`<span class="rpin ${dn?"done":""}" style="--c:${col}">${i+1}</span>`,iconSize:[26,26],iconAnchor:[13,13]})}).addTo(RLAYER);
      m.bindTooltip(esc(clientOf(s.j).name||"Customer"),{direction:"top",offset:[0,-14],className:"pin-tip"});
      m.on("click",()=>{ const el=document.querySelector(`.stop[data-sj="${CSS.escape(s.j.id)}"]`); if(el){ el.scrollIntoView({behavior:"smooth",block:"center"}); el.classList.add("hl"); setTimeout(()=>el.classList.remove("hl"),1400); } });
      if(!RPINS.has(s.j.id)) RPINS.set(s.j.id,m); pts.push([s.j.lat,s.j.lng]); }); }
  if(pts.length>1) RMAP.fitBounds(L.latLngBounds(pts).pad(0.15),{maxZoom:15}); else RMAP.setView(pts[0],12);
}
let RHOT=null;
document.addEventListener("mouseover",ev=>{ if(S.view!=="route"||!RMAP) return; const st=ev.target.closest&&ev.target.closest(".stop[data-sj]"), id=st?st.dataset.sj:null; if(id===RHOT) return;

const DEVICE = (()=>{ const ua=navigator.userAgent; const d=/iPad/.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1)?"iPad":/iPhone/.test(ua)?"iPhone":/Android/.test(ua)?"Android":/Mac/.test(ua)?"Mac":/Windows/.test(ua)?"Windows":"Other";
  const b=/Edg\//.test(ua)?"Edge":/CriOS|Chrome\//.test(ua)?"Chrome":/FxiOS|Firefox\//.test(ua)?"Firefox":/Safari\//.test(ua)?"Safari":""; return d+(b?" · "+b:"")+(matchMedia("(display-mode: standalone)").matches||navigator.standalone?" · app":""); })();
const EVQ=[], EVSEEN=new Map();
function track(type, info){
  try{ const key=type+"|"+(info&&(info.msg||info.where||info.what)||""), now=Date.now(); if(EVSEEN.has(key)&&now-EVSEEN.get(key)<60000) return; EVSEEN.set(key,now);
    EVQ.push({type, device:DEVICE, view:(window.S&&S.view)||"", ...(info||{})}); if(EVQ.length>60) EVQ.splice(0,EVQ.length-60); }catch(e){}
}
async function flushEvents(){ if(!EVQ.length||!window.PL||!PL.me()||!navigator.onLine) return; const batch=EVQ.splice(0,25); try{ await PL.logEvents(batch); }catch(e){ if(!/function|exist/i.test(e.message||"")) EVQ.unshift(...batch); } }

const LAGT=new Map();
function lagCheck(where, ms){ if(ms<300) return; const now=Date.now(); if(LAGT.has(where)&&now-LAGT.get(where)<120000) return; LAGT.set(where,now); track("lag",{where,ms:Math.round(ms)}); }

async function shrink(file){
  try{ const bmp=await createImageBitmap(file); const m=2000, sc=Math.min(1,m/Math.max(bmp.width,bmp.height));
    const cv=document.createElement("canvas"); cv.width=Math.round(bmp.width*sc); cv.height=Math.round(bmp.height*sc);
    cv.getContext("2d").drawImage(bmp,0,0,cv.width,cv.height);
    const blob=await new Promise((res,rej)=>cv.toBlob(b=>b?res(b):rej(new Error("encode")),"image/jpeg",0.85));
    return {blob,type:"image/jpeg"}; }
  catch(e){ return {blob:file,type:file.type}; }
}
async function upload(file){
  let blob=file, type=file.type||"";
  const n=file.name||"";
  if(type.startsWith("image/") && type!=="image/gif" && type!=="image/svg+xml"){ ({blob,type}=await shrink(file)); }
  else if(type==="video/quicktime" || (!type && /\.mov$/i.test(n)) || (!type && /\.mp4$/i.test(n))) type="video/mp4";
  else if(!type && /\.pdf$/i.test(n)) type="application/pdf";
  if(blob.size>50*1024*1024) throw {code:"too_large"};
  const r=await S.assets.upload(blob,{type});
  return {id:r.id, type:type.startsWith("video")?"video":type==="application/pdf"?"pdf":"image", name:n};
}

      if(!desc){ toast("Say what it was, like C9 bulbs, warm white"); $("#x-desc").focus(); break; }
      const f=S.fin.get(v)||{}; await saveExtras(v,[...extrasOf(f),{id:uid(),qty,desc,price:pr===""?null:Number(pr),at:new Date().toISOString(),by:S.me.id}]); toast(pr===""?"Added. Add the price when you have it.":"Charge added"); break; }
    case "x-price": { const [jid,xid]=v.split("|"), el=document.getElementById("xp-"+xid), pr=(el&&el.value||"").replace(/[^0-9.]/g,""); if(pr===""){ toast("Type the price for one"); break; }
      const f=S.fin.get(jid)||{}; await saveExtras(jid,extrasOf(f).map(x=>x.id===xid?{...x,price:Number(pr)}:x)); toast("Price added"); break; }
    case "x-del": { const [jid,xid]=v.split("|"), f=S.fin.get(jid)||{}; await saveExtras(jid,extrasOf(f).filter(x=>x.id!==xid)); toast("Removed"); break; }
    case "chat-open": { const tx=$("#chat-text"); if(tx&&S.chat.ch) S.chat.draft[S.chat.ch]=tx.value; S.chat.ch=v||null; renderMain(); break; }
    case "chat-del": try{ await PL.chatDelete(id); }catch(e){ toast("Couldn't delete that"); } break;
    case "ann-seen": { const M=chanMsgs("ann"); if(M.length) ls("read:"+S.me.id+":ann",M[M.length-1].at); renderMain(); break; }
    case "maps-app": ls("mapsApp",v); renderDrawer(); renderMain(); toast(v==="apple"?"Directions will open in Apple Maps":"Directions will open in Google Maps"); break;
    case "mtab": S.mtab=v; S.mfilter="open"; renderMain(); break;
    case "mfilter": S.mfilter=v; renderMain(); break;
    case "pay-new": S.form={pay:{party:v,amount:"",date:todayISO(),method:"Check",memo:"",jobs:new Set(),manual:false}}; openDrawer("pay"); break;
    case "pay-del-ask": S.delPay=id; renderMain(); setTimeout(()=>{ if(S.delPay===id){ S.delPay=null; renderMain(); } },5000); break;
    case "pay-del": await delPay(id); break;
    case "stmt-copy": { const txt=stmtText(v); try{ await navigator.clipboard.writeText(txt); toast("Statement copied"); }catch(e){ toast("Couldn't copy. Use Download CSV instead."); } break; }
    case "stmt-csv": stmtCsv(v); break;
    case "stmt-reload": S.stmt=null; renderMain(); break;
    case "assign-truck": openDrawer("assign",v); break;
    case "assign-copy": { const [d,c]=v.split("|"); const pv=assignOf(addDays(d,-1),c)||{}; $("#as-truck").value=pv.truck||""; $("#as-trailer").value=pv.trailer||""; $("#as-note").value=pv.note||""; break; }
    case "hungry": openFood(v); break;
    case "food-kind": S.food.kind=v; renderDrawer(); break;
    case "clock-in": t.disabled=true; await clockIn(t.dataset.j,v,false); break;
    case "clock-out": t.disabled=true; await clockOut(id,false); break;
    case "auto-clock": await setAuto(!AUTO.on); break;
    case "day-start": await startGeneral("shop",false); renderMain(); break;
    case "day-end": { const j=myOpenClock(); if(j) await clockOut(j.id,false,true,true); await stopGeneral(true,false); AUTO.backAtShop=false; renderMain(); break; }
    case "truck": openDrawer("truck",v); break;
    case "best-order": { t.disabled=true; const ids=S.team==="all"?crews().map(c=>c.id):[S.team]; let b=0,a=0,u=0,n=0;
      try{ for(const c of ids){ const r=await applyOrder(v,c); if(r){ b+=r.before; a+=r.after; u+=r.unplaced; n++; } }
        toast(n? (b-a>0.5?`Reordered. About ${Math.round(b-a)} fewer miles.`:"Already in the best order.")+(u?` ${u} stop${u>1?"s":""} without a pin went last.`:"") : "Nothing to reorder"); }
      catch(e){ fail(e,"reorder the route"); } break; }
    case "signout": PL.signOut(); break;
    case "person-new": S.form={person:{name:"",crew:"",active:true,...PRESETS.member}}; openDrawer("person"); break;
    case "person": S.form={person:{...PL.staff().find(p=>p.id===id)}}; openDrawer("person",id); break;
    case "preset": for(const [k,val] of Object.entries(PRESETS[v])){ const el=document.getElementById("pp-"+k); if(el) el.checked=val; } break;
    case "map-find": { const j=S.jobs.get(id); const a=j&&addrOf({...j,id}); if(!a){ toast("This job has no address"); break; } t.disabled=true; const r=await PL.geocode(a).catch(()=>null); if(r){ await S.db.doc("jobs/"+id).update({lat:+(+r.lat).toFixed(5),lng:+(+r.lng).toFixed(5),geo:r.source,geoAddr:a}); toast("Found it"); } else { t.disabled=false; toast("Couldn't find that address. Tap Place to pin it by hand."); } break; }
    case "map-mode": MAP.mode=v; renderMain(); break;
    case "map-day": MAP.day=addDays(MAP.day,Number(v)); renderMain(); break;
    case "map-zoom": if(LMAP) LMAP.setZoom(LMAP.getZoom()+(Number(v)>0?1:-1)); break;
    case "map-fit": mapFit(); break;
    case "map-sel": { MAP.sel=id; const j=S.jobs.get(id); if(j&&hasLL(j)){ MAP.center=[j.lat,j.lng]; } renderMain(); break; }
    case "map-unsel": MAP.sel=null; renderMain(); break;
    case "map-place": MAP.placing=id; MAP.sel=id; renderMain(); window.scrollTo(0,0); break;
    case "map-place-cancel": MAP.placing=null; renderMain(); break;
    case "map-sched": t.disabled=true; await mapSchedule(id); break;
    case "add-crew": { const C=collectCrews(), n=C.filter(c=>c.co===v).length+1; C.push({id:(v==="prolight"?"pl":"ss")+uid().slice(0,5),co:v,name:(v==="prolight"?"ProLight Crew ":"ShipShape Crew ")+n,chat:"",members:[]}); await writeCrews(C,"Crew added"); break; }
    case "rm-crew": await writeCrews(collectCrews().filter(c=>c.id!==v),"Crew removed"); break;
    case "day": S.day = v==="0"?todayISO():addDays(S.day,Number(v)); renderMain(); break;
    case "go-day": S._home=1; S.day=v; S.view="route"; renderMain(); window.scrollTo(0,0); break;
    case "week": S.week = v==="0"?monday(todayISO()):addDays(S.week,Number(v)); renderMain(); break;
    case "jf": S.jf=v; renderMain(); break;
    case "office": setOffice(v); renderMain(); break;
    case "texts": S.view="office"; S.office="texts"; S.briefDay=v; renderMain(); window.scrollTo(0,0); break;
    case "brief-day": S.briefDay=addDays(S.briefDay,Number(v)); renderMain(); break;
    case "job": if(id){ S.compose={text:"",files:[]}; openDrawer("job",id); } break;
    case "client": if(id) openDrawer("client",id); break;
    case "close": closeDrawer(); break;
    case "done": t.disabled=true; await markDone(t.dataset.j,v); break;
    case "undone": t.disabled=true; await delEntry(id); break;
    case "del-entry": await delEntry(id); break;
    case "move": t.disabled=true; await move(t.dataset.j,v,Number(t.dataset.d)); break;
    case "fin-tog": t.disabled=true; await finTog(id,t.dataset.k); break;
    case "assign": try{ await S.db.doc("jobs/"+id).update({crew:v||"",updatedAt:new Date().toISOString()}); toast(v?"Assigned to "+teamName(v):"Crew cleared"); }catch(e){ fail(e,"assign this job"); } break;
    case "new-job": startJobForm(null,t.dataset.client); break;
    case "edit-job": startJobForm(id); break;
    case "new-client": S.form={id:null,client:{}}; openDrawer("clientEdit"); break;
    case "edit-client": S.form={id,client:{...S.clients.get(id)}}; openDrawer("clientEdit",id); break;
    case "seg": readJobForm(); S.form.job[t.dataset.k]=v; renderDrawer(); break;
    case "add-visit": readJobForm(); S.form.job.visits.push({id:uid(),type:v,date:"",time:"",crew:"",note:""}); renderDrawer(); break;
    case "del-visit": readJobForm(); S.form.job.visits.splice(Number(v),1); renderDrawer(); break;
    case "del-job": readJobForm(); S.form.confirmDel=true; renderDrawer(); break;
    case "del-job-no": readJobForm(); S.form.confirmDel=false; renderDrawer(); break;
    case "del-job-yes": await deleteJob(); break;
    case "post": await post(id); break;
    case "rm-pend": S.compose.files.splice(Number(v),1); renderDrawer(); break;
    case "rm-mockup": await rmMockup(id); break;
    case "zoom": $("#lightRoot").innerHTML=`<div class="lightbox" data-act="unzoom"><img src="${esc(t.dataset.src)}" alt=""><button type="button" class="btn small" data-act="unzoom">Close</button></div>`; break;
    case "unzoom": $("#lightRoot").innerHTML=""; break;
    case "copy": { const el=document.getElementById(v); try{ await navigator.clipboard.writeText(el.value); toast("Copied. Paste it into the group chat."); }catch(e){ el.focus(); el.select(); toast("Text selected. Copy it from here."); } break; }
    case "copytext": try{ await navigator.clipboard.writeText(v); toast("Copied "+v); }catch(e){ toast(v); } break;
  }
});
document.addEventListener("input", ev=>{
  const t=ev.target;
  if(t.id==="q-jobs"){ S.q.jobs=t.value; renderMain(); }
  else if(t.id==="q-clients"){ S.q.clients=t.value; renderMain(); }
  else if(t.id==="q-tray"){ S.q.tray=t.value; renderMain(); }
  else if(t.id==="compose-text"){ S.compose.text=t.value; }
  else if(t.id==="py-amount"&&S.form&&S.form.pay){ S.form.pay.manual=true; }
  else if((t.id==="m-price"||t.id==="m-ss") && S.form){ readJobForm(); const c=$("#calc"); const p=Number(String(S.form.fin.price||"").replace(/[$,]/g,"")); c.innerHTML=p?calcLines(S.form.job,p,S.form.fin.ssPct):`<span class="count">Enter a price to see the split.</span>`; }
});
document.addEventListener("change", async ev=>{
  const t=ev.target;
  if(t.id&&t.id.startsWith("pj-")&&S.form&&S.form.pay){ const jid=t.id.slice(3); t.checked?S.form.pay.jobs.add(jid):S.form.pay.jobs.delete(jid);
    if(!S.form.pay.manual){ let tot=0; document.querySelectorAll('#payForm input[id^="pj-"]:checked').forEach(x=>tot+=Number(x.dataset.jamt)); $("#py-amount").value=tot?tot.toFixed(2):""; } return; }
  if(["sl-by","sl-ref"].includes(t.id)&&S.form&&S.form.sale){ readSale(); renderDrawer(); return; }
  if(["m-soldby","m-ref"].includes(t.id)&&S.form&&S.form.sold){ readJobForm(); renderDrawer(); return; }
  if(t.dataset&&t.dataset.jbh&&S.jbh){ t.checked?S.jbh.sel.add(t.dataset.jbh):S.jbh.sel.delete(t.dataset.jbh); const c=document.querySelector("[data-act=jbh-add]"); if(c) c.disabled=!S.jbh.sel.size; const k=c&&c.previousElementSibling; if(k) k.textContent=S.jbh.sel.size+" picked"; return; }
  if(t.dataset&&t.dataset.notify){ const N={...((PL.me()||{}).notify||{}),[t.dataset.notify]:t.checked}; try{ await PL.setNotify(N); }catch(e){ toast(/function|exist/i.test(e.message)?"Run update 16 in Supabase first.":e.message); } return; }
  if(t.id==="meet-on"){ await saveMeet({on:t.checked}); return; }
  if(t.id==="meet-time"&&t.value){ await saveMeet({time:t.value}); return; }
  if(t.dataset&&t.dataset.meetDay!=null){ const d=+t.dataset.meetDay, c=meetCfg(); await saveMeet({days:t.checked?[...new Set([...c.days,d])].sort():c.days.filter(x=>x!==d)}); return; }
  if(t.id==="act-who"){ ACT.who=t.value; ACT.rows=null; renderMain(); return; }
  if(t.dataset&&t.dataset.otFor){ await saveOt(t.dataset.otFor,t.value==="1"); return; }
  if(t.dataset&&t.dataset.rateFor){ await saveRate(t.dataset.rateFor,t.value); return; }
  if(t.dataset&&t.dataset.photoFor){ await changePhoto(t.files[0], t.dataset.photoFor); return; }
  if(t.id==="compose-files"){ S.compose.files.push(...t.files); renderDrawer(); }
  else if(t.id==="mockup-file"){ await addMockups([...t.files]); }
  else if(t.id==="f-client"){ readJobForm(); renderDrawer(); }
});
document.addEventListener("submit", ev=>{
  ev.preventDefault();
  if(ev.target.id==="treqForm") return saveTimeReq(ev.target);
  if(ev.target.id==="saleForm") return saveSale(ev.target);
  if(ev.target.id==="clockForm") return saveClockEdit(ev.target);
  if(ev.target.id==="svcForm") return saveSvc(ev.target);
  if(ev.target.id==="issueForm") return saveIssue(ev.target);
  if(ev.target.id==="ctForm") return saveCrewTruck(ev.target);
  if(ev.target.id==="partialForm"){ readPartialForm(); return savePartial(ev.target); }
  if(ev.target.id==="returnForm"){ const [a,b]=ev.target.dataset.key.split("|"); return addReturn(a,b,$("#rt-date").value,$("#rt-time").value,null,false).then(()=>openDrawer("job",a)).catch(e=>fail(e,"add the return visit")); }
  if(ev.target.id==="chatForm") return sendChat();
  if(ev.target.id==="payForm") return savePay();
  if(ev.target.id==="assignForm") return saveAssign(ev.target.dataset.key,{truck:$("#as-truck").value,trailer:$("#as-trailer").value,note:$("#as-note").value.trim()});
  if(ev.target.id==="pinForm") return saveMyPin(); if(ev.target.id==="personForm") return savePerson();
  if(ev.target.id==="jobForm") saveJob(); else if(ev.target.id==="clientForm") saveClient(); else if(ev.target.id==="settingsForm") saveSettings();
});
document.addEventListener("keydown", ev=>{ if(ev.key==="Escape"){ if($("#lightRoot").innerHTML) $("#lightRoot").innerHTML=""; else if(S.drawer) closeDrawer(); } });

/* ---------- boot ---------- */
renderMain();
(async()=>{
  const use = n => (window.claude && window.claude.use) ? window.claude.use(n).catch(()=>null) : Promise.resolve(null);
  const [db,user,assets]=await Promise.all([use("db"),use("user"),use("assets")]);
  S.user=user; S.assets=assets;
  if(!db){ S.err="The board can't load here. Open it signed in to claude.ai."; renderMain(); return; }
  S.db=db;
  if(user){ const me=await user.me(); S.me.id=me.id; applyPerms(me.perms); }
  if(!ls("team")) S.team="all"; else if(S.team!=="all") S.team=normCrew(S.team);
  { const P0=PL.me(); if(P0&&!P0.all_crews&&P0.crew) S.team=P0.crew; }
  const got={c:false,j:false,l:false};
  const ready=()=>{ if(got.c&&got.j){ S.ready=true; setTimeout(fillPins,4000); if(ls("autoClock")==="1"&&S.me.canLog&&!AUTO.on) setTimeout(()=>setAuto(true),1200); setTimeout(jobberAuto,1500); } };
  setTimeout(()=>{ if(!S.ready){ S.err="The board is taking too long to load. Check your connection and reload."; renderMain(); } }, 12000);
  db.collection("clients").onSnapshot(s=>{ S.clients=new Map(s.docs.map(d=>[d.id,d.data()])); got.c=true; ready(); refresh(); }, e=>{ S.err="Lost connection to the board. Reload the page."; renderMain(); });
  db.collection("jobs").onSnapshot(s=>{ S.jobs=new Map(s.docs.map(d=>[d.id,d.data()])); got.j=true; ready(); refresh(); }, e=>{ S.err="Lost connection to the board. Reload the page."; renderMain(); });
  db.collection("log").onSnapshot(s=>{ S.log=new Map(s.docs.map(d=>[d.id,d.data()])); recompute(); got.l=true; refresh(); fetchNames(); }, e=>{ got.l=true; refresh(); });
  db.doc("settings/board").onSnapshot(s=>{ S.settings=s.exists?s.data():{}; refresh(); }, e=>{});
  loadChat();
  db.collection("settings").onSnapshot(s=>{ { const fm=s.docs.find(d=>d.id==="former"); S.former=fm?fm.data()||{}:{}; const si=s.docs.find(d=>d.id==="signin"); if(si) setTimeout(()=>checkForcedSignIn(si.data()),0); } S.dayCfg=new Map(s.docs.filter(d=>d.id.startsWith("day-")).map(d=>[d.id.slice(4),d.data()])); refresh(); }, e=>{});
  if(S.me.money){
    db.collection("fin").onSnapshot(s=>{ const m=new Map(), pays=new Map(); for(const d of s.docs){ if(d.id==="settings") S.finSet=d.data(); else if(d.id==="payroll") S.payroll=d.data()||{}; else if(d.id.startsWith("pay-")) pays.set(d.id,d.data()); else m.set(d.id,d.data()); } S.fin=m; S.pays=pays; S.stmt=null; refresh(); }, e=>{});
  }
})();
</script>
