name: Check lunch search
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          Q1='[out:json][timeout:8];(node["amenity"~"^(fast_food|cafe|restaurant)$"](around:4500,30.52,-84.24);way["amenity"~"^(fast_food|cafe|restaurant)$"](around:4500,30.52,-84.24););out center tags 150;'
          for m in overpass-api.de overpass.kumi.systems overpass.private.coffee maps.mail.ru/osm/tools/overpass; do r=$(curl -sS -m 25 -A "ProLight-Season-Board/1.0 (prolight-boardv1.vercel.app)" -H "Accept: application/json" -o o.txt -w "%{http_code} %{time_total}s" --data-urlencode "data=$Q1" "https://$m/api/interpreter" || echo fail); echo "::notice::$m: $r $(grep -o '"amenity"' o.txt | wc -l) $(head -c 120 o.txt | tr '\n' ' ')"; done
          for a in fast_food restaurant; do r=$(curl -sS -m 20 -A "ProLight-Season-Board/1.0" -o n.txt -w "%{http_code} %{time_total}s" "https://nominatim.openstreetmap.org/search?amenity=$a&viewbox=-84.29,30.56,-84.19,30.48&bounded=1&format=jsonv2&limit=40&extratags=1" || echo fail); echo "::notice::nominatim $a: $r $(grep -o '"place_id"' n.txt | wc -l)"; sleep 1; done
          r=$(curl -sS -m 20 -o p.txt -w "%{http_code} %{time_total}s" "https://photon.komoot.io/api/?q=restaurant&lat=30.52&lon=-84.24&limit=40&osm_tag=amenity:restaurant" || echo fail); echo "::notice::photon: $r $(grep -o '"osm_id"' p.txt | wc -l)"
