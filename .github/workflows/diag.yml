name: Site diag
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Reach the board
        run: |
          for u in https://prolight-boardv1.vercel.app/ https://prolight-boardv1.vercel.app/api/health https://vercel.com/ https://xjjwhmrkeqrmkttombxx.supabase.co/rest/v1/; do
            echo "== $u"; getent hosts $(echo $u | cut -d/ -f3) || echo "DNS: no answer"
            curl -sS -o /tmp/b -w "HTTP %{http_code} in %{time_total}s ip=%{remote_ip}\n" --max-time 30 "$u" 2>&1 | tail -2; head -c 300 /tmp/b 2>/dev/null | tr '\n' ' '; echo
          done
