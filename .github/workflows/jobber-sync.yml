name: Jobber sync every 6 hours
on:
  schedule:
    - cron: "7 */6 * * *"
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Pull new ProLight jobs from Jobber
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "Add CRON_SECRET in GitHub > Settings > Secrets and variables > Actions"; exit 1; fi
          curl -sS --fail-with-body --max-time 90 -H "Authorization: Bearer $CRON_SECRET" "https://prolight-boardv1.vercel.app/api/jobber?action=cron"
