name: Jobber sync every 6 hours
on:
  schedule:
    - cron: "7 */6 * * *"
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Pull new ProLight jobs from Jobber
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "::error::Add CRON_SECRET in GitHub > Settings > Secrets and variables > Actions"; exit 1; fi
          code=$(curl -sS --max-time 120 -o body.txt -w "%{http_code}" -H "Authorization: Bearer $CRON_SECRET" "https://prolight-boardv1.vercel.app/api/jobber?action=cron&quick=1" || echo 000)
          body=$(head -c 600 body.txt | tr '\n' ' ')
          if [ "$code" != "200" ]; then echo "::error::Board answered $code: $body"; exit 1; fi
          echo "::notice::Synced: $body"
